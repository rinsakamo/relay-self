name: L23 Paper x S7 Settling DEV
on:
  push:
    branches:
      - dev/l23-paper-settling-boundary-20261031
    paths:
      - adapters/mineflayer/l23_paper_s7_settling.py
      - adapters/mineflayer/l23_paper_live_assets.py
      - adapters/mineflayer/s49_normal_session_real_ci.py
      - tests/test_l23_paper_s7_settling.py
      - tests/test_l23_paper_live_assets.py
      - .github/workflows/l23-paper-settling-dev.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-shape-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: L23 original source gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          ruff check adapters/mineflayer/l23_paper_s7_settling.py adapters/mineflayer/l23_paper_live_assets.py adapters/mineflayer/s49_normal_session_real_ci.py tests/test_l23_paper_s7_settling.py tests/test_l23_paper_live_assets.py
          python -m compileall -q adapters/mineflayer/l23_paper_s7_settling.py adapters/mineflayer/l23_paper_live_assets.py adapters/mineflayer/s49_normal_session_real_ci.py tests/test_l23_paper_s7_settling.py tests/test_l23_paper_live_assets.py
          python -m pytest -o addopts='' -q tests/test_l23_paper_s7_settling.py tests/test_l23_paper_live_assets.py tests/test_l22_post_s16_settling.py tests/test_l22_runtime_settling.py tests/test_l21_goal_observer_source.py
          python tools/check_repository.py
      - name: Evidence ceiling
        if: always()
        run: echo 'L23 DEV_ONLY / PINNED_PAPER_LIVE_GATE_OFFLINE_TEST / PAPER_ORIGINAL_0 / NO_EFFECTIVE_INPUT_CLEAR_TICK / GOAL_UNDETERMINED / L10_S10_S11_P1_0'
