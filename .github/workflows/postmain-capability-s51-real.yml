name: Post-MAIN S51 real survival hunger to EAT
on:
  push:
    branches:
      - self/postmain-feature-s51-eat-execution-20261009
  pull_request:
    branches:
      - self/postmain-feature-s50-seek-execution-20261009
permissions:
  contents: read
jobs:
  s51-real-survival-eat:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      S51_REAL_SERVER_CI: '1'
      NODE_OPTIONS: ''
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Genuine Mineflayer package
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if(require('./adapters/mineflayer/node_modules/mineflayer/package.json').version !== '4.39.0') process.exit(2)"
      - name: Survival-mode native hunger, equip, consume, food delta
        run: |
          mkdir -p s51-artifacts
          python -B -m adapters.mineflayer.s51_eat_real_ci --report s51-artifacts/report.json --server-log s51-artifacts/minecraft.log
      - name: Preserve actual World result even on FAIL/BLOCKED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s51-real-survival-eat
          path: s51-artifacts/
          if-no-files-found: warn
          retention-days: 30
