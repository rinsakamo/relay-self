name: Unified v0.5 D11 repeated real hunt then original S51 natural EAT OFFLINE DEV
on:
  push:
    branches:
      - dev/unified-v05-d11-hunt-then-s51-eat-20261108
  pull_request:
    branches:
      - dev/unified-v05-d10-hunt-until-natural-drop-20261108

permissions:
  contents: read

jobs:
  preworld:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: D11 genuine STOP/EAT after zero-drop rearm with original D10/D7 physical regressions
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python tools/check_repository.py
          python -m compileall -q tools/bug0_d11_hunt_then_eat_world.py tools/bug0_d11_hunt_then_eat_post.py tests/test_d11_hunt_then_eat.py tools/bug0_d7f_natural_eat.py tools/bug0_d10_hunt_until_drop_world.py tools/bug0_d10_hunt_until_drop_post.py tests/test_d10_hunt_until_drop.py adapters/mineflayer/d6_loot_approach.py adapters/mineflayer/normal_action.py tools/bug0_d4_oneworld.py tools/bug0_d4_natural_loot_eat.py tools/bug0_d6_natural_move_world.py tools/bug0_d6_natural_move_post.py tools/bug0_d6_multigen_world.py tools/bug0_d6_multigen_post.py tests/test_d6_natural_drop_original_s49.py tests/test_d6_multigen_loop.py
          ruff check tools/bug0_d11_hunt_then_eat_world.py tools/bug0_d11_hunt_then_eat_post.py tests/test_d11_hunt_then_eat.py tools/bug0_d7f_natural_eat.py tools/bug0_d10_hunt_until_drop_world.py tools/bug0_d10_hunt_until_drop_post.py tests/test_d10_hunt_until_drop.py adapters/mineflayer/d6_loot_approach.py adapters/mineflayer/normal_action.py tools/bug0_d4_oneworld.py tools/bug0_d4_natural_loot_eat.py tools/bug0_d6_natural_move_world.py tools/bug0_d6_natural_move_post.py tools/bug0_d6_staged_move_world.py tests/test_d6_natural_drop_original_s49.py tests/test_d6_multigen_loop.py tools/bug0_d6_multigen_world.py tools/bug0_d6_multigen_post.py
          python -m pytest -q -x tests/test_d11_hunt_then_eat.py tests/test_d7f_natural_live_stop.py tests/test_d7f_natural_eat_post.py tests/test_d10_hunt_until_drop.py tests/test_d6_multigen_loop.py tests/test_d6_natural_drop_original_s49.py tests/test_d6_original_s49_loot_move.py tests/test_d6_loot_approach.py tests/test_d6_staged_move_world.py tests/test_c1_physical_action_fence.py tests/test_s49_nonmotion_physical_fence.py tests/test_bug0_d4_precombat_native_hunger.py tests/test_bug0_d4_post.py tests/test_bug0_d5_world_post.py tests/test_bug0_d5_fence_world_join.py tests/test_bug0_d5_intent_epoch_rearm.py
      - name: Build reused original Paper independent respawn and natural-drop witness
        run: |
          mvn -B -ntp -f adapters/mineflayer/zombie_respawn_dev/pom.xml -DskipTests package
          mvn -B -ntp -f adapters/mineflayer/zombie_drop_witness_dev/pom.xml -DskipTests package
      - name: Offline only
        run: |
          echo 'D11_ORIGINAL_S49_HUNT_UNTIL_DROP_REAL_S51_EAT_OFFLINE / WORLD0 / ACTION0 / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
