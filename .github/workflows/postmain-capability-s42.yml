name: Post-MAIN S42 real in-flight Node loss UNKNOWN and no retry

on:
  push:
    branches:
      - self/postmain-s42-world-conditioned-wait-vs-move-20261009
  pull_request:
    branches:
      - self/postmain-s41-post-unknown-new-world-action-20261009

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python tools/check_repository.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: S42 source and retained boundary preflight
        run: python -m pytest -q tests/test_postmain_s42_world_contrast.py
      - run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "ruff==0.16.7"
      - run: ruff check src tests experiments adapters observability

  mineflayer-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - run: npm run check --prefix adapters/mineflayer

  s42-real-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      S42_REAL_SERVER_CI: "1"
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
      NODE_OPTIONS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Verify genuine Mineflayer and unshimmed adapter
        run: |
          java -version
          node --version
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "const v=require('./adapters/mineflayer/node_modules/mineflayer/package.json').version; if(v!=='4.39.0') process.exit(2); console.log('S42_MINEFLAYER='+v)"
      - name: "Native near MOVE_AWAY real Action versus distant WAIT no Action under fixed policy"
        run: |
          mkdir -p s42-artifacts
          python -B -m adapters.mineflayer.s42_world_choice_real_ci \
            --report s42-artifacts/s42-report.json \
            --server-log s42-artifacts/minecraft-server.log
      - name: Preserve dynamic real-world evidence even on FAIL/BLOCKED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s42-world-conditioned-near-move-far-wait
          path: s42-artifacts/
          if-no-files-found: error
          retention-days: 30
