name: L Zombie Z2c H2 post-error source replay offline DEV
on:
  push:
    branches: [dev/l-zombie-z2c-model-feedback-20261103]
  pull_request:
    paths:
      - 'adapters/mineflayer/l_zombie_z2c_feedback_contract.py'
      - 'tools/l_zombie_z2c_h2_original_feedback.py'
      - 'tests/test_l_zombie_z2c_feedback_contract.py'
      - 'docs/l-zombie-z2c-posterror-h2-20261103.md'
      - '.github/workflows/l-zombie-z2c-h2-source-only-dev.yml'
permissions:
  contents: read
jobs:
  original-h1-to-h2-feedback-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:tests:.
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/l-zombie-z2c-pycache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source-test tools
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
      - name: Replay immutable archived 68 original Z2b files plus H2 negative controls
        run: |
          set -euo pipefail
          ruff check \
            adapters/mineflayer/l_zombie_z2c_feedback_contract.py \
            tools/l_zombie_z2c_h2_original_feedback.py \
            tests/test_l_zombie_z2c_feedback_contract.py
          python -m compileall -q \
            adapters/mineflayer/l_zombie_z2c_feedback_contract.py \
            tools/l_zombie_z2c_h2_original_feedback.py
          python -m pytest -p no:cacheprovider -o addopts='' -q \
            tests/test_l_zombie_z2c_feedback_contract.py \
            tests/test_l_zombie_z2b_policy_contract.py \
            tests/test_l_zombie_z2b_paper_policy_audit.py \
            tests/test_l_zombie_z2a_prospective_audit.py \
            tests/test_l_mp11_gemma_wire_contract.py
          python tools/check_repository.py
      - name: Explicit epistemic boundary
        run: echo 'Z2C_OFFLINE_H2_CONTRACT_ONLY / REPLAY_ARCHIVED_Z2B_68_ORIGINALS / REAL_NEW_GEMMA_0 / WORLD_0 / B1_N_REAL_H2_NOT_TESTED / B2_NOT_ESTABLISHED / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
