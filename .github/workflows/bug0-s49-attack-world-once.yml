name: Bug-0 S49 original supervised ATTACK one World DEV
on:
  push:
    branches:
      - dev/bug0-s49-supervised-attack-20261104

permissions:
  contents: read

jobs:
  original-s49-supervised-attack-once:
    # One physical World, only the exact operator-approved commit message.
    # A failed/partial physical strike MUST NEVER be automatically retried.
    # User authorized fresh Bug-0 DEV trial after offline #41813997934 SUCCESS.
    if: ${{ github.event.head_commit.message == 'run-bug0-s49-supervised-attack-once-20261104' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      S49_REAL_SERVER_CI: '1'
      S49_BUG0_ATTACK_DEV_ONLY: '1'
      NODE_OPTIONS: ''
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exactly authorized original S49 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Python runtime setup
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Original Mineflayer 4.39.0
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if (require('./adapters/mineflayer/node_modules/mineflayer/package.json').version !== '4.39.0') process.exit(2)"
      - name: Exactly one physical S49 ATTACK under original ActionSupervisor
        run: |
          mkdir -p attack-evidence
          python -B -m adapters.mineflayer.s49_normal_session_real_ci \
            --bug0-attack-dev \
            --report attack-evidence/s49_attack.json \
            --server-log attack-evidence/paper.log
      - name: Validate original native ATTACK command ACK without claiming hit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('attack-evidence/s49_attack.json').read_text())
          assert r['status'] == 'PASS', r.get('error')
          assert r['classification'] == 'DEV_ONLY_S49_SUPERVISED_ATTACK_EFFECT_APPLIED'
          actions = r['actual_native_actions']
          assert len(actions) == 1
          assert actions[0]['kind'] == 'ATTACK'
          assert actions[0]['terminal'] == 'outcome'
          assert actions[0]['same_supervisor'] is True
          assert r['attack_effect_commands_issued'] == 1
          assert r['attack_action_terminal'] == 'outcome'
          e = r['attack_evidence']
          assert e['effect'] == 'attack_entity'
          assert e['native_effect_result'] == 'applied'
          assert e['before_probe_seq'] < e['effect_seq'] < e['after_probe_seq']
          assert e['target_entity_id'] == actions[0]['target_entity_id']
          assert e['outcome_scope'] == 'ATTACK_COMMAND_EFFECT_APPLIED_ONLY'
          assert e['damage_attested'] is False and e['target_death_attested'] is False
          assert e['source_independently_attested'] is False
          assert r['real_model_calls'] == 0
          assert r['learning_in_world'] is False and r['m_energy_credited'] is False
          assert r['node_exit'] == 0 and r['server_exit'] == 0
          print('DEV_S49_ONE_ATTACK_EFFECT_ACK_PASS', e)
          PY
      - name: SHA256 original native evidence on all outcomes
        if: always()
        run: |
          if test -d attack-evidence; then
            (cd attack-evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          fi
      - name: Preserve report, Paper log and SHA256 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug0-s49-supervised-attack-one-world
          path: attack-evidence/
          if-no-files-found: warn
          retention-days: 30
