name: S57 owned llama-server instrument-only gate (NOT physical GPU evidence)
on:
  push:
    branches:
      - self/postmain-feature-s57-owned-local-llama-backend-20261009
  pull_request:
    branches:
      - self/postmain-feature-s56-live-model-world-overlap-20261009
permissions:
  contents: read
jobs:
  instrument-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.16.7'
      - name: Simulated local files and fail-closed runtime tests
        run: python -m pytest -q tests/test_feature_s57_owned_backend.py
      - name: Lint all S57 Python artifacts
        run: |
          python -m compileall -q adapters/mineflayer/s57_owned_llama_backend.py
          ruff check adapters/mineflayer/s57_owned_llama_backend.py tests/test_feature_s57_owned_backend.py
