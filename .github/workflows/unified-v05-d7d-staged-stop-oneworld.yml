name: Unified v0.5 D7-D S49 MOVE staged item + S50 + Paper tick same World DEV
on:
  pull_request:
    branches:
      - dev/unified-v05-d7c2-multigen-pickup-observation-20261107
    types: [synchronize]
    paths:
      - docs/unified-v05-d7d-staged-stop-pr-r2-trigger-20261107.md

permissions:
  contents: read

jobs:
  one-world:
    # A separate one-use trigger commit, never on normal source pushes.
    if: ${{ github.event.action == 'synchronize' && github.event.pull_request.head.sha == 'b56962c8a650252cc52dca0ce66842e7d6941560' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S49_REAL_SERVER_CI: '1'
      BUG0_PICKUP_D1_DEV_ONLY: '1'
      D6_STAGED_LOOT_MOVE_WORLD_ONLY: '1'
      D7_STAGED_STOP_SOURCE_WORLD_ONLY: '1'
      D7_PASSIVE_CONTROLS_WORLD_ONLY: '1'
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      NODE_OPTIONS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Strict one-time trigger and independent preworld negatives
        run: |
          test "$(git show --format= --name-only HEAD | sed '/^$/d')" = "docs/unified-v05-d7d-staged-stop-pr-r2-trigger-20261107.md"
          test "$(git show --format=%s -s HEAD)" = "run-unified-v05-d7d-staged-stop-oneworld-pr-r2-once-20261107"
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('docs/unified-v05-d7d-staged-stop-pr-r2-trigger-20261107.md').read_text()
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert 'parent_source_head: '+parent in p
          assert 'scope: ONE WORLD D7D STAGED REAL ITEM S49 MOVE PICKUP S50 PAPER STOP SENSOR NO EAT' in p
          PY
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python tools/check_repository.py
          ruff check tools/bug0_pickup_d1_world.py tools/bug0_d6_staged_move_world.py tools/bug0_d6_staged_move_post.py tools/bug0_d7_staged_stop_post.py tests/test_d7_staged_stop_post.py tests/test_d6_staged_move_world.py tests/test_d6_original_s49_loot_move.py adapters/mineflayer/normal_action.py
          python -m pytest -q -x tests/test_d7_staged_stop_post.py tests/test_d7_postmove_native_controls.py tests/test_d6_staged_move_world.py tests/test_d6_original_s49_loot_move.py tests/test_d6_loot_approach.py tests/test_bug0_pickup_d1_post.py tests/test_c1_physical_action_fence.py
          python - <<'PY'
          import socket
          with socket.socket(socket.AF_INET,socket.SOCK_STREAM) as sock:
              assert sock.connect_ex(('127.0.0.1',25565)) != 0
          PY
      - name: Download pinned official Paper 1.21.8 stable #60
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.parse,urllib.request
          url='https://fill.papermc.io/v3/projects/paper/versions/1.21.8/builds'
          req=urllib.request.Request(url,headers={'User-Agent':'RelaySelf-Bug0-R1/1.0 (https://github.com/rinsakamo/relay-self)'})
          with urllib.request.urlopen(req,timeout=50) as stream:
              builds=json.loads(stream.read(3000000))
          rows=[b for b in builds if b.get('channel')=='STABLE' and b.get('id')==60]
          assert len(rows)==1
          p=rows[0]['downloads']['server:default']
          assert p['name']=='paper-1.21.8-60.jar' and p['size']==52811717
          assert p['checksums']['sha256']=='8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e'
          uri=urllib.parse.urlparse(p['url'])
          assert uri.scheme=='https' and uri.hostname=='fill-data.papermc.io' and uri.path.startswith('/v1/objects/')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'paper-1.21.8.jar'
          digest=hashlib.sha256()
          with urllib.request.urlopen(urllib.request.Request(p['url'],headers={'User-Agent':'RelaySelf-Bug0-R1/1.0'}),timeout=120) as s, target.open('xb') as out:
              n=0
              while chunk:=s.read(1024*1024):
                  n+=len(chunk)
                  assert n<=52811717
                  digest.update(chunk)
                  out.write(chunk)
          assert n==52811717 and digest.hexdigest()==p['checksums']['sha256']
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('BUG0_PICKUP_PAPER_JAR='+str(target)+'\n')
          print('PINNED_PAPER_1_21_8_R1')
          PY
      - name: Compile pinned Paper operator-only staged item and reused read-only natural witness
        run: |
          mvn -B -ntp -f adapters/mineflayer/loot_pickup_fixture_dev/pom.xml -DskipTests package
          mvn -B -ntp -f adapters/mineflayer/zombie_drop_witness_dev/pom.xml -DskipTests package
          python - <<'PY'
          import hashlib,os,pathlib
          jar=pathlib.Path('adapters/mineflayer/loot_pickup_fixture_dev/target/relay-loot-pickup-dev-0.1.0-dev.jar').resolve()
          assert jar.is_file() and not jar.is_symlink()
          digest=hashlib.sha256(jar.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('BUG0_PICKUP_PLUGIN_JAR='+str(jar)+'\n')
              f.write('BUG0_PICKUP_PLUGIN_SHA256='+digest+'\n')
          print('R1_PAPER_PLUGIN_SHA256='+digest)
          witness=pathlib.Path('adapters/mineflayer/zombie_drop_witness_dev/target/relay-zombie-drop-witness-dev-0.1.0-dev.jar').resolve()
          assert witness.is_file() and not witness.is_symlink()
          wsha=hashlib.sha256(witness.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('BUG0_D7_PAPER_WITNESS_JAR='+str(witness)+'\n')
              f.write('BUG0_D7_PAPER_WITNESS_SHA256='+wsha+'\n')
          print('D7_PAPER_READONLY_WITNESS_SHA256='+wsha)
          PY
      - name: Install pinned Mineflayer 4.39
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if (require('./adapters/mineflayer/node_modules/mineflayer/package.json').version!=='4.39.0') process.exit(2)"
      - name: One isolated operator item stage and original S49 MOVE toward real Paper pickup
        run: |
          mkdir -p unified-v05-d7d-staged-stop-evidence
          python -B tools/bug0_d6_staged_move_world.py \
            --report unified-v05-d7d-staged-stop-evidence/report.json \
            --server-log unified-v05-d7d-staged-stop-evidence/paper_original.log \
            --move-fence unified-v05-d7d-staged-stop-evidence/original_s49_move_fence.json \
            --d7-staged-controls "$PWD/unified-v05-d7d-staged-stop-evidence/s50_same_original_client_controls.jsonl"
      - name: Post-World independent Paper staged item native movement S49 physical ledger audit
        run: |
          python -B tools/bug0_d6_staged_move_post.py \
            --report unified-v05-d7d-staged-stop-evidence/report.json \
            --server-log unified-v05-d7d-staged-stop-evidence/paper_original.log \
            --move-fence unified-v05-d7d-staged-stop-evidence/original_s49_move_fence.json \
            --out unified-v05-d7d-staged-stop-evidence/operator_post_audit.json
      - name: Independent staged Paper UUID + original S49/S50 client and Paper STOP source diagnostics
        run: |
          python -B tools/bug0_d7_staged_stop_post.py \
            --server-log unified-v05-d7d-staged-stop-evidence/paper_original.log \
            --report unified-v05-d7d-staged-stop-evidence/report.json \
            --staged-audit unified-v05-d7d-staged-stop-evidence/operator_post_audit.json \
            --native-sidecar unified-v05-d7d-staged-stop-evidence/s50_same_original_client_controls.jsonl \
            --out unified-v05-d7d-staged-stop-evidence/d7d_independent_stop_source.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('unified-v05-d7d-staged-stop-evidence')
          src=json.loads((p/'d7d_independent_stop_source.json').read_text())
          assert src['status']=='PASS_DEV'
          assert src['classification']=='D7_D_STAGED_PAPER_PICKUP_POSTMOVE_SOURCE_ONLY'
          assert src['item_origin']=='OPERATOR_FIXTURE_NOT_ZOMBIE_DROP'
          assert src['natural_zombie_drop_proven'] is False
          assert src['paper_postpickup_tick_rows']>=8
          assert src['body_physically_stopped_proven'] is False
          assert src['authenticated_S_owner_EAT_resume_grant'] is False
          assert src['original_EAT_issued'] is False
          print(src['classification'])
          PY
      - name: Preserve originals and SHA256
        if: always()
        run: |
          if test -d unified-v05-d7d-staged-stop-evidence; then
            (cd unified-v05-d7d-staged-stop-evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          fi
      - name: Store exact one-World DEV original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-v05-d7d-original-s49-staged-item-s50-paper-source
          path: unified-v05-d7d-staged-stop-evidence/
          if-no-files-found: warn
          retention-days: 30
