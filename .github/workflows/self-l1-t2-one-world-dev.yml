name: S49 G1 G2 Same Paper World Applied Gait DEV
on:
  push:
    branches:
      - self/dev-l1-t2-action-boundary-20261028
    paths:
      - .github/workflows/self-l1-t2-one-world-dev.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-l1-t2-world:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      DEV_OUTPUT: '/tmp/s49-l1-t2-one-world-${{ github.run_id }}-${{ github.run_attempt }}'
      S49_REAL_SERVER_CI: '1'
      S49_FORWARD_MOTOR_DEV_ONLY: '1'
      S49_L0_GOAL_LOOP_DEV_ONLY: '1'
      S49_L0_TURN_DEV_ONLY: '1'
      S49_L0_WALL_DEV_ONLY: '1'
      S49_L1_WAYPOINT_DEV_ONLY: '1'
      S49_L1_VOXEL_DEV_ONLY: '1'
      S49_L1_GRID_SEARCH_DEV_ONLY: '1'
      S49_L1_GRID_REFRESH_DEV_ONLY: '1'
      S49_L1_T2_CHANNEL_DEV_ONLY: '1'
      S49_L1_T2_BOUNDARY_DEV_ONLY: '1'
      S49_L1_G1_OBSERVATION_DEV_ONLY: '1'
      RELAYSELF_T1F_DEV: '1'
      RELAYSELF_PAPER_TICK_DEV: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2672d0a1fe15584d16c2426540c528410bbb8c27
          path: t1w-pinned-source
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Local focused validation and separate pinned T1w plugin build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C t1w-pinned-source rev-parse HEAD)" = 2672d0a1fe15584d16c2426540c528410bbb8c27
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          env -u S49_L1_T2_CHANNEL_DEV_ONLY -u S49_L1_T2_BOUNDARY_DEV_ONLY -u RELAYSELF_T1F_DEV -u RELAYSELF_PAPER_TICK_DEV -u S49_L1_G1_OBSERVATION_DEV_ONLY python -m pytest -q tests/test_s49_t2_applied_gait_observation_dev.py tests/test_s49_l1_t2_shared_paper_dev.py tests/test_s49_goal_t2_boundary_dev.py tests/test_s49_l1_grid_search_dev.py
          python -m compileall -q adapters/mineflayer/s49_goal_loop_real_dev.py adapters/mineflayer/s49_t2_applied_gait_observation_dev.py
          node --check adapters/mineflayer/bridge.mjs
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          mvn -B -ntp -f t1w-pinned-source/adapters/mineflayer/m02_paper_dev/pom.xml -DskipTests package
      - name: Fetch SHA256-pinned Paper 1.21.8 DEV server
        run: |
          set -euo pipefail
          mkdir -p "$DEV_OUTPUT"
          python - <<'PY'
          import hashlib,os,pathlib,urllib.request
          root=pathlib.Path(os.environ["DEV_OUTPUT"])
          url="https://fill-data.papermc.io/v1/objects/8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e/paper-1.21.8-60.jar"
          req=urllib.request.Request(url,headers={"User-Agent":"RelaySelf-L1T2-DEV"})
          with urllib.request.urlopen(req,timeout=120) as src:
              data=src.read(53_000_000)
          assert len(data)==52811717
          assert hashlib.sha256(data).hexdigest()=="8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e"
          (root/"paper.jar").write_bytes(data)
          PY
      - name: One genuinely disposable L1 path and T2 Paper World
        run: |
          set -euo pipefail
          PLUGIN="$PWD/t1w-pinned-source/adapters/mineflayer/m02_paper_dev/target/relay-metabolism-paper-dev-0.2.0-dev.jar"
          test -s "$PLUGIN"
          python -m adapters.mineflayer.s49_goal_loop_real_dev \
            --output-dir "$DEV_OUTPUT/WORLD1" \
            --confirm S49-GOAL-L0-DEV-DISPOSABLE-WORLD \
            --paper-jar-dev "$DEV_OUTPUT/paper.jar" \
            --paper-plugin-dev "$PLUGIN" --paper-gait-observation-dev \
            --offset-m 4.0 --obstacle-wall-dev --detour-after-wall-dev \
            --native-voxel-map-dev --local-grid-search-dev --left-lane-block-dev \
            > "$DEV_OUTPUT/producer.stdout" 2>&1 || {
              cat "$DEV_OUTPUT/producer.stdout"; exit 1;
            }
          cat "$DEV_OUTPUT/producer.stdout"
          python -m adapters.mineflayer.s49_goal_loop_real_dev \
            --output-dir "$DEV_OUTPUT/WORLD2" \
            --confirm S49-GOAL-L0-DEV-DISPOSABLE-WORLD \
            --paper-jar-dev "$DEV_OUTPUT/paper.jar" \
            --paper-plugin-dev "$PLUGIN" --paper-gait-observation-dev \
            --offset-m 4.0 --obstacle-wall-dev --detour-after-wall-dev \
            --native-voxel-map-dev --local-grid-search-dev --left-lane-block-dev \
            --grid-refresh-dev --grid-midroute-obstacle-dev \
            > "$DEV_OUTPUT/producer-world2.stdout" 2>&1 || {
              cat "$DEV_OUTPUT/producer-world2.stdout"; exit 1;
            }
          cat "$DEV_OUTPUT/producer-world2.stdout"
          # WORLD3 changes only the originally-authorized first physical
          # Action to the existing S49 forward+sprint motor reference.
          # It never issues an unowned direct control command.
          S49_GOAL_G2_SPRINT_FIRST_DEV_ONLY=1 S49_SPRINT_MOTOR_DEV_ONLY=1 \
          python -m adapters.mineflayer.s49_goal_loop_real_dev \
            --output-dir "$DEV_OUTPUT/WORLD3" \
            --confirm S49-GOAL-L0-DEV-DISPOSABLE-WORLD \
            --paper-jar-dev "$DEV_OUTPUT/paper.jar" \
            --paper-plugin-dev "$PLUGIN" --paper-gait-observation-dev \
            --offset-m 4.0 --g2-sprint-first-dev \
            > "$DEV_OUTPUT/producer-world3.stdout" 2>&1 || {
              cat "$DEV_OUTPUT/producer-world3.stdout"; exit 1;
            }
          cat "$DEV_OUTPUT/producer-world3.stdout"
          python - <<'PY'
          import json,os,pathlib
          report=json.loads((pathlib.Path(os.environ["DEV_OUTPUT"])/"WORLD1/goal_report.json").read_text())
          assert report["status"]=="PASS"
          assert report["real_world"] is True
          anchor=report["l1_t2_anchor_dev"]
          ledger=report["l1_t2_ledger_dev"]
          assert anchor["status"]=="ADMITTED"
          assert report["l1_t2_reanchored_probe_seq_dev"] > anchor["source_seq"]
          assert ledger["owner_failed"] is False
          assert ledger["rows"]>=1
          assert ledger["original_action_boundary_receipts"]>=2
          assert report["stage"]=="L1_DETOUR_ORIGINAL_GOAL_REACHED"
          assert ledger["continuous_gait_attested"] is False
          print("S49_L1_T2_SAME_PAPER_WORLD_DEV_PASS",anchor,ledger)
          import hashlib
          def verify_derived(name):
              folder=pathlib.Path(os.environ["DEV_OUTPUT"])/name
              r=json.loads((folder/"goal_report.json").read_text())
              p=folder/r["l1_t2_ledger_dev"]["derived_file"]
              raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==r["l1_t2_ledger_dev"]["derived_file_sha256"]
              rows=json.loads(raw)["rows"]
              assert len(rows)==r["l1_t2_ledger_dev"]["rows"]
              assert all(rows[i]["world_tick"]+1==rows[i+1]["world_tick"] for i in range(len(rows)-1))
              assert all(rows[i]["source_seq"]<rows[i+1]["source_seq"] for i in range(len(rows)-1))
              assert all("p1" in row and "m0" in row for row in rows)
              g=r["g1_applied_gait_observation_dev"]
              assert g["failed"] is False
              assert g["source_bound"] is True
              assert g["full_tick_gait_attested"] is False
              assert g["p1_transitions_posted"] == 0
              assert g["m0_extra_charge_posted"] == 0
              gfile=folder/g["derived_file"]
              assert hashlib.sha256(gfile.read_bytes()).hexdigest()==g["derived_file_sha256"]
              gdata=json.loads(gfile.read_text())
              grows=gdata["rows"]
              assert len(grows)==g["rows"]
              assert len(grows)==len(rows)+1
              assert all(x["full_tick_gait_attested"] is False for x in grows)
              assert all(x["p1_transition_posted"] is False for x in grows)
              assert all(x["m0_extra_charge_posted"] is False for x in grows)
              assert any(x["kind"]=="STABLE_PHYSICAL_IDLE_CANDIDATE" for x in grows)
              assert any(x["kind"]=="STABLE_ORDINARY_FORWARD_CANDIDATE" for x in grows)
              print("S49_G1_SAME_WORLD_OBSERVATION_DEV",name,g["kinds"])
              return r
          verify_derived("WORLD1")
          other=verify_derived("WORLD2")
          assert other["status"]=="PASS"
          assert other["stage"]=="L1_DETOUR_ORIGINAL_GOAL_REACHED"
          assert other["midroute_stone_stimulus_dev"]["native_confirmed"] is True
          assert len(other["detour"]["replan_events"])>=1
          assert other["l1_t2_ledger_dev"]["owner_failed"] is False
          assert other["l1_t2_ledger_dev"]["original_action_boundary_receipts"]>=2
          print("S49_L1_T2_SAME_PAPER_REFRESH_DEV_PASS",
                other["l1_t2_ledger_dev"],other["detour"]["final_parent_goal_error_m"])
          sprint=verify_derived("WORLD3")
          assert sprint["status"]=="PASS"
          assert sprint["g2_sprint_first_dev"] is True
          first=sprint["g2_first_original_motor_dev"]
          assert first["dispatch_effect"]=="set_forward_sprint_dev"
          assert first["dispatch_applied"] is True
          assert first["actual_gait_not_inferred_from_action"] is True
          g=sprint["g1_applied_gait_observation_dev"]
          # Requested sprint is NOT a physical claim. A matching stable
          # server + client observation is a separate physical candidate.
          assert g["kinds"].get("STABLE_SPRINT_FORWARD_CANDIDATE",0)>=1
          assert sprint["l1_t2_ledger_dev"]["owner_failed"] is False
          assert sprint["l1_t2_ledger_dev"]["original_action_boundary_receipts"]>=1
          print("S49_G2_ORIGINAL_S49_SPRINT_AND_T1U_PAPER_CANDIDATE_DEV_PASS",
                first,g["kinds"])
          PY
      - name: Preserve all attempts and original DEV World
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s49-l1-t2-paper-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEV_OUTPUT }}/
            !${{ env.DEV_OUTPUT }}/paper.jar
            !${{ env.DEV_OUTPUT }}/WORLD1/**/paper.jar
          retention-days: 7
          if-no-files-found: warn
      - name: Classification
        if: always()
        run: echo 'DEV_ONLY / R_QUALIFICATION_NO_GO / SCIENCE_NOT_RUN / EXACT_GAIT_UNKNOWN'
