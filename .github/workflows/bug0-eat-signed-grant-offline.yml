name: Bug-0 first EAT signed operator contract offline
on:
  push:
    branches:
      - dev/bug0-first-eat-signed-grant-20261104
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bug0-signed-eat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operator-contract-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact child SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install verifier and offline-only tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7 cryptography==46.0.4
      - name: Contract syntax and static checks
        run: |
          python tools/check_repository.py
          python -m compileall -q adapters/mineflayer/bug0_eat_grant_contract.py tests/test_bug0_eat_grant_contract.py
          ruff check adapters/mineflayer/bug0_eat_grant_contract.py tests/test_bug0_eat_grant_contract.py
      - name: Signature verification and original source/Action regressions
        run: |
          python -m pytest -q tests/test_bug0_eat_grant_contract.py tests/test_bug0_first_eat_shadow.py tests/test_bug0_s49_s51_eat_handoff.py tests/test_bug0_s51_eat_owner_binding.py tests/test_feature_s51_eat_execution.py tests/test_feature_s46_eat.py tests/test_feature_s49_normal_runtime.py
      - name: Evidence ceiling
        run: |
          echo 'READ_ONLY_SIGNATURE_PROOF / WORLD_0 / ACTION_0 / EAT_COMMAND_0 / SOURCE_UNATTESTED / NO_AUTHORIZED_ISSUE / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
