name: Unified D5 C1 S49 nonmotion physical fence joint regressions OFFLINE
on:
  push:
    branches:
      - dev/unified-v05-s49-attack-eat-preissue-fence-20261107
permissions:
  contents: read
jobs:
  joint-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Repository contract, source and original D4/D5 negative guards
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python tools/check_repository.py
          python -m compileall -q src/relay_self/s49_nonmotion_physical_fence.py adapters/mineflayer/normal_action.py adapters/mineflayer/eat_execution.py tools/bug0_d4_oneworld.py tools/bug0_d4_natural_loot_eat.py tools/bug0_d5_oneworld.py tests/test_s49_nonmotion_physical_fence.py
          ruff check src/relay_self/s49_nonmotion_physical_fence.py adapters/mineflayer/normal_action.py adapters/mineflayer/eat_execution.py tools/bug0_d4_oneworld.py tools/bug0_d4_natural_loot_eat.py tools/bug0_d5_oneworld.py tests/test_s49_nonmotion_physical_fence.py
      - name: Same source head both original S49 D5 and C1 owner regressions
        run: |
          python -m pytest -x -q \
            tests/test_s49_nonmotion_physical_fence.py \
            tests/test_bug0_d5_intent_epoch_rearm.py \
            tests/test_bug0_d5_world_post.py \
            tests/test_bug0_d4_post.py \
            tests/test_bug0_d4_precombat_native_hunger.py \
            tests/test_bug0_s49_repeat_attack.py \
            tests/test_bug0_s49_attack_owner.py \
            tests/test_bug0_s49_s51_eat_handoff.py \
            tests/test_unified_d5_c1_owner_integration.py \
            tests/test_c1_motion_journal.py \
            tests/test_c1_physical_action_fence.py \
            tests/test_s49_c1_motion_owner_dev.py \
            tests/test_bug0_intent_motion_source_join.py \
            tests/test_bug0_intent_motion_learning.py \
            tests/test_persistent_cognition.py
      - name: No new Minecraft World / no real Action / no Gemma
        run: |
          echo 'DEV_NONMOTION_PHYSICAL_FENCE_D5_C1_JOINT_OFFLINE_PASS'
          echo 'WORLD0 / REAL_ACTION0 / GEMMA0 / QUALIFICATION_NO_GO'
