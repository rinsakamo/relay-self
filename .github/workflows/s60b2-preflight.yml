name: S60-B2 exact-head P0 preflight

on:
  pull_request:
    branches:
      - self/s60b1-loopback-adapter-20261010
  push:
    branches:
      - self/s60b2-p0-*

permissions:
  contents: read

concurrency:
  group: relay-self-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify frozen manifest and unchanged predecessor tree
        run: |
          sha256sum -c docs/s60a/manifest.sha256
          echo "68e7983c06e4501cab519a0c55fe0f9e14ef336058310191e22891f0d016b739  docs/s60b1/manifest.md" | sha256sum -c
          test "$(git rev-parse HEAD:docs/s60b1/manifest.md)" = "965a76c8205c36e7e352b072f47c01456fcd36ad"
          echo "1ce5eefa1125d9701f0987cf2ea14489a6c978720f06d89bb3f5a1522560e07d  docs/s60b2/manifest.md" | sha256sum -c
          test "$(git rev-parse HEAD:docs/s60b2/manifest.md)" = "4cedce0f658f6a938bf1bf93b7f484ea2db41fa9"
          git merge-base --is-ancestor 227eb8200e4c55d85ca4cfaa12df3771c72255d9 HEAD
          test -z "$(git diff --name-only --diff-filter=CDMRTUXB 66b8045fd2b47d9c35febb12c495379d1248bb4e HEAD)"

      - name: Verify repository contracts
        run: python tools/check_repository.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node 22 for inherited offline subprocess tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"

      - name: Run deterministic tests
        run: |
          python -B -m adapters.mineflayer.s60b2_owned_backend_probe --plan
          python -m pytest tests/test_feature_s60b2_preflight.py tests/test_feature_s60b1_adapter.py tests/test_feature_s60a_displacement.py
          python -m pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.16.7"

      - name: Run lint
        run: ruff check src tests experiments adapters observability

  mineflayer-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install locked Mineflayer dependency graph
        run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer

      - name: Verify Mineflayer adapter protocol
        run: npm run check --prefix adapters/mineflayer
