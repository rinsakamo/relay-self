          assert g410h["original_g49_unknown_unchanged"]==g49h["still_unknown_worldticks"]
          g410_file=folder/g410h["derived_file"]
          assert hashlib.sha256(g410_file.read_bytes()).hexdigest()==g410h["derived_file_sha256"]
          assert len(json.loads(g410_file.read_text())["rows"])==g410h["original_in_action_unknown"]
          assert j["g411_g1_unstable_pair_census_dev"] is True
          g411h=j["g411_g1_pair_audit_dev"]
          assert g411h and not g411h["new_p1_or_m0_posting"]
          assert not g411h["full_physics_tick_attested"]
          assert not g411h["physical_cadence_causality_proven"]
          assert g411h["additional_native_readers_or_t2_owners"]==0
          assert g411h["original_g410_sha256"]==g410h["derived_file_sha256"]
          assert g411h["original_g49_sha256"]==g49h["derived_file_sha256"]
          assert g411h["original_t2_sha256"]==j["l1_t2_ledger_dev"]["derived_file_sha256"]
          assert g411h["original_g49_unknown_unchanged"]==g49h["still_unknown_worldticks"]
          g411_file=folder/g411h["derived_file"]
