          assert j["g412_original_control_boundary_dwell_dev"] is True
          g412h=j["g412_boundary_dwell_audit_dev"]
          assert g412h and not g412h["new_p1_or_m0_posting"]
          assert not g412h["physical_motor_switch_tick_attested"]
          assert g412h["additional_motor_or_reader"]==0
          assert g412h["original_g411_sha256"]==g411h["derived_file_sha256"]
          assert g412h["original_g410_sha256"]==g410h["derived_file_sha256"]
          assert g412h["original_g49_sha256"]==g49h["derived_file_sha256"]
          assert g412h["original_t2_sha256"]==j["l1_t2_ledger_dev"]["derived_file_sha256"]
          assert g412h["original_g49_unknown_unchanged"]==g49h["still_unknown_worldticks"]
          g412_file=folder/g412h["derived_file"]
          assert hashlib.sha256(g412_file.read_bytes()).hexdigest()==g412h["derived_file_sha256"]
          b=json.loads(g412_file.read_text())["rows"]
          assert len(b)==g412h["original_g411_source_boundary_count"]
