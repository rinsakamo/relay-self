          assert hz["s16_after_seq"]>hz["applied_clear_seq"]
          assert hz["terminal"]=="unknown" and hz["s16_status"]=="failed"
          assert hz["new_s49_actions_after_hazard"]==0
          assert hz["t2_expected_refusal"] and not hz["p1_credit_awarded"]
          assert len(j["native_actions"])==2
          assert j["native_actions"][-1]["s16_terminal"]=="unknown"
          assert j["g45_paper_transition_windows_dev"]
          assert j["g46_native_paper_generations_dev"]
          ga=j["g47_worldtick_gait_audit_dev"]
          assert ga and not ga["p1_or_m0_reposted"]
          assert ga["additional_t2_readers_or_owners"]==0
          assert ga["original_t2_worldtick_rows"]==j["l1_t2_ledger_dev"]["rows"]
          g48h=j["g48_direct_worldtick_audit_dev"]
          assert g48h and g48h["original_t2_worldtick_rows"]==ga["original_t2_worldtick_rows"]
          assert g48h["new_direct_action_stable_candidates"]==0, (
              "Hazard is inside original RUN->JOG sub-effect, not a new ordinary JOG Action"
          )
          assert g48h["combined_unknown_worldticks"]==ga["unknown_worldticks"]
          assert not g48h["p1_or_m0_reposted"]
          g49h=j["g49_original_action_gap_audit_dev"]
