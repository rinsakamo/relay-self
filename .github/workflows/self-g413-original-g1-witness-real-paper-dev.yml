          assert all(not w["full_tick_gait_attested"]
                     for w in j["g45_paper_transition_windows_dev"])
          assert j["g3_single_t2_p1_m0_owner_dev"]["owner_failed"]
          refusal=j["l1_t2_ledger_dev"]["s16_refusal_diagnostic_dev"]
          assert refusal["reason"]=="NATIVE_TERMINAL_NOT_SAFE_FOR_T2"
          assert refusal["p1_credit_awarded"] is False
          assert refusal["additional_action_issued"] is False
          for key in ("l1_t2_ledger_dev","g1_applied_gait_observation_dev"):
              meta=j[key]
              file=folder/meta["derived_file"]
              assert hashlib.sha256(file.read_bytes()).hexdigest()==meta["derived_file_sha256"]
          print("G49_HAZARD_P1_M0_SOURCE_GAP_CENSUS_NO_SECOND_OWNER_PASS",
                json.dumps(hz,sort_keys=True))
