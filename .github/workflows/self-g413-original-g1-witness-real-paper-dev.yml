          assert j["g49_original_action_applied_acks_dev"]
          assert g48h["additional_native_readers_or_t2_owners"]==0
          audit_file=folder/ga["derived_file"]
          assert hashlib.sha256(audit_file.read_bytes()).hexdigest()==ga["derived_file_sha256"]
          joined=json.loads(audit_file.read_text())
