          assert g413h["original_g411_sha256"]==g411h["derived_file_sha256"]
          assert g413h["original_g49_sha256"]==g49h["derived_file_sha256"]
          assert g413h["original_t2_sha256"]==j["l1_t2_ledger_dev"]["derived_file_sha256"]
          assert g413h["original_g49_unknown_unchanged"]==g49h["still_unknown_worldticks"]
          g413_file=folder/g413h["derived_file"]
