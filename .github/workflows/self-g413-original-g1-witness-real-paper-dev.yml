name: S49 G4.13 Original G1 Witness Real Paper DEV
on:
  push:
    branches:
      - self/dev-g413-g1-generation-witness-20261030
    paths:
      - .github/workflows/self-g413-original-g1-witness-real-paper-dev.yml
      - adapters/mineflayer/g413_original_g1_generation_witness_dev.py
      - tests/test_s49_g413_original_g1_generation_witness_dev.py
      - adapters/mineflayer/g412_original_control_boundary_dwell_dev.py
      - tests/test_s49_g412_original_control_boundary_dwell_dev.py
      - adapters/mineflayer/g411_g1_unstable_pair_census_dev.py
      - tests/test_s49_g411_g1_unstable_pair_census_dev.py
      - adapters/mineflayer/g410_in_action_evidence_quality_dev.py
      - tests/test_s49_g410_in_action_evidence_quality_dev.py
      - .github/workflows/self-g4-observed-gait-goal-paper-dev.yml
      - adapters/mineflayer/g4_observed_gait_choice_dev.py
