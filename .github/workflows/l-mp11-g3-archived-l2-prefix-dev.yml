name: L MP11 G3 archived source to L2 prefix offline DEV
on:
  push:
    branches: [dev/l-mp11-g3-archived-l2-prefix-20261101]
  pull_request:
    paths:
      - 'adapters/mineflayer/l_mp11_g3_archived_l2_prefix.py'
      - 'tests/test_l_mp11_g3_archived_l2_prefix.py'
      - 'docs/evidence/issue653-mp11-g3-one-paper-world-20261101/run1/independent-native-paper-readback.json'
      - '.github/workflows/l-mp11-g3-archived-l2-prefix-dev.yml'
permissions:
  contents: read
jobs:
  postrun-prefix-no-future-leak:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src:tests:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin offline tools
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
      - name: Test real archived evidence prefix and fake L2 RelayEngine boundary
        run: |
          set -euo pipefail
          ruff check adapters/mineflayer/l_mp11_g3_archived_l2_prefix.py tests/test_l_mp11_g3_archived_l2_prefix.py
          python -m compileall -q adapters/mineflayer/l_mp11_g3_archived_l2_prefix.py tests/test_l_mp11_g3_archived_l2_prefix.py
          python -m pytest -o addopts='' -q \
            tests/test_l_mp11_g3_archived_l2_prefix.py \
            tests/test_self_body_mp11_retained_shadow.py \
            tests/test_self_body_s50_l2_mp11_experiment.py
          python tools/check_repository.py
      - name: Epistemic scope
        run: echo 'ARCHIVED_G3_POSTRUN_PREFIX_ONLY / FAKE_L2 / NO_ACTUAL_GEMMA / NO_NEW_WORLD / ORIGINAL_G3_CHEAP_WINS / L0_UNCHANGED / SCIENCE_NOT_RUN'
