name: L Zombie Z1 Paper exact-tick source offline DEV
on:
  push:
    branches: [dev/l-zombie-20tick-prediction-source-gate-20261102]
  pull_request:
    paths:
      - 'adapters/mineflayer/l_zombie_paper_dev/**'
      - 'tools/l_zombie_paper_original_audit.py'
      - 'tests/test_l_zombie_paper_original_audit.py'
      - '.github/workflows/l-zombie-z1-paper-offline-dev.yml'
permissions:
  contents: read
jobs:
  strict-paper-31-tick-original-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:tests:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
      - run: |
          set -euo pipefail
          ruff check tools/l_zombie_paper_original_audit.py tests/test_l_zombie_paper_original_audit.py
          python -m compileall -q tools/l_zombie_paper_original_audit.py
          python -m pytest -o addopts='' -q \
            tests/test_l_zombie_paper_original_audit.py \
            tests/test_l_zombie_20tick_shadow.py \
            tests/test_self_world_observation_only_cognition.py \
            tests/test_l_mp11_b1_forecast_contract.py
          python tools/check_repository.py
      - run: echo 'PAPER_SOURCE_SHAPE_ONLY / NO ACTUAL JVM LIVE WORLD / CLIENT JOIN UNATTESTED / QUALIFICATION_NO_GO'
  isolated-paper-plugin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build opt-in isolated Paper 1.21.8 plugin, not launch a World
        run: |
          set -euo pipefail
          mvn -B -ntp -f adapters/mineflayer/l_zombie_paper_dev/pom.xml -DskipTests package
          jar tf adapters/mineflayer/l_zombie_paper_dev/target/relay-l-zombie-paper-dev-0.1.0-dev.jar | grep -F 'ZombieTickWitnessPlugin.class'
      - name: Not a physical zombie observation
        run: echo 'JAVA_BUILD_ONLY / PAPER_WORLD_0 / REAL_ZOMBIE_0 / NO_SELF_ACTION / QUALIFICATION_NO_GO'
