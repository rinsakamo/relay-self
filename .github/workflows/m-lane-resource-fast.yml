name: M Lane resource projection FAST
on:
  push:
    branches:
      - research/m616-m1-resource-cost-projection-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m-resource-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install focused test tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
      - name: Module and adjacent ownership tests
        run: |
          python -m pytest -q tests/test_metabolism_viability_experiment.py tests/test_metabolism_m01_minecraft.py tests/test_metabolism_m02_exhaustion.py tests/test_fatigue_p1.py tests/test_metabolism_resource_projection.py tests/test_metabolism_sensed_viability.py tests/test_metabolism_route_bounds.py
      - name: Ruff and repository contracts
        run: |
          ruff check experiments/metabolism_slm_dev_host_tap.py experiments/metabolism_s_l_m_post_epoch.py tests/test_metabolism_same_process_slm_product.py experiments/metabolism_l8_resource_shadow.py tests/test_metabolism_l8_product_contract.py experiments/metabolism_s_epoch_resource.py tests/test_metabolism_s_epoch_product_contract.py experiments/metabolism_b0_cognition.py tests/test_metabolism_b0_product_contract.py experiments/metabolism_route_bounds.py experiments/metabolism_resource_projection.py experiments/metabolism_sensed_viability.py experiments/metabolism_selfbody_cognition.py tests/test_metabolism_resource_projection.py tests/test_metabolism_sensed_viability.py tests/test_metabolism_route_bounds.py tests/test_metabolism_selfbody_product_contract.py
          python tools/check_repository.py
      - name: Checkout exact original SelfBody product in separate read-only directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 087fe095a87594505392262da1d341cf0c65b2b2
          path: product_selfbody_contract
          persist-credentials: false
      - name: Check actual S product SelfBody and B0 owner read-only contract
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          root = Path.cwd()
          product = root / "product_selfbody_contract"
          for path in (product, product / "src", product / "tests"):
              sys.path.insert(0, str(path))
          # Load original S product adapters and SelfBody, and permit only
          # M-owned experiment extensions absent from that product checkout.
          import experiments

          experiments.__path__.append(str(root / "experiments"))
          from adapters.mineflayer import python_protocol
          from relay_self import self_body

          assert Path(python_protocol.__file__).resolve().is_relative_to(product)
          assert Path(self_body.__file__).resolve().is_relative_to(product)
          import pytest

          raise SystemExit(pytest.main([
              "-q",
              "tests/test_metabolism_selfbody_product_contract.py",
              "tests/test_metabolism_b0_product_contract.py",
              "tests/test_metabolism_s_epoch_product_contract.py",
          ]))
          PY
      - name: Checkout exact original L8 observer in separate read-only directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4defb6e8b78f2e050921b521eb2253a14bc260c4
          path: product_l8_contract
          persist-credentials: false
      - name: Check original L8 result and M-only B0 shadow agreement
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          root = Path.cwd()
          product = root / "product_l8_contract"
          for path in (product, product / "src", product / "tests"):
              sys.path.insert(0, str(path))
          import experiments
          experiments.__path__.append(str(root / "experiments"))
          from relay_self import l1_epoch_observer, l1_s_choice_shadow
          assert Path(l1_epoch_observer.__file__).resolve().is_relative_to(product)
          assert Path(l1_s_choice_shadow.__file__).resolve().is_relative_to(product)
          import pytest
          raise SystemExit(pytest.main([
              "-q",
              "tests/test_metabolism_l8_product_contract.py",
              "product_l8_contract/tests/test_l1_epoch_observer.py",
          ]))
          PY
      - name: Same-process pinned S B0 owner and L8 original cognition on one probe
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          root = Path.cwd()
          s = root / "product_selfbody_contract"
          l8 = root / "product_l8_contract"
          # Actual product S/Body/S42 modules have priority; L8 adds only
          # independently owned missing learning modules, *not* S overrides.
          for p in (root, l8 / "src", l8, s / "tests", l8 / "tests", s, s / "src"):
              sys.path.insert(0, str(p))
          import experiments
          experiments.__path__.extend((
              str(root / "experiments"),
              str(l8 / "experiments"),
          ))
          import relay_self
          relay_self.__path__.append(str(l8 / "src" / "relay_self"))
          from adapters.mineflayer import b0_energy_bridge, python_protocol
          from relay_self import l1_epoch_observer, self_body
          assert Path(b0_energy_bridge.__file__).resolve().is_relative_to(s)
          assert Path(python_protocol.__file__).resolve().is_relative_to(s)
          assert Path(self_body.__file__).resolve().is_relative_to(s)
          assert Path(l1_epoch_observer.__file__).resolve().is_relative_to(l8)
          from experiments import metabolism_viability
          assert Path(metabolism_viability.__file__).resolve().is_relative_to(s)
          import pytest
          raise SystemExit(pytest.main([
              "-q", "tests/test_metabolism_same_process_slm_product.py",
          ]))
          PY
