name: Bug-0 S49 no-EAT three conditions one-shot real World DEV
on:
  push:
    branches:
      - dev/bug0-s49-refusal-priority-20261104

permissions:
  contents: read

jobs:
  one-native-s49-refusal-world:
    # Only the explicitly operator-approved commit may launch this World.
    # Any docs, tests, or bugfix push is SKIPPED, never an automatic retry.
    # Explicit DEV one-World invocation after offline CI #41790031004 SUCCESS.
    if: ${{ github.event.head_commit.message == 'run-bug0-s49-refusal-once-20261104' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      S49_REAL_SERVER_CI: '1'
      S49_BUG0_FOOD_REFUSAL_DEV_ONLY: '1'
      NODE_OPTIONS: ''
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout authorized exact DEV source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install existing S49 Python runtime dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Pin original Mineflayer runtime 4.39.0
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if (require('./adapters/mineflayer/node_modules/mineflayer/package.json').version !== '4.39.0') process.exit(2)"
      - name: One real S49 native World, three refusal conditions, no retry
        run: |
          mkdir -p world-evidence
          python -B -m adapters.mineflayer.s49_normal_session_real_ci \
            --bug0-food-refusal-dev \
            --report world-evidence/s49_refusal.json \
            --server-log world-evidence/paper.log
      - name: Assert full/no-food/zombie native decisions and zero S49 Actions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("world-evidence/s49_refusal.json").read_text())
          assert r["status"] == "PASS", r.get("error")
          assert r["classification"] == "DEV_ONLY_S49_FOOD_REFUSAL_NATIVE_3_CONDITIONS"
          x = r["refusal_outcomes"]
          assert x["full"] == "NOT_HUNGRY"
          assert x["hungry_without_food"] == "NO_INVENTORY_FOOD"
          assert x["hungry_with_zombie"] == "ZOMBIE_PRESENT_NO_DEFENSE_ADMISSION"
          assert x["no_s49_action_or_native_eat"] is True
          assert x["native_probe_seqs"] == sorted(x["native_probe_seqs"])
          assert len(set(x["native_probe_seqs"])) == 3
          assert r["actual_native_actions"] == []
          assert r["food_commands_issued"] == 0
          assert r["independent_eat_grant_attested"] is False
          assert r["m_energy_credited"] is False
          assert r["learning_in_world"] is False
          assert r["real_model_calls"] == 0
          assert r["node_exit"] == 0 and r["server_exit"] == 0
          print("S49_REFUSAL_NATIVE_DEV_PASS", x)
          PY
      - name: Save immutable evidence hashes also on failure
        if: always()
        run: |
          if test -d world-evidence; then
            (cd world-evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          fi
      - name: Upload original S49 report and Paper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug0-s49-native-no-eat-three-conditions-dev
          path: world-evidence/
          if-no-files-found: warn
          retention-days: 30
