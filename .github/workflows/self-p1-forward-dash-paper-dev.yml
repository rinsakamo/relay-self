# DEV retry: Paper PlayerInput unavailable from Mineflayer; evaluate bounded server position-direction fallback.
# Disposable operator-led motor DEV, NOT S49 original forward Action authorization.
name: P1 Forward DASH Paper Physical DEV
on:
  push:
    branches:
      - self/dev-p1-forward-dash-paper-20261025
    paths:
      - .github/workflows/self-p1-forward-dash-paper-dev.yml

permissions:
  contents: read

concurrency:
  group: p1-forward-dash-paper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  physical-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      DEV_OUTPUT: '/tmp/p1-forward-dash-${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preworld sanity and lightweight Python checks
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          python -m compileall -q adapters/mineflayer/p1_dash_paper_real_dev.py
          ruff check adapters/mineflayer/p1_dash_paper_real_dev.py
          python -m pytest -q tests/test_p1_gait_dev.py tests/test_fatigue_p1.py
          python - <<'PY'
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
              s.bind(("127.0.0.1", 25565))
          PY
      - name: Compile isolated Paper 1.21.8 modifier plugin
        run: |
          mvn -B -ntp -f adapters/mineflayer/p1_dash_paper_dev/pom.xml -DskipTests package
          test -f adapters/mineflayer/p1_dash_paper_dev/target/relay-p1-dash-paper-dev-0.1.0-dev.jar
      - name: Install existing unmodified Mineflayer bridge
        run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - name: Fetch official stable Paper 1.21.8 build 60 and verify published SHA256
        id: paper
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          version = "1.21.8"
          api = f"https://fill.papermc.io/v3/projects/paper/versions/{version}/builds"
          ua = "RelaySelf-S49-P1-WORLD-FIRST-DEV/0.1 (https://github.com/rinsakamo/relay-self)"
          req = urllib.request.Request(api, headers={"User-Agent": ua})
          with urllib.request.urlopen(req, timeout=50) as rsp:
              builds = json.loads(rsp.read(3_000_000))
          stable = [b for b in builds if b.get("channel") == "STABLE" and b.get("id") == 60]
          if len(stable) != 1:
              raise RuntimeError("Pinned Paper 1.21.8 stable build 60 unavailable")
          artifact = stable[0]["downloads"]["server:default"]
          expected = "8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e"
          if (artifact["checksums"]["sha256"] != expected
                  or artifact["size"] != 52811717):
              raise RuntimeError("Pinned original Paper build metadata mismatch")
          url = artifact["url"]
          parsed = urllib.parse.urlparse(url)
          if (parsed.scheme != "https" or parsed.hostname != "fill-data.papermc.io"
                  or not parsed.path.startswith("/v1/objects/")):
              raise RuntimeError("Untrusted Paper binary URL")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "paper-1.21.8-dev.jar"
          hash_ = hashlib.sha256()
          total = 0
          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua}), timeout=120) as src, target.open("xb") as dst:
              while chunk := src.read(1048576):
                  total += len(chunk)
                  if total > 52811717: raise RuntimeError("Paper size exceeded")
                  dst.write(chunk)
                  hash_.update(chunk)
          if total != 52811717 or hash_.hexdigest() != expected:
              raise RuntimeError("Paper downloaded bytes mismatch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"jar={target}\nsha256={expected}\n")
          print("PAPER_DEV_PINNED", total, expected)
          PY
      - name: Run one disposable Paper and one native operator motor owner
        env:
          PAPER_JAR: ${{ steps.paper.outputs.jar }}
          PAPER_SHA: ${{ steps.paper.outputs.sha256 }}
        run: |
          set -euo pipefail
          PLUGIN="$PWD/adapters/mineflayer/p1_dash_paper_dev/target/relay-p1-dash-paper-dev-0.1.0-dev.jar"
          PLUGIN_SHA="$(sha256sum "$PLUGIN" | cut -d' ' -f1)"
          python -m adapters.mineflayer.p1_dash_paper_real_dev \
            --output "$DEV_OUTPUT" \
            --paper "$PAPER_JAR" --paper-sha "$PAPER_SHA" \
            --plugin "$PLUGIN" --plugin-sha "$PLUGIN_SHA" \
            --confirm P1-DASH-PAPER-EPHEMERAL-DEV
      - name: Review one-run DEV server/native receipts
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["DEV_OUTPUT"])/"dash_dev_report.json").read_text())
          assert r["status"]=="PASS", r
          assert r["node_exit"]==0 and r["paper_exit"]==0
          assert r["native_s49_authorized"] is False
          assert r["new_action_grants"]==0
          assert r["m0_ledger_posted"] is False
          assert r["p1_world_state_updated"] is False
          assert r["paper_active_tick_is_full_tick_proof"] is False
          assert len(r["server_sprint_forward_observed_ticks"]) >= 2
          assert r["baseline"]["native_horizontal_displacement_m"] > .15
          assert r["dash"]["native_horizontal_displacement_m"] > .15
          print("P1_DASH_DISPOSABLE_NATIVE_PAPER_DEV",json.dumps(r,sort_keys=True))
          PY
      - name: Surface bounded DEV diagnostic (including pre-world failures)
        if: always()
        run: |
          if test -f "$DEV_OUTPUT/dash_dev_report.json"; then cat "$DEV_OUTPUT/dash_dev_report.json"; fi
          if test -f "$DEV_OUTPUT/paper_server.log"; then grep 'RELAY_DASH_' "$DEV_OUTPUT/paper_server.log" | tail -50 || true; fi
      - name: Preserve DEV original logs and movement report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-forward-dash-world-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEV_OUTPUT }}/dash_dev_report.json
            ${{ env.DEV_OUTPUT }}/paper_dash_rows.log
            ${{ env.DEV_OUTPUT }}/paper_server.log
          if-no-files-found: warn
          retention-days: 7
      - name: Boundary
        if: always()
        run: |
          echo 'Operator-motor DEV only; original S49 forward Action NOT authorized.'
          echo 'DEV_ONLY / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
