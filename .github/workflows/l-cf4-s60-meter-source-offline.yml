name: L Lane L-CF4 S60 usage candidate (offline)

on:
  push:
    branches:
      - 'learning/l-cf4-s60-meter-source-*'
  pull_request:
    branches:
      - 'learning/l-cf1-fatigue-meter-*'

permissions:
  contents: read

concurrency:
  group: l-cf4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metering-and-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact L-CF3 parent and repository contracts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 845435037fbafc3c0793d4641d7eebf39f9fb320 HEAD
          python tools/check_repository.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: L-CF4 original transport and existing fatigue negative controls
        env:
          PYTHONPATH: 'src:tests:.'
        run: |
          python -m pytest -q tests/test_cognitive_fatigue_s60_meter.py tests/test_cognitive_fatigue_s60.py tests/test_cognitive_fatigue.py tests/test_feature_s60b1_adapter.py tests/test_feature_s47_cognition.py tests/test_feature_s53_concurrent_cognition.py
      - name: Full inherited Python regression
        env:
          PYTHONPATH: 'src:tests:.'
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.7'
      - run: ruff check src tests experiments adapters observability
