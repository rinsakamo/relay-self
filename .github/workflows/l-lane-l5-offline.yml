name: L Lane L5 contextual shadow (offline)

on:
  push:
    branches:
      - 'learning/l5-contextual-shadow-*'
  pull_request:
    branches:
      - 'learning/l4-matched-transfer-*'

permissions:
  contents: read

concurrency:
  group: l-lane-l5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact L4 ancestry and L5 HEAD
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 28b90ad2f2d204a808610a36a8b619f2c194be73 HEAD
          python tools/check_repository.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Ephemeral GitHub worker only
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Focused L5–L1 and original S11 tests (no World)
        env:
          PYTHONPATH: 'src:tests:.'
        run: python -m pytest -q tests/test_contextual_shadow.py tests/test_learning_contrast.py tests/test_habit_shadow.py tests/test_forecast_bridge.py tests/test_experience_bridge.py tests/test_habit_qualification.py
      - name: Full inherited Python regression
        env:
          PYTHONPATH: 'src:tests:.'
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.7'
      - run: ruff check src tests experiments adapters observability
