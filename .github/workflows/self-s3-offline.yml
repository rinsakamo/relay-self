name: S Lane S3 offline Memory handoff

on:
  push:
    branches:
      - 'self/s-lane-s3-experience-*'
  pull_request:
    branches:
      - 'self/s-lane-s3-*'

permissions:
  contents: read

concurrency:
  group: s-lane-s3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s2-focused-and-full:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact S2 parent and S3 head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor c12a7bbc0fd0af4359c55926a0a22ea8c6ef9da6 HEAD
          python tools/check_repository.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Focused S3/S2 original source Memory handoff
        env:
          PYTHONPATH: 'src:tests:.'
        run: |
          python -m adapters.mineflayer.self_s1_runtime
          python -m pytest -q tests/test_self_s3_experience.py tests/test_experience_bridge.py tests/test_self_s2_integration.py tests/test_self_s1_runtime.py tests/test_self_continuous_host.py
      - name: Full Python regression (offline)
        env:
          PYTHONPATH: 'src:tests:.'
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.7'
      - run: ruff check src tests experiments adapters observability

  mineflayer-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Only in ephemeral CI. Never install packages into user RSEE.
      - run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - run: npm run check --prefix adapters/mineflayer
