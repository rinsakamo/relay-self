name: Unified v0.5 D6-B original S49 loot MOVE OFFLINE DEV
on:
  push:
    branches:
      - dev/unified-v05-d6-original-s49-loot-move-20261107

permissions:
  contents: read

jobs:
  original-loot-move:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Native loot candidate to same original S49 S15 S16 and C1 physical ledger
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python tools/check_repository.py
          python -m compileall -q adapters/mineflayer/normal_action.py adapters/mineflayer/d6_loot_approach.py tests/test_d6_original_s49_loot_move.py tests/test_d6_loot_approach.py
          ruff check adapters/mineflayer/normal_action.py adapters/mineflayer/d6_loot_approach.py tests/test_d6_original_s49_loot_move.py tests/test_d6_loot_approach.py
          python -m pytest -q -x tests/test_d6_original_s49_loot_move.py tests/test_d6_loot_approach.py tests/test_c1_physical_action_fence.py tests/test_s49_nonmotion_physical_fence.py tests/test_unified_d5_c1_owner_integration.py tests/test_bug0_d5_intent_epoch_rearm.py
      - name: No actual World or physical Action
        run: |
          echo 'D6_B_ORIGINAL_S49_FENCED_LOOT_MOVE_OFFLINE_PASS'
          echo 'WORLD0 / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
