name: L1-MP10 typed SelfBody next-epoch revision offline DEV
on:
  push:
    branches: [dev/l1-mp10-body-error-revision-20261101]
  pull_request:
    paths:
      - 'adapters/mineflayer/self_body_s50_l1_mp10_revision.py'
      - 'adapters/mineflayer/self_body_s50_world_dev.py'
      - 'adapters/mineflayer/self_body_s50_l1_mp8_physical.py'
      - 'tools/l1_mp10_two_world_dev.py'
      - 'tests/test_self_body_s50_l1_mp10_revision.py'
      - '.github/workflows/l1-mp10-typed-revision-offline-dev.yml'
permissions:
  contents: read
jobs:
  no-world-source-qualifications:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PYTHONPATH: src:tests:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned Python validation dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
      - name: MP10 typed body and owner boundary plus MP9/MP8 regression
        run: |
          set -euo pipefail
          ruff check adapters/mineflayer/self_body_s50_l1_mp10_revision.py adapters/mineflayer/self_body_s50_world_dev.py adapters/mineflayer/self_body_s50_l1_mp8_physical.py tools/l1_mp9_two_world_dev.py tools/l1_mp10_two_world_dev.py tests/test_self_body_s50_l1_mp10_revision.py
          python -m compileall -q adapters/mineflayer/self_body_s50_l1_mp10_revision.py adapters/mineflayer/self_body_s50_world_dev.py tools/l1_mp10_two_world_dev.py tests/test_self_body_s50_l1_mp10_revision.py
          python -m pytest -o addopts='' -q \
            tests/test_self_body_s50_l1_mp10_revision.py \
            tests/test_self_body_s50_l1_mp9_selector.py \
            tests/test_self_body_s50_l1_mp8_physical.py \
            tests/test_self_body_s50_live_next_epoch.py \
            tests/test_self_body_s50_route_b_dev.py
          python tools/check_repository.py
      - name: Original World, qualification, and science explicitly excluded
        run: echo 'MP10_OFFLINE_ONLY / PHYSICAL_WORLD_0 / L0_UNCHANGED / LEARNING_0 / R_NO_GO / V_NOT_RUN'
