name: S49 L1 Grid Refresh Focused DEV
on:
  push:
    branches:
      - self/dev-l1-grid-waypoint-refresh-20261028
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s49-l1-grid-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Python 3.12 focused DEV-only validation
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          python -m compileall -q src/relay_self/goal_grid_search_dev.py src/relay_self/goal_grid_refresh_dev.py adapters/mineflayer/s49_goal_executor_dev.py adapters/mineflayer/s49_goal_waypoint_route_dev.py adapters/mineflayer/s49_goal_loop_real_dev.py adapters/mineflayer/s49_l1_grid_refresh_review_dev.py tests/test_s49_l1_grid_refresh_dev.py
          ruff check src/relay_self/goal_grid_search_dev.py src/relay_self/goal_grid_refresh_dev.py adapters/mineflayer/s49_goal_executor_dev.py adapters/mineflayer/s49_goal_waypoint_route_dev.py adapters/mineflayer/s49_goal_loop_real_dev.py adapters/mineflayer/s49_l1_grid_refresh_review_dev.py tests/test_s49_l1_grid_refresh_dev.py
          python -m pytest -q tests/test_s49_l1_grid_refresh_dev.py tests/test_s49_l1_grid_search_dev.py tests/test_s49_l1_local_voxel_dev.py
      - name: Boundary
        if: always()
        run: echo 'DEV_ONLY / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'

  real-native-refresh:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      S49_REAL_SERVER_CI: '1'
      S49_FORWARD_MOTOR_DEV_ONLY: '1'
      S49_L0_GOAL_LOOP_DEV_ONLY: '1'
      S49_L0_TURN_DEV_ONLY: '1'
      S49_L0_WALL_DEV_ONLY: '1'
      S49_L1_WAYPOINT_DEV_ONLY: '1'
      S49_L1_VOXEL_DEV_ONLY: '1'
      S49_L1_GRID_SEARCH_DEV_ONLY: '1'
      S49_L1_GRID_REFRESH_DEV_ONLY: '1'
      DEV_OUTPUT: '/tmp/s49-l1-grid-refresh-${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install original pytest dependency
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Install original Mineflayer 4.39.0
        run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - name: Two independent live Minecraft Worlds - unchanged and midroute stone
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check adapters/mineflayer/bridge.mjs
          mkdir -m 700 "$DEV_OUTPUT"
          python -m adapters.mineflayer.s49_goal_loop_real_dev \
            --output-dir "$DEV_OUTPUT/UNCHANGED" \
            --confirm S49-GOAL-L0-DEV-DISPOSABLE-WORLD \
            --offset-m 4.0 --obstacle-wall-dev --detour-after-wall-dev \
            --native-voxel-map-dev --local-grid-search-dev --left-lane-block-dev \
            --grid-refresh-dev
          python -m adapters.mineflayer.s49_goal_loop_real_dev \
            --output-dir "$DEV_OUTPUT/MIDROUTE_BLOCKED" \
            --confirm S49-GOAL-L0-DEV-DISPOSABLE-WORLD \
            --offset-m 4.0 --obstacle-wall-dev --detour-after-wall-dev \
            --native-voxel-map-dev --local-grid-search-dev --left-lane-block-dev \
            --grid-refresh-dev --grid-midroute-obstacle-dev
          python -m adapters.mineflayer.s49_l1_grid_refresh_review_dev --root "$DEV_OUTPUT"
      - name: Preserve raw original sources even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s49-l1-grid-refresh-two-worlds-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEV_OUTPUT }}
          retention-days: 7
      - name: DEV-only no promotion
        if: always()
        run: echo 'DEV_ONLY / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
