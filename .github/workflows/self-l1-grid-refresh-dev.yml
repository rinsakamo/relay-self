name: S49 L1 Grid Refresh Focused DEV
on:
  push:
    branches:
      - self/dev-l1-grid-waypoint-refresh-20261028
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s49-l1-grid-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Python 3.12 focused DEV-only validation
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          python -m compileall -q src/relay_self/goal_grid_search_dev.py src/relay_self/goal_grid_refresh_dev.py tests/test_s49_l1_grid_refresh_dev.py
          ruff check src/relay_self/goal_grid_search_dev.py src/relay_self/goal_grid_refresh_dev.py tests/test_s49_l1_grid_refresh_dev.py
          python -m pytest -q tests/test_s49_l1_grid_refresh_dev.py tests/test_s49_l1_grid_search_dev.py tests/test_s49_l1_local_voxel_dev.py
      - name: Boundary
        if: always()
        run: echo 'DEV_ONLY / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
