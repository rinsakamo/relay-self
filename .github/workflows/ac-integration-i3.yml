name: AC Integration I3 cross-source nontransfer audit

on:
  push:
    branches:
      - self/ac-integration-i3-cross-source-20261010
  pull_request:
    branches:
      - self/ac-integration-i2-s17-s10-s11-20261010

permissions:
  contents: read

concurrency:
  group: ac-i3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python tools/check_repository.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Run bounded I3 source/nontransfer tests first
        run: python -m pytest tests/test_ac_integration_i3_cross_source_gate.py
      - name: Run full deterministic regressions
        run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "ruff==0.16.7"
      - run: ruff check src tests experiments adapters observability

  mineflayer-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - run: npm run check --prefix adapters/mineflayer

  b12-independent-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out frozen B12 *separately*, never merge code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 33686285cd2ffe5865538fd11113c8736f6c36a4
          path: b12-independent
      - name: Verify external exact B12 SHA
        run: test "$(git -C b12-independent rev-parse HEAD)" = "33686285cd2ffe5865538fd11113c8736f6c36a4"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Re-run B11 and B12 isolated focused tests
        working-directory: b12-independent
        run: python -m pytest tests/test_ac_b_b11_governed_habit.py tests/test_ac_b_b12_independent_grant.py
