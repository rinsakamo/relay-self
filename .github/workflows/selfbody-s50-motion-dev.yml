name: SelfBody S50 sampled motion optional companion DEV
on:
  push:
    branches:
      - dev/selfbody-s50-motion-companion-20261031
    paths:
      - 'adapters/mineflayer/self_body_s50_motion_companion.py'
      - 'tests/test_self_body_s50_motion_companion.py'
      - '.github/workflows/selfbody-s50-motion-dev.yml'
  pull_request:
    paths:
      - 'adapters/mineflayer/self_body_s50_motion_companion.py'
      - 'tests/test_self_body_s50_motion_companion.py'
      - '.github/workflows/selfbody-s50-motion-dev.yml'
permissions:
  contents: read
jobs:
  offline-selfbody-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src:tests:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check S50 companion is separate and original SelfBody unchanged
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          ruff check adapters/mineflayer/self_body_s50_motion_companion.py tests/test_self_body_s50_motion_companion.py
          python -m compileall -q adapters/mineflayer/self_body_s50_motion_companion.py tests/test_self_body_s50_motion_companion.py
          python -m pytest -o addopts='' -q \
            tests/test_self_body_s50_motion_companion.py \
            tests/test_self_body.py \
            tests/test_self_product_passive_views.py
          python tools/check_repository.py
      - name: Evidence limit
        if: always()
        run: echo 'SELF_BODY_DEV_SOURCE_COMPANION_ONLY / NO_REAL_WORLD / NO_NATIVE_PRESENT_MINTED / NO_ACTION_AUTHORITY / NO_P1_WAIT / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
