name: L model selects typed Paper evidence IDs offline DEV
on:
  push:
    branches: [dev/l-live-evidence-id-gemma-prospective-20261102]
  pull_request:
    paths:
      - 'adapters/mineflayer/l_mp11_evidence_id_selection.py'
      - 'adapters/mineflayer/l_mp11_live_l2_shadow.py'
      - 'adapters/mineflayer/s49_normal_session_real_ci.py'
      - 'tools/l_mp11_feedback_original_audit.py'
      - 'tests/test_l_mp11_evidence_id_selection.py'
      - '.github/workflows/l-evidence-id-open-offline-dev.yml'
permissions:
  contents: read
jobs:
  source-bound-evidence-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:tests:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin pytest and Ruff
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
      - name: Fail-closed L2 evidence IDs and original S49 G2/G3 regression
        run: |
          set -euo pipefail
          ruff check adapters/mineflayer/l_mp11_evidence_id_selection.py \
            adapters/mineflayer/l_mp11_live_l2_shadow.py \
            adapters/mineflayer/s49_normal_session_real_ci.py \
            tools/l_mp11_feedback_original_audit.py \
            tests/test_l_mp11_evidence_id_selection.py
          python -m compileall -q adapters/mineflayer/l_mp11_evidence_id_selection.py \
            adapters/mineflayer/l_mp11_live_l2_shadow.py \
            adapters/mineflayer/s49_normal_session_real_ci.py \
            tools/l_mp11_feedback_original_audit.py
          python -m pytest -o addopts='' -q \
            tests/test_l_mp11_evidence_id_selection.py \
            tests/test_l_mp11_compact_role_and_failure.py \
            tests/test_l_mp11_live_l2_shadow.py \
            tests/test_l_mp11_eof_and_typed_feedback.py \
            tests/test_l_mp11_feedback_original_audit.py \
            tests/test_l_mp11_live_previous_action.py \
            tests/test_l_mp11_live_paper_postrun_audit.py \
            tests/test_self_body_s50_l2_mp11_paper_audit.py \
            tests/test_mp11_g2_s49_original_audit.py \
            tests/test_feature_s49_normal_runtime.py
          python tools/check_repository.py
      - name: No model invocation
        run: echo 'EVIDENCE_ID_SELECTION_DEV_OFFLINE_ONLY / ORIGINAL_NUMERIC_SOURCE_PRESERVED / REAL_GEMMA_NOT_RUN / NO_ACTION / R_NO_GO / V_NOT_RUN'
