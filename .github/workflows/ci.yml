name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: relay-self-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify repository contracts
        run: python tools/check_repository.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"

      - name: Verify BD1b original CPU ADOPT in separate process
        env:
          BD1B_AUDIT_ARCHIVE: ${{ runner.temp }}/bd1b-audit-original
        run: |
          python -m pytest -s tests/test_bd1b_adopt_commit_hostile_dev.py \
            tests/test_bd1b_adopt_audit_dev.py

      - name: Retain BD1b CPU original audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bd1b-adopt-cpu-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/bd1b-audit-original/
          if-no-files-found: error
          retention-days: 14

      - name: Verify BD1b live ingress and one-post capture offline
        run: |
          python -m pytest tests/test_bd1b_real_issuer_preflight_dev.py \
            tests/test_bd1b_real_original_capture_dev.py

      - name: Run deterministic tests
        run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.16.7"

      - name: Run lint
        run: ruff check src tests experiments adapters observability

  mineflayer-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install locked Mineflayer dependency graph
        run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer

      - name: Verify Mineflayer adapter protocol
        run: npm run check --prefix adapters/mineflayer

  paper-tick-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile passive Paper P0B/P0D witness plugin
        run: mvn --batch-mode --no-transfer-progress -f experiments/p0b_paper_recorder/pom.xml -DskipTests package
