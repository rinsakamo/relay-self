name: S49 SLM L8 empty-memory one-shot real World DEV

# Opt-in marker only. This workflow is NOT a new Action/World owner and
# must not run on normal source/doc pushes or PRs.
on:
  push:
    branches:
      - integration/s49-slm-passive-dev-20261031
    paths:
      - docs/s49-slm-l8-empty-memory-one-shot-trigger-20261031.md

permissions:
  contents: read

jobs:
  one-disposable-world:
    if: github.event.head_commit.message == 'dev-world: approved S49 L8 empty-memory shadow one-shot'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      S49_REAL_SERVER_CI: '1'
      NODE_OPTIONS: ''
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
    steps:
      - name: Checkout triggered exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install focused Python tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
      - name: Focused offline contracts before physical startup
        run: |
          python -m pytest -q tests/test_s49_slm_passive_dev.py tests/test_s49_slm_empty_memory_shadow.py tests/test_feature_s49_normal_runtime.py
          ruff check adapters/mineflayer/slm_passive_dev.py adapters/mineflayer/slm_passive_dev_run.py tests/test_s49_slm_passive_dev.py tests/test_s49_slm_empty_memory_shadow.py
          python tools/check_repository.py
      - name: Verify original Mineflayer dependency
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if(require('./adapters/mineflayer/node_modules/mineflayer/package.json').version !== '4.39.0') process.exit(2)"
          java -version
      - name: Exactly one authorized disposable original S49 native World
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dev-evidence
          python -B -m adapters.mineflayer.slm_passive_dev_run \
            --confirm S49-SLM-ONE-DISPOSABLE-DEV-WORLD \
            --l8-empty-memory-shadow \
            --output-dir "$GITHUB_WORKSPACE/dev-evidence/world-one" \
            2>&1 | tee dev-evidence/host.log
      - name: Verify original S49 actions and source-matched L8 abstention
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("dev-evidence/world-one")
          report = json.loads((root / "report.json").read_text())
          assert report["status"] == "PASS"
          assert len(report["actual_native_actions"]) == 2
          assert all(a["terminal"] == "outcome" for a in report["actual_native_actions"])
          read = report["slm_dev"]
          assert read["classification"] == "DEV_ONLY"
          assert read["observer_errors"] == 0
          assert read["l8_retention_enabled"] is True
          assert read["model_calls"] == 0
          assert read["b0_scope"] == "MODEL_ONLY_NOT_MINECRAFT_BODY_ACCOUNTING"
          rows = read["rows"]
          assert len(rows) == 3
          assert [r["s_choice"] for r in rows] == ["WAIT", "MOVE_AWAY", "MOVE_AWAY"]
          for row in rows:
              assert row["status"] == "RECORDED"
              assert row["l1_status"] == "no_admissible_l1_proposal"
              assert row["l1_candidate"] is None
              assert row["l1_model_status"] == "NO_ADMISSIBLE_L1_CANDIDATE"
              assert row["new_native_reads"] == row["action_issues"] == 0
              assert row["learning_updates"] == row["habit_grants"] == 0
              assert row["food_credits"] == 0
              assert row["action_authority"] is False
          assert report["node_exit"] == report["server_exit"] == 0
          assert report["w3_node_stdout_capture"]["status"] == "COMPLETE_NODE_STDOUT"
          assert report["real_model_calls"] == 0
          assert report["learning_in_world"] is False
          Path("dev-evidence/verification.json").write_text(json.dumps({
              "classification": "DEV_ONLY_REAL_WORLD_L8_EMPTY_MEMORY_ABSTENTION",
              "original_actions": 2,
              "original_outcomes": 2,
              "source_matched_l8_abstentions": 3,
              "memory_training_admissions": 0,
              "qual_assumed": False,
              "science_assumed": False,
          }, sort_keys=True, indent=2))
          print("DEV_NATIVE_L8_EMPTY_MEMORY_SHADOW_PASS")
          PY
      - name: Always preserve original native World and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s49-slm-l8-empty-memory-dev-originals
          path: dev-evidence/
          if-no-files-found: warn
          retention-days: 30
