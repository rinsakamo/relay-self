name: Bug-0 original S49 bounded repeat ATTACK native DEV offline
on:
  push:
    branches:
      - dev/bug0-s49-repeat-lethal-observation-20261106
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Original source authority and exact native boundary tests
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python tools/check_repository.py
          python -m compileall -q adapters/mineflayer/attack_execution.py adapters/mineflayer/normal_action.py tests/test_bug0_s49_repeat_attack.py
          ruff check adapters/mineflayer/attack_execution.py adapters/mineflayer/normal_action.py tests/test_bug0_s49_repeat_attack.py
          python -m pytest -q tests/test_bug0_s49_attack_owner.py tests/test_bug0_s49_repeat_attack.py tests/test_bug0_s49_attack_paper_health.py tests/test_bug0_s49_attack_then_rest_dev.py tests/test_bug0_s49_unified_survival.py
      - name: No Paper World or physical ACTION from offline
        run: echo 'S49_REPEAT_ATTACK_OFFLINE_WORLD_0_NATIVE_ACTION_0_NO_DEATH_CLAIM'
