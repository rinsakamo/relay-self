name: Bug-0 S49 real Paper activity ticks to P1 DEV offline
on:
  push:
    branches:
      - dev/bug0-s49-p1-paper-tick-dev-20261104

permissions:
  contents: read

concurrency:
  group: bug0-s49-p1-paper-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-negatives:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install focused offline test tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
      - name: Syntax contracts and Ruff
        run: |
          python tools/check_repository.py
          python -m compileall -q adapters/mineflayer/s49_p1_paper_dev.py adapters/mineflayer/s49_p1_paper_server.py adapters/mineflayer/s49_normal_session_real_ci.py tools/bug0_s49_p1_paper_model_eval.py tests/test_bug0_s49_p1_paper_dev.py
          ruff check adapters/mineflayer/s49_p1_paper_dev.py adapters/mineflayer/s49_p1_paper_server.py adapters/mineflayer/s49_normal_session_real_ci.py tools/bug0_s49_p1_paper_model_eval.py tests/test_bug0_s49_p1_paper_dev.py
      - name: Paper source gates and original S49 regression
        run: |
          python -m pytest -q tests/test_bug0_s49_p1_paper_dev.py tests/test_bug0_s49_attack_then_rest_dev.py tests/test_bug0_s49_rest_dev.py tests/test_bug0_s49_attack_paper_health.py tests/test_bug0_s49_unified_survival.py tests/test_s50_p1_wait.py
      - name: Compile isolated read-only S49 P1 Paper plugin
        run: |
          mvn -B -ntp -f adapters/mineflayer/s49_p1_paper_dev/pom.xml -DskipTests package
          test -f adapters/mineflayer/s49_p1_paper_dev/target/relay-s49-p1-source-dev-0.1.0-dev.jar
      - name: No actual World or P1 physiological recovery claim
        run: echo 'OFFLINE_ONLY / SOURCE_CALLBACK_P1_DEV_ONLY / R_FULL_TICK_ATTESTATION_PENDING'
