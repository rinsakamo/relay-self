name: Unified v0.5 C1 Intent motion to S10 retained reuse OFFLINE
on:
  push:
    branches:
      - dev/unified-v05-intent-motion-learning-20261106
      - dev/unified-c1-s10-world-20261106
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Existing owner and C1/C4 thin-seam regression
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python tools/check_repository.py
          python -m compileall -q adapters/mineflayer/bug0_intent_motion_learning.py tests/test_bug0_intent_motion_learning.py tests/test_bug0_intent_motion_source_join.py
          ruff check adapters/mineflayer/bug0_intent_motion_learning.py tests/test_bug0_intent_motion_learning.py tests/test_bug0_intent_motion_source_join.py
          python -m pytest -q tests/test_bug0_intent_motion_learning.py tests/test_bug0_intent_motion_source_join.py tests/test_s49_completed_decision_bridge.py tests/test_learning_qualification.py
      - name: No World, issuer or model from offline
        run: echo 'UNIFIED_C1_LRN_OFFLINE_ONLY_NO_WORLD_NO_ACTION_NO_LLM_NO_PERFORMANCE_CLAIM'
