name: L Lane next-epoch experience candidate (offline FAST)

on:
  push:
    branches:
      - 'learning/l6-next-epoch-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify expected L5 ancestry
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 17c5357fd5625274ee567ad979b780e77bf7b1e7 HEAD
          python tools/check_repository.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install focused test and lint dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.16.7'
      - name: L6/L5/L1/S11 focused offline tests
        env:
          PYTHONPATH: 'src:tests:.'
        run: python -m pytest -q tests/test_learning_epoch.py tests/test_contextual_shadow.py tests/test_experience_bridge.py tests/test_habit_shadow.py
      - name: Focused Python Ruff
        run: ruff check src/relay_self/learning_epoch.py tests/test_learning_epoch.py
