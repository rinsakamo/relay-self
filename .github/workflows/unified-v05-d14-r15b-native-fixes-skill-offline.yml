name: D14 R15b live Skill native fixes integration offline DEV
on:
  push:
    branches:
      - dev/d14-r15b-native-fixes-skill-trial-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-s49-only-r15b:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm exact SHA
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned checks
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
      - name: Repository contracts
        run: python tools/check_repository.py
      - name: Exact R11-R15 focused Python regressions
        run: |
          python -m pytest -q -x \
            tests/test_d14_r15_skill_s49_trial.py \
            tests/test_d14_r14_retained_skill_trial.py \
            tests/test_d14_r13_action_catalog.py \
            tests/test_d14_r12_l2_shadow.py \
            tests/test_d14_r12_native_oxygen_cleanup.py \
            tests/test_mineflayer_process_session.py \
            tests/test_d14_r11_natural_day_foraging.py \
            tests/test_d14_r10_initial_sword.py \
            tests/test_d14_r9_combat_first.py \
            tests/test_d14_r7_native_evidence.py \
            tests/test_d14_natural_motion_r6.py \
            tests/test_d14_natural_world.py \
            tests/test_d14_natural_active_s49.py \
            tests/test_d14_local_oneworld.py \
            tests/test_d14_tick_horizon.py \
            tests/test_d12_experience_bridge.py
      - name: Ruff integration
        run: |
          ruff check \
            tools/bug0_d14_r15_skill_s49_trial.py \
            tools/bug0_d14_r15_skill_trial_post.py \
            tools/bug0_d14_r14_retained_skill_trial.py \
            tools/bug0_d14_r13_action_catalog.py \
            tools/bug0_d14_r12_l2_shadow.py \
            tools/bug0_d14_natural_life.py \
            tools/bug0_d14_natural_world.py \
            tools/bug0_d14_local_oneworld.py \
            adapters/mineflayer/python_protocol.py \
            adapters/mineflayer/process_session.py \
            tests/test_d14_r15_skill_s49_trial.py \
            tests/test_d14_r14_retained_skill_trial.py \
            tests/test_d14_r13_action_catalog.py \
            tests/test_d14_r12_l2_shadow.py \
            tests/test_d14_r12_native_oxygen_cleanup.py
      - name: Node 22 native protocol regression
        run: |
          node --version
          node --test adapters/mineflayer/protocol.test.mjs
          node --check adapters/mineflayer/m02_paper_dev/s50_p1_readback_bridge.mjs
      - name: Build R11 real Paper plugin
        run: mvn -B -ntp -f adapters/mineflayer/zombie_respawn_dev/pom.xml package
      - name: Original Java source regressions
        run: |
          java -ea -cp adapters/mineflayer/zombie_respawn_dev/target/classes:adapters/mineflayer/zombie_respawn_dev/target/test-classes \
            io.github.rinsakamo.respawn.RespawnCycleTest
          java -ea -cp adapters/mineflayer/zombie_respawn_dev/target/classes:adapters/mineflayer/zombie_respawn_dev/target/test-classes \
            io.github.rinsakamo.respawn.TickObservationHorizonTest
          java -ea -cp adapters/mineflayer/zombie_respawn_dev/target/classes:adapters/mineflayer/zombie_respawn_dev/target/test-classes \
            io.github.rinsakamo.respawn.NaturalAnchorCandidatesTest
