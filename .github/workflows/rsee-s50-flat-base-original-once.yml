name: R S50 FLAT BASE_ON archived pickup EAT independent offline review
on:
  push:
    branches: ['infra/rsee-r6-s9-native-original-readback-20261012']
    paths: ['.github/workflows/rsee-s50-flat-base-original-once.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: r-s50-flat-base-original-audit-38990613628
  cancel-in-progress: false
jobs:
  r-independent-original:
    if: "github.run_attempt == 1 && github.event.head_commit.message == 'R FLAT BASE: independent S50 pickup EAT readback after negative-fixture fix'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: rinsakamo/relay-self
      FLAT_RUN: '38989215391'
      FLAT_ART: '12084531180'
      FLAT_DIGEST: 'df981ff1d3eb064e78602ff785984a03a22d78943569b8c14dd9591675b103f7'
      S_RUN: '38990613628'
      S_HEAD: '0f5d639b0ce2dedbc61051f473daa1032c25a4e9'
      S_ART: '12084378433'
      S_DIGEST: '0e2d4f45a35de6f101bd409274122fd87a37805422b6e72cb7f13920265b0fb4'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: R independent new unit guards and exact source and immutable artifact metadata
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.16.7'
          PYTHONPATH=src:tests:. python -m pytest -q tests/test_rsee_s50_flat_base_original_audit.py
          ruff check experiments/standard_env/s50_flat_base_original_audit.py tests/test_rsee_s50_flat_base_original_audit.py
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ["GH_REPO"]
          def api(path): return json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/{path}"]))
          for runname,artname,digest,head,conclusion in (
              ("FLAT_RUN","FLAT_ART","FLAT_DIGEST",
               "09f4dc238ee338d3fa421c6e1bf055b49a93ad8d","failure"),
              ("S_RUN","S_ART","S_DIGEST",os.environ["S_HEAD"],"success"),
          ):
              run=api("actions/runs/"+os.environ[runname])
              artifact=api("actions/artifacts/"+os.environ[artname])
              assert run["head_sha"]==head and run["run_attempt"]==1
              assert run["conclusion"]==conclusion
              assert not artifact["expired"] and artifact["workflow_run"]["id"]==run["id"]
              assert artifact["digest"]=="sha256:"+os.environ[digest]
          print("R_S50_FLAT_BASE_SOURCE_AND_ARTIFACT_PINS_VERIFIED")
          PY
      - name: Download both untouched original Paper stopped World and S physical run archives
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flat-source" "$RUNNER_TEMP/flat-foraging"
          gh run download "$FLAT_RUN" -R "$GH_REPO" \
            -n "s50-flat-ground-native-world-seed63101-38989215391-1" \
            -D "$RUNNER_TEMP/flat-source"
          gh run download "$S_RUN" -R "$GH_REPO" \
            -n "s50-flat-base-on-native-forage-38990613628-1" \
            -D "$RUNNER_TEMP/flat-foraging"
      - name: R independent native Action food and STOP original byte readback
        env:
          PYTHONPATH: src:tests:.
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          from experiments.standard_env.s50_flat_base_original_audit import audit
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          result=audit(root/"flat-source",root/"flat-foraging")
          result.update({
              "source_original_run":int(os.environ["FLAT_RUN"]),
              "s_source_physical_run":int(os.environ["S_RUN"]),
              "s_source_head":os.environ["S_HEAD"],
              "source_artifact_provider_digest":os.environ["FLAT_DIGEST"],
              "physical_artifact_provider_digest":os.environ["S_DIGEST"],
              "source_zip_bytes_independently_hashed":False,
              "S_EAT_native_causality_strongly_attested":False,
          })
          (root/"r-s50-flat-base-original.json").write_text(
              json.dumps(result,sort_keys=True,indent=2)+"\n")
          print("R_S50_FLAT_BASE_ORIGINAL_PICKUP_EAT_REVIEW_PASS",json.dumps(result,sort_keys=True))
          PY
      - name: R archive-only independent readback receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-s50-flat-base-original-${{ github.run_id }}
          path: ${{ runner.temp }}/r-s50-flat-base-original.json
          if-no-files-found: warn
          retention-days: 90
