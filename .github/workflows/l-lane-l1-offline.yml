name: L lane L1 offline bridge

on:
  workflow_dispatch:
  pull_request:
    branches:
      - self/self1-bounded-session-20261011

permissions:
  contents: read

jobs:
  l1-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install offline test and lint tools (ephemeral CI only)
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1" "ruff==0.16.7"
      - name: Focused L1 tests
        run: python -m pytest -q tests/test_experience_bridge.py
      - name: Full Python regression
        run: python -m pytest -q
      - name: Ruff
        run: ruff check src tests experiments adapters observability
      - name: Repository contracts
        run: python tools/check_repository.py
