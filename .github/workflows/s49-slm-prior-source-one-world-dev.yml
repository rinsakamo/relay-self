name: S49 SLM prior real-source withheld next-World DEV

# Explicit marker one-shot only; no regular push/PR physical trial.
on:
  push:
    branches:
      - integration/s49-slm-passive-dev-20261031
    paths:
      - docs/s49-slm-prior-source-one-shot-trigger-20261031.md

permissions:
  contents: read
  actions: read

jobs:
  one-world:
    if: "github.event.head_commit.message == 'dev-world approved S49 prior-source withholding one-shot'"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      S49_REAL_SERVER_CI: '1'
      NODE_OPTIONS: ''
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
      PRIOR_STDOUT_SHA256: fd4725d15875c179f9e639358b341379d18298d1451090f7a189613085d385c8
    steps:
      - name: Checkout exact tested HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Focused Python 3.12 tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
      - name: Strict offline preflight before native World
        run: |
          python -m pytest -q tests/test_s49_slm_prior_world_dev.py tests/test_s49_slm_passive_dev.py tests/test_s49_slm_empty_memory_shadow.py tests/test_feature_s49_normal_runtime.py
          ruff check adapters/mineflayer/slm_prior_world_dev.py adapters/mineflayer/slm_passive_dev.py adapters/mineflayer/slm_passive_dev_run.py tests/test_s49_slm_prior_world_dev.py
          python tools/check_repository.py
      - name: Download fixed completed prior DEV World originals
        uses: actions/download-artifact@v4
        with:
          run-id: 41172997142
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: s49-slm-l8-empty-memory-dev-originals
          path: dev-evidence/prior
      - name: Validate original prior W3 bytes, receipts, no Goal admission
        run: |
          mkdir -p dev-evidence
          python - <<'PY'
          import json
          import os
          from dataclasses import asdict
          from pathlib import Path
          from adapters.mineflayer.slm_prior_world_dev import read_previous_s49_world

          root = (Path.cwd() / "dev-evidence/prior/world-one").resolve()
          old = read_previous_s49_world(
              root, expected_stdout_sha256=os.environ["PRIOR_STDOUT_SHA256"],
          )
          assert len(old.original_action_ids) == 2
          assert old.original_goal_labels == old.l8_admissible_episodes == 0
          assert old.s10_commit_permitted is False
          assert old.reason == "WITHHELD_NO_INDEPENDENT_EXTERNAL_GOAL"
          Path("dev-evidence/prior-admission.json").write_text(json.dumps(
              asdict(old), sort_keys=True, indent=2,
          ))
          print("PRIOR_ORIGINAL_W3_PASS_ACTION_GOAL_WITHHELD", old.session_id)
          PY
      - name: Original Mineflayer runtime preflight
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if(require('./adapters/mineflayer/node_modules/mineflayer/package.json').version !== '4.39.0') process.exit(2)"
          java -version
      - name: Exactly one new disposable original S49 physical World
        shell: bash
        run: |
          set -euo pipefail
          python -B -m adapters.mineflayer.slm_passive_dev_run \
            --confirm S49-SLM-ONE-DISPOSABLE-DEV-WORLD \
            --l8-empty-memory-shadow \
            --previous-world-root "$GITHUB_WORKSPACE/dev-evidence/prior/world-one" \
            --previous-w3-sha256 "$PRIOR_STDOUT_SHA256" \
            --output-dir "$GITHUB_WORKSPACE/dev-evidence/world-one" \
            2>&1 | tee dev-evidence/host.log
      - name: Require new S49 outcomes and same-owner Goal-less abstention
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("dev-evidence")
          report = json.loads((root / "world-one/report.json").read_text())
          prior = json.loads((root / "prior-admission.json").read_text())
          assert report["status"] == "PASS"
          assert report["session_id"] != prior["session_id"]
          assert [x["selected"] for x in report["decisions"]] == [
              "WAIT", "MOVE_AWAY", "MOVE_AWAY",
          ]
          assert len(report["actual_native_actions"]) == 2
          assert all(a["terminal"] == "outcome" for a in report["actual_native_actions"])
          slm = report["slm_dev"]
          assert slm["classification"] == "DEV_ONLY"
          assert slm["observer_errors"] == 0
          assert slm["one_l8_memory_owner"] is True
          assert slm["l8_retention_enabled"] is True
          assert slm["l8_training_admissions"] == 0
          inherited = slm["previous_world"]
          assert inherited["session_id"] == prior["session_id"]
          assert inherited["stdout_sha256"] == prior["stdout_sha256"]
          assert inherited["original_action_ids"] == prior["original_action_ids"]
          assert inherited["status"] == "WITHHELD_NO_INDEPENDENT_EXTERNAL_GOAL"
          assert inherited["l8_admissible_episodes"] == 0
          assert inherited["original_goal_labels"] == 0
          assert inherited["s10_commit_permitted"] is False
          assert len(slm["rows"]) == 3
          assert [r["s_choice"] for r in slm["rows"]] == [
              "WAIT", "MOVE_AWAY", "MOVE_AWAY",
          ]
          assert all(
              r["status"] == "RECORDED"
              and r["l1_status"] == "no_admissible_l1_proposal"
              and r["l1_candidate"] is None
              and r["action_issues"] == r["learning_updates"]
              == r["habit_grants"] == r["food_credits"] == r["new_native_reads"] == 0
              for r in slm["rows"]
          )
          assert slm["model_calls"] == report["real_model_calls"] == 0
          assert report["learning_in_world"] is False
          assert report["node_exit"] == report["server_exit"] == 0
          assert report["w3_node_stdout_capture"]["status"] == "COMPLETE_NODE_STDOUT"
          (root / "verification.json").write_text(json.dumps({
              "result": "DEV_TWO_WORLD_SOURCE_HANDED_OFF_GOAL_WITHHELD",
              "previous_original_actions": len(prior["original_action_ids"]),
              "current_original_actions": len(report["actual_native_actions"]),
              "current_l8_abstentions": len(slm["rows"]),
              "independent_goal_labels": 0,
              "memory_training_admissions": 0,
              "physical_next_epoch_policy_change": False,
              "qualification_no_go": True,
              "science_not_run": True,
          }, sort_keys=True, indent=2))
          print("TWO_REAL_WORLDS_ORIGINAL_SOURCE_WITHHELD_DEV_PASS")
          PY
      - name: Always preserve original past and current World evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s49-slm-prior-source-withheld-two-world-dev
          path: dev-evidence/
          if-no-files-found: warn
          retention-days: 30
