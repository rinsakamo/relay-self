name: Bug-0 D3 source-fenced real S49 two-hit Paper kill and respawn new World
on:
  push:
    branches:
      - dev/bug0-s49-d3-death-fence-20261106

permissions:
  contents: read

jobs:
  one-world:
    # A separate one-use trigger commit, never on normal source pushes.
    if: ${{ github.event.head_commit.message == 'run-bug0-s49-d3-death-fence-oneworld-once-20261106' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S49_REAL_SERVER_CI: '1'
      BUG0_S49_D3_ONE_WORLD_ONLY: '1'
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      NODE_OPTIONS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Strict one-time trigger and independent preworld negatives
        run: |
          test "$(git show --format= --name-only HEAD | sed '/^$/d')" = "docs/bug0-s49-d3-death-fence-trigger-20261106.md"
          test "$(git show --format=%s -s HEAD)" = "run-bug0-s49-d3-death-fence-oneworld-once-20261106"
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python tools/check_repository.py
          ruff check tools/bug0_s49_combat_d3_oneworld.py tools/bug0_s49_combat_d3_post.py tests/test_bug0_s49_combat_d3_post.py
          python -m pytest -q tests/test_bug0_s49_combat_d3_post.py tests/test_bug0_s49_repeat_attack.py tests/test_bug0_s49_attack_owner.py
          python - <<'PY'
          import socket
          with socket.socket(socket.AF_INET,socket.SOCK_STREAM) as sock:
              assert sock.connect_ex(('127.0.0.1',25565)) != 0
          PY
      - name: Download pinned official Paper 1.21.8 stable #60
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.parse,urllib.request
          url='https://fill.papermc.io/v3/projects/paper/versions/1.21.8/builds'
          req=urllib.request.Request(url,headers={'User-Agent':'RelaySelf-Bug0-R1/1.0 (https://github.com/rinsakamo/relay-self)'})
          with urllib.request.urlopen(req,timeout=50) as stream:
              builds=json.loads(stream.read(3000000))
          rows=[b for b in builds if b.get('channel')=='STABLE' and b.get('id')==60]
          assert len(rows)==1
          p=rows[0]['downloads']['server:default']
          assert p['name']=='paper-1.21.8-60.jar' and p['size']==52811717
          assert p['checksums']['sha256']=='8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e'
          uri=urllib.parse.urlparse(p['url'])
          assert uri.scheme=='https' and uri.hostname=='fill-data.papermc.io' and uri.path.startswith('/v1/objects/')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'paper-1.21.8.jar'
          digest=hashlib.sha256()
          with urllib.request.urlopen(urllib.request.Request(p['url'],headers={'User-Agent':'RelaySelf-Bug0-R1/1.0'}),timeout=120) as s, target.open('xb') as out:
              n=0
              while chunk:=s.read(1024*1024):
                  n+=len(chunk)
                  assert n<=52811717
                  digest.update(chunk)
                  out.write(chunk)
          assert n==52811717 and digest.hexdigest()==p['checksums']['sha256']
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('BUG0_D3_PAPER_JAR='+str(target)+'\n')
          print('PINNED_PAPER_1_21_8_R1')
          PY
      - name: Build pinned Paper respawn and independent natural-drop witness
        run: |
          mvn -B -ntp -f adapters/mineflayer/zombie_respawn_dev/pom.xml -DskipTests package
          mvn -B -ntp -f adapters/mineflayer/zombie_drop_witness_dev/pom.xml -DskipTests package
          python - <<'PY'
          import hashlib,os,pathlib
          targets=(
              ('BUG0_D3_RESPAWN','adapters/mineflayer/zombie_respawn_dev/target/relay-zombie-respawn-dev-0.1.0-dev.jar'),
              ('BUG0_D3_WITNESS','adapters/mineflayer/zombie_drop_witness_dev/target/relay-zombie-drop-witness-dev-0.1.0-dev.jar'),
          )
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              for var,rel in targets:
                  jar=pathlib.Path(rel).resolve()
                  assert jar.is_file() and not jar.is_symlink()
                  digest=hashlib.sha256(jar.read_bytes()).hexdigest()
                  f.write(var+'_JAR='+str(jar)+'\n')
                  f.write(var+'_SHA256='+digest+'\n')
                  print(var+'_SHA256='+digest)
          PY
      - name: Install pinned Mineflayer 4.39
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if (require('./adapters/mineflayer/node_modules/mineflayer/package.json').version!=='4.39.0') process.exit(2)"
      - name: One original S49 bounded real ATTACK to independent Paper RelaySelf killer and 600tick
        run: |
          mkdir -p bug0-d3-death-fence-evidence
          python -B tools/bug0_s49_combat_d3_oneworld.py \
            --report bug0-d3-death-fence-evidence/report.json \
            --server-log bug0-d3-death-fence-evidence/paper_original.log
      - name: Post-World independent S49 attack action + Paper killer/death/respawn audit
        run: |
          python -B tools/bug0_s49_combat_d3_post.py \
            --report bug0-d3-death-fence-evidence/report.json \
            --server-log bug0-d3-death-fence-evidence/paper_original.log \
            --out bug0-d3-death-fence-evidence/operator_post_audit.json
      - name: Preserve originals and SHA256
        if: always()
        run: |
          if test -d bug0-d3-death-fence-evidence; then
            (cd bug0-d3-death-fence-evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          fi
      - name: Store exact one-World DEV original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug0-s49-d3-death-fence-original-oneworld
          path: bug0-d3-death-fence-evidence/
          if-no-files-found: warn
          retention-days: 30
