name: P1 same-World original S49 and reused Paper source one DEV World
on:
  push:
    branches:
      - dev/p1-worldbody-reuse-audit-20261105

permissions:
  contents: read

jobs:
  one-world:
    # ONE fresh DEV run from an explicit commit whose message names its exact
    # immediate parent SHA. A rerun of the same workflow attempt is forbidden.
    # This is separate from the consumed #738 original World triggers.
    if: ${{ startsWith(github.event.head_commit.message, 'run-p1-same-world-source-once-20261105-from:') && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      S49_REAL_SERVER_CI: '1'
      S49_WORLDBODY_DEV_ONLY: '1'
      S49_WB_P1_SOURCE_DEV_ONLY: '1'
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      NODE_OPTIONS: ''
    steps:
      - name: Checkout exact original S49 owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify distinct exact-parent one-use DEV grant
        env:
          RUN_MESSAGE: ${{ github.event.head_commit.message }}
          PREVIOUS_HEAD: ${{ github.event.before }}
        run: |
          test "$RUN_MESSAGE" = "run-p1-same-world-source-once-20261105-from:$PREVIOUS_HEAD"
          test "$(git rev-parse HEAD^)" = "$PREVIOUS_HEAD"
          test "${{ github.run_attempt }}" = '1'
          echo 'SOURCE_JOIN_DEV_ONE_SHOT_PARENT_VERIFIED'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: WorldBody fixed-law, S16 direct and pre-World negative controls
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m pytest -q tests/test_worldbody_fixed_physics_dev.py tests/test_self_body.py tests/test_bug0_s49_rest_dev.py tests/test_worldbody_p1_same_world_source_post_dev.py tests/test_bug0_s49_p1_paper_dev.py
          python - <<'PY'
          import socket
          with socket.socket(socket.AF_INET,socket.SOCK_STREAM) as sock:
              assert sock.connect_ex(('127.0.0.1',25565)) != 0
          PY
      - name: Download official pinned Paper 1.21.8 STABLE #60
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          version='1.21.8'
          url=f'https://fill.papermc.io/v3/projects/paper/versions/{version}/builds'
          request=urllib.request.Request(url,headers={'User-Agent':'RelaySelf-Bug0-DEV/1.0 (https://github.com/rinsakamo/relay-self)'})
          with urllib.request.urlopen(request,timeout=50) as res:
              data=res.read(3000000)
          assert len(data)<3000000
          builds=json.loads(data)
          builds=[x for x in builds if x.get('channel')=='STABLE' and x.get('id')==60]
          assert len(builds)==1, 'pinned Paper build unavailable'
          p=builds[0]['downloads']['server:default']
          assert p['name']=='paper-1.21.8-60.jar'
          assert p['size']==52811717
          assert p['checksums']['sha256']=='8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e'
          uri=urllib.parse.urlparse(p['url'])
          assert uri.scheme=='https' and uri.hostname=='fill-data.papermc.io' and uri.path.startswith('/v1/objects/')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'paper-1.21.8.jar'
          digest=hashlib.sha256()
          n=0
          with urllib.request.urlopen(urllib.request.Request(p['url'],headers={'User-Agent':'RelaySelf-Bug0-DEV/1.0'}),timeout=120) as stream, target.open('xb') as out:
              while chunk:=stream.read(1024*1024):
                  n+=len(chunk)
                  assert n<=p['size']
                  digest.update(chunk)
                  out.write(chunk)
          assert n==52811717 and digest.hexdigest()==p['checksums']['sha256']
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as f:
              f.write('S49_WB_PAPER_JAR='+str(target)+'\n')
          print('PINNED_PAPER_1_21_8_DEV_OK')
          PY
      - name: Build independent server-only fixed WorldBody physical module
        run: |
          mvn -B -ntp -f adapters/mineflayer/worldbody_physics_dev/pom.xml -DskipTests package
          python - <<'PY'
          import hashlib, os, pathlib
          plugin=pathlib.Path('adapters/mineflayer/worldbody_physics_dev/target/relay-worldbody-physics-dev-0.1.0-dev.jar').resolve()
          assert plugin.is_file() and not plugin.is_symlink()
          sha=hashlib.sha256(plugin.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as f:
              f.write('S49_WB_PLUGIN_JAR='+str(plugin)+'\n')
              f.write('S49_WB_PLUGIN_SHA256='+sha+'\n')
          print('IMMUTABLE_WORLD_SERVER_RULES_SHA256='+sha)
          PY
      - name: Build reused read-only #734 Paper collector (separate hashed plugin)
        run: |
          mvn -B -ntp -f adapters/mineflayer/s49_p1_paper_dev/pom.xml -DskipTests package
          python - <<'PY'
          import hashlib, os, pathlib
          p=pathlib.Path('adapters/mineflayer/s49_p1_paper_dev/target/relay-s49-p1-source-dev-0.1.0-dev.jar').resolve()
          assert p.is_file() and not p.is_symlink()
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as f:
              f.write('S49_WB_P1_SOURCE_PLUGIN_JAR='+str(p)+'\n')
              f.write('S49_WB_P1_SOURCE_PLUGIN_SHA256='+sha+'\n')
          print('REUSED_P1_READONLY_SOURCE_PLUGIN_SHA256='+sha)
          PY
      - name: Install pinned original Mineflayer
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if (require('./adapters/mineflayer/node_modules/mineflayer/package.json').version!=='4.39.0') process.exit(2)"
      - name: Fresh one original S49 World with WorldBody and existing P1 Paper callback plugin
        run: |
          mkdir -p worldbody-evidence
          python -B -m adapters.mineflayer.s49_normal_session_real_ci \
            --worldbody-dev \
            --worldbody-p1-source-dev \
            --report worldbody-evidence/s49_original_worldbody.json \
            --server-log worldbody-evidence/paper_original.log
      - name: Independent Paper authoritative destination/slowness/recovery and S16 outcome audit
        run: |
          python -B tools/worldbody_fixed_physical_post.py \
            --report worldbody-evidence/s49_original_worldbody.json \
            --paper-log worldbody-evidence/paper_original.log \
            --out worldbody-evidence/worldbody_physical_post.json
      - name: Independently join same-World S49 S16 original MOVE and Paper tick markers
        run: |
          python -B tools/worldbody_p1_same_world_source_post.py \
            --report worldbody-evidence/s49_original_worldbody.json \
            --paper-log worldbody-evidence/paper_original.log \
            --out worldbody-evidence/p1_same_world_source_post.json
      - name: Preserve original raw Paper World, S16 receipts and SHA256
        if: always()
        run: |
          if test -d worldbody-evidence; then
            (cd worldbody-evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          fi
      - name: Archive original server physics, S49 receipts, and same-World callback source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-same-world-original-s49-paper-source-one-world
          path: worldbody-evidence/
          if-no-files-found: warn
          retention-days: 30
