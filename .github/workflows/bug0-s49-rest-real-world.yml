name: Bug-0 original S49 REST native stationary World
on:
  push:
    branches:
      - dev/bug0-s49-rest-intent-stationary-20261104

permissions:
  contents: read

jobs:
  one-native-world-rest:
    # One explicitly approved, exact-message DEV World; no automatic replay.
    if: ${{ github.event.head_commit.message == 'run-bug0-s49-rest-native-once-20261104' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      S49_REAL_SERVER_CI: '1'
      S49_BUG0_REST_DEV_ONLY: '1'
      NODE_OPTIONS: ''
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout one authorized exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Original Python runtime test tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Verify original Mineflayer 4.39.0
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if (require('./adapters/mineflayer/node_modules/mineflayer/package.json').version !== '4.39.0') process.exit(2)"
      - name: One bounded original S49 REST intent stationary observation
        run: |
          mkdir -p rest-evidence
          python -B -m adapters.mineflayer.s49_normal_session_real_ci \
            --bug0-rest-dev \
            --report rest-evidence/s49_rest.json \
            --server-log rest-evidence/paper.log
      - name: REST intent is not qualified WAIT or fatigue recovery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('rest-evidence/s49_rest.json').read_text())
          assert r['status']=='PASS', r.get('error')
          assert r['classification']=='DEV_ONLY_S49_REST_INTENT_STATIONARY_SAMPLES'
          assert r['rest_intent_selected'] is True
          assert r['rest_choice']['selected']=='REST'
          assert r['rest_choice']['action_issued'] is False
          assert r['actual_native_actions']==[]
          assert r['rest_action_issued'] is False
          obs=r['rest_observation']
          assert obs['native_stationary_sample_candidate'] is True
          assert obs['sample_count']==9
          assert len({x['native_request_id'] for x in obs['samples']})==9
          assert obs['physical_wait_full_tick_attested'] is False
          assert obs['p1_owner_integrated'] is False
          assert obs['p1_fatigue_before'] is None
          assert obs['p1_fatigue_after'] is None
          assert obs['p1_fatigue_recovery_attested'] is False
          assert r['m_energy_credited'] is False and r['learning_in_world'] is False
          assert r['node_exit']==0 and r['server_exit']==0
          print('DEV_REST_INTENT_NATIVE_SAMPLES_PASS / P1_RECOVERY_UNATTESTED')
          PY
      - name: SHA256 original report and Paper source
        if: always()
        run: |
          if test -d rest-evidence; then
            (cd rest-evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          fi
      - name: Preserve original native and Paper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug0-s49-rest-native-one-world
          path: rest-evidence/
          if-no-files-found: warn
          retention-days: 30
