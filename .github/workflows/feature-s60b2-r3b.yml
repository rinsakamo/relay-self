name: S60-B2 R3-B0 exact-head offline live gate

on:
  pull_request:
    branches:
      - self/s60b2-r3-diagnostic-runner-20261010
  push:
    branches:
      - self/s60b2-r3b-diagnostic-live-gate-*

permissions:
  contents: read

concurrency:
  group: relay-self-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify frozen R3 manifest and bounded predecessor change
        run: |
          echo "2710acc4809ebc3a2bc8f55d250396de091cbd44061637b5f38de4a241cbaa4a  docs/s60b2-r3/manifest.md" | sha256sum -c
          test "$(git rev-parse HEAD:docs/s60b2-r3/manifest.md)" = "bf1a267a9ec0c8600ba186f035168de6b46d8964"
          git merge-base --is-ancestor e0fad49ea86bf6f69bc2338a9b253153fa275d27 HEAD
          test "$(git diff --name-only --diff-filter=CDMRTUXB 66afcc2017d12b760e21539bf698baf176d3dd68 HEAD)" = "adapters/mineflayer/s60b2_owned_backend_probe.py"
          git diff --exit-code 66afcc2017d12b760e21539bf698baf176d3dd68 HEAD -- adapters/mineflayer/s60b2_offline_diagnostic.py docs/s60b2/manifest.md docs/s60b2-r2/manifest.md

      - name: Verify repository contracts
        run: python tools/check_repository.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node 22 for inherited offline subprocess tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"

      - name: Run deterministic tests
        env:
          PYTHONPATH: .:src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m adapters.mineflayer.s60b2_owned_backend_probe --plan
          python -m pytest tests/test_feature_s60b2_r3.py tests/test_feature_s60b2_diagnostic.py tests/test_feature_s60b2_preflight.py tests/test_feature_s60b1_adapter.py tests/test_feature_s60a_displacement.py
          python -m pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.16.7"

      - name: Run lint
        run: ruff check src tests experiments adapters observability

  mineflayer-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact transaction head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"

      - name: Install locked Mineflayer dependency graph
        run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer

      - name: Verify Mineflayer adapter protocol
        run: npm run check --prefix adapters/mineflayer
