name: S50 FLAT BASE_ON one native foraging DEV only
on:
  push:
    branches: ['self/product-self-one-command-20261010']
    paths: ['.github/workflows/s50-flat-base-on-one-shot-dev.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: s50-flat-base-one-source-world-once-only
  cancel-in-progress: false
jobs:
  one-actual-flat-base-world:
    if: "github.run_attempt == 1 && github.event.head_commit.message == 'S50 FLAT DEV: one new BASE_ON forage after native seed marker fix'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: rinsakamo/relay-self
      FLAT_SOURCE_RUN: '38989215391'
      FLAT_SOURCE_ART: 's50-flat-ground-native-world-seed63101-38989215391-1'
      FLAT_SOURCE_HEAD: '09f4dc238ee338d3fa421c6e1bf055b49a93ad8d'
      FLAT_SOURCE_DIGEST: 'df981ff1d3eb064e78602ff785984a03a22d78943569b8c14dd9591675b103f7'
      DEV_PLUGIN_RUN: '38978751455'
      DEV_PLUGIN_ART: 'v8-five-world-dev-38978751455-1'
      DEV_PLUGIN_SHA: 'd620935f6f03f3239cebbef0b931ba97482f596e5457feec9b680fe2e14da486'
      PAPER_SHA: '8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: s
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned native Mineflayer dependencies and preflight before Java
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C s rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.16.7'
          PYTHONPATH="s/src:s/tests:s" python -m pytest -q \
            s/tests/test_s50_flat_base_foraging_dev.py \
            s/tests/test_s50_flat_ground_dev.py \
            s/tests/test_s50_v8_five_world_dev.py
          ruff check s/adapters/mineflayer/m02_paper_dev/s50_flat_base_foraging_dev.py \
            s/tests/test_s50_flat_base_foraging_dev.py
          cd s/adapters/mineflayer
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "require.resolve('mineflayer');require.resolve('minecraft-protocol')"
      - name: Pin archived flat original and historical V8 DEV plugin evidence, before download
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ["GH_REPO"]
          def api(part): return json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/{part}"]))
          run=api("actions/runs/"+os.environ["FLAT_SOURCE_RUN"])
          assert run["head_sha"]==os.environ["FLAT_SOURCE_HEAD"] and run["run_attempt"]==1
          assert run["conclusion"]=="failure" # Original remained failed after source success
          arts=api("actions/runs/"+os.environ["FLAT_SOURCE_RUN"]+"/artifacts")["artifacts"]
          matches=[a for a in arts if a["name"]==os.environ["FLAT_SOURCE_ART"]]
          assert len(matches)==1 and not matches[0]["expired"]
          assert matches[0]["digest"]=="sha256:"+os.environ["FLAT_SOURCE_DIGEST"]
          other=api("actions/runs/"+os.environ["DEV_PLUGIN_RUN"])
          assert other["run_attempt"]==1 and other["conclusion"]=="success"
          print("S50_FLAT_PINS_VERIFIED_PRE_JAVA")
          PY
      - name: Download stopped original flat World and immutable DEV plugin artifact
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flat-original" "$RUNNER_TEMP/v8-original" "$RUNNER_TEMP/flat-assets"
          gh run download "$FLAT_SOURCE_RUN" -R "$GH_REPO" -n "$FLAT_SOURCE_ART" \
            -D "$RUNNER_TEMP/flat-original"
          gh run download "$DEV_PLUGIN_RUN" -R "$GH_REPO" -n "$DEV_PLUGIN_ART" \
            -D "$RUNNER_TEMP/v8-original"
          python - <<'PY'
          import hashlib,os,pathlib,shutil
          top=pathlib.Path(os.environ["RUNNER_TEMP"])
          paper=top/"flat-original/flat-source/server/paper-1.21.8.jar"
          plugin=top/"v8-original/new-dev-plugin.jar"
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert paper.is_file() and not paper.is_symlink()
          assert plugin.is_file() and not plugin.is_symlink()
          assert sha(paper)==os.environ["PAPER_SHA"]
          assert sha(plugin)==os.environ["DEV_PLUGIN_SHA"]
          shutil.copyfile(paper,top/"flat-assets/paper.jar")
          shutil.copyfile(plugin,top/"flat-assets/plugin.jar")
          print("S50_FLAT_SOURCE_PAPER_PLUGIN_ACTUAL_BYTES_PINNED")
          PY
      - name: Exactly one new FLAT BASE_ON Java + Node physical DEV attempt, preserve behavioral failure
        id: physical
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH="s/src:s/tests:s" python -m adapters.mineflayer.m02_paper_dev.s50_flat_base_foraging_dev \
            --archive "$RUNNER_TEMP/flat-original" \
            --paper-jar "$RUNNER_TEMP/flat-assets/paper.jar" \
            --plugin-jar "$RUNNER_TEMP/flat-assets/plugin.jar" \
            --plugin-sha256 "$DEV_PLUGIN_SHA" \
            --output "$RUNNER_TEMP/flat-base-results" \
            --confirm S50-FLAT-BASE-ON-ONE-WORLD-DEV-ONLY \
            > "$RUNNER_TEMP/flat-base-producer-stdout.jsonl" 2>&1
          code=$?
          set -e
          tail -c 13000 "$RUNNER_TEMP/flat-base-producer-stdout.jsonl" || true
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Retain all source and new World/action evidence (including hidden remapped plugin)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s50-flat-base-on-native-forage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/flat-base-producer-stdout.jsonl
            ${{ runner.temp }}/flat-base-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
      - name: Preserve behavioral verdict distinct from workflow completion and never SCIENCE
        if: always()
        env:
          ORIGINAL_EXIT: ${{ steps.physical.outputs.code }}
        run: |
          test "$ORIGINAL_EXIT" = 0
          test -s "$RUNNER_TEMP/flat-base-results/summary.json"
          test -s "$RUNNER_TEMP/flat-base-results/BASE_ON/report.json"
          test -s "$RUNNER_TEMP/flat-base-results/BASE_ON/original_native.jsonl"
          echo "S50_FLAT_ONE_WORLD_DEV_EXECUTED_WITH_ORIGINALS_NOT_SCIENCE"
