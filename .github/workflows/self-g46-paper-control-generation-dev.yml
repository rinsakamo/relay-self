      - name: Third disposable World - real native threat after JOG ACK
        run: |
          set -euo pipefail
          PLUGIN="$PWD/adapters/mineflayer/m02_paper_dev/target/relay-metabolism-paper-dev-0.2.0-dev.jar"
          DASH="$PWD/adapters/mineflayer/s49_paper_dash_dev/target/relay-s49-dash-dev-0.1.0-dev.jar"
          python -m adapters.mineflayer.s49_goal_loop_real_dev \
            --output-dir "$DEV_OUTPUT/WORLD-G46-HAZARD" \
            --confirm S49-GOAL-L0-DEV-DISPOSABLE-WORLD \
            --paper-jar-dev "$DEV_OUTPUT/paper.jar" \
            --paper-plugin-dev "$PLUGIN" --paper-gait-observation-dev \
            --paper-dash-plugin-dev "$DASH" --g2-dash-first-dev \
            --offset-m 3.5 --g3-single-owner-dev --g3-modifier-identity-dev \
            --g4-auto-gait-dev --g41-inflight-brake-dev --g42-brake-timing-dev \
            --g43-passive-tail-control-dev --g44-intra-action-gait-dev \
            --g45-paper-gait-join-dev --g45-hazard-during-gait-dev --g46-paper-generation-dev \
            > "$DEV_OUTPUT/producer-g45-hazard.stdout" 2>&1 || {
              cat "$DEV_OUTPUT/producer-g45-hazard.stdout"; exit 1;
            }
          cat "$DEV_OUTPUT/producer-g45-hazard.stdout"
          python - <<'PY'
          import hashlib,json,os,pathlib
          folder=pathlib.Path(os.environ["DEV_OUTPUT"])/"WORLD-G46-HAZARD"
          j=json.loads((folder/"goal_report.json").read_text())
          assert j["status"]=="PASS" and j["real_world"]
          assert j["stage"]=="G45_NATIVE_GAIT_HAZARD_T2_REFUSED"
          hz=j["g45_native_hazard_preempt_dev"]
          assert hz["action_id"]=="goal-approach-demo-step-2"
          assert hz["gait_phase"]=="JOG" and hz["decision"]=="INTERRUPT"
          assert hz["native_provenance"]=="mineflayer"
          assert hz["native_seq"]>hz["transition_ack_seq"]
          assert hz["applied_clear_seq"]>hz["native_seq"]
          assert hz["s16_after_seq"]>hz["applied_clear_seq"]
          assert hz["terminal"]=="unknown" and hz["s16_status"]=="failed"
          assert hz["new_s49_actions_after_hazard"]==0
          assert hz["t2_expected_refusal"] and not hz["p1_credit_awarded"]
          assert len(j["native_actions"])==2
          assert j["native_actions"][-1]["s16_terminal"]=="unknown"
          assert j["g45_paper_transition_windows_dev"]
          assert j["g46_native_paper_generations_dev"]
          assert all(not r["exact_physics_tick_to_effect_attested"]
                     for r in j["g46_native_paper_generations_dev"])
          assert all(not w["full_tick_gait_attested"]
                     for w in j["g45_paper_transition_windows_dev"])
          assert j["g3_single_t2_p1_m0_owner_dev"]["owner_failed"]
          refusal=j["l1_t2_ledger_dev"]["s16_refusal_diagnostic_dev"]
          assert refusal["reason"]=="NATIVE_TERMINAL_NOT_SAFE_FOR_T2"
          assert refusal["p1_credit_awarded"] is False
          assert refusal["additional_action_issued"] is False
          for key in ("l1_t2_ledger_dev","g1_applied_gait_observation_dev"):
              meta=j[key]
              file=folder/meta["derived_file"]
              assert hashlib.sha256(file.read_bytes()).hexdigest()==meta["derived_file_sha256"]
          print("G46_IN_STAGE_NATIVE_HAZARD_CLEAR_UNKNOWN_DEV_PASS",
                json.dumps(hz,sort_keys=True))
          PY
