name: Original S49 ATTACK EAT physical-fence focused smoke OFFLINE
on:
  push:
    branches:
      - dev/unified-v05-d5-c1-combat-food-fence-20261107
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Focused original ATTACK/EAT preissue ledger tests
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python tools/check_repository.py
          ruff check src/relay_self/s49_nonmotion_physical_fence.py tests/test_s49_nonmotion_physical_fence.py adapters/mineflayer/normal_action.py
          python -m pytest -q -x tests/test_s49_nonmotion_physical_fence.py
          echo 'DEV_ORIGINAL_S49_ATTACK_EAT_FENCE_FOCUSED_OFFLINE_PASS / NO_WORLD'
