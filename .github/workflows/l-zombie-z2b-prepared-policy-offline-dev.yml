name: L Z2b genuine Gemma prepared-policy contract offline DEV
on:
  push:
    branches: [dev/l-zombie-z2b-prepared-l2-policy-20261102]
  pull_request:
    paths:
      - 'adapters/mineflayer/l_zombie_z2b_policy_contract.py'
      - 'tools/l_zombie_z2b_prepare_gemma.py'
      - 'tests/test_l_zombie_z2b_policy_contract.py'
      - 'tools/l_zombie_z2b_paper_policy_audit.py'
      - 'tests/test_l_zombie_z2b_paper_policy_audit.py'
      - 'tools/l_zombie_z2b_saved_original_readback.py'
      - 'docs/evidence/l-z2b-real-20261102/**'
      - 'docs/l-z2b-real-validation-20261102.md'
      - 'adapters/mineflayer/l_zombie_paper_dev/**'
      - 'tools/l_zombie_z1_one_world_dev.py'
      - 'tests/test_l_zombie_z1_one_world_dev.py'
      - '.github/workflows/l-zombie-z2b-prepared-policy-offline-dev.yml'
permissions:
  contents: read
jobs:
  prepared-policy-negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: src:tests:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
      - name: Prepared real Gemma policy wire gates (FAKE HTTP fixtures only)
        run: |
          set -euo pipefail
          ruff check adapters/mineflayer/l_zombie_z2b_policy_contract.py tools/l_zombie_z2b_prepare_gemma.py tests/test_l_zombie_z2b_policy_contract.py tools/l_zombie_z2b_paper_policy_audit.py tests/test_l_zombie_z2b_paper_policy_audit.py
          python -m compileall -q adapters/mineflayer/l_zombie_z2b_policy_contract.py tools/l_zombie_z2b_prepare_gemma.py
          python -m pytest -p no:cacheprovider -o addopts='' -q \
            tests/test_l_zombie_z2b_policy_contract.py \
            tests/test_l_zombie_z2b_paper_policy_audit.py \
            tests/test_l_zombie_z1_one_world_dev.py \
            tests/test_l_zombie_z2a_prospective_audit.py \
            tests/test_l_zombie_20tick_shadow.py \
            tests/test_l_mp11_gemma_wire_contract.py \
            tests/test_l_mp11_b1_forecast_contract.py
          python tools/check_repository.py
          mvn -B -ntp -f adapters/mineflayer/l_zombie_paper_dev/pom.xml -DskipTests package
      - name: Saved actual originals replay (no physical execution)
        run: python -m tools.l_zombie_z2b_saved_original_readback --evidence-root docs/evidence/l-z2b-real-20261102
      - name: Epistemic boundary
        run: echo 'CI_SYNTHETIC_HTTP_AND_SAVED_ORIGINAL_REPLAY_ONLY / CI_NEW_REAL_GEMMA_0 / CI_NEW_REAL_WORLD_0 / NO_LIVE_ATTESTATION / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
