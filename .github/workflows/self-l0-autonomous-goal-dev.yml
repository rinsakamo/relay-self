name: S49 L2-L1 Goal To Autonomous L0 Real World DEV
on:
  push:
    branches:
      - self/dev-l0-autonomous-goal-loop-20261028
    paths:
      - .github/workflows/self-l0-autonomous-goal-dev.yml
      - src/relay_self/goal_navigation.py
      - adapters/mineflayer/s49_goal_executor_dev.py
      - adapters/mineflayer/s49_goal_loop_real_dev.py
      - tests/test_s49_goal_navigation_dev.py

permissions:
  contents: read

concurrency:
  group: s49-l0-autonomous-goal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goal-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      S49_REAL_SERVER_CI: '1'
      S49_FORWARD_MOTOR_DEV_ONLY: '1'
      S49_L0_GOAL_LOOP_DEV_ONLY: '1'
      DEV_OUTPUT: '/tmp/s49-l0-autonomous-goal-${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Focused local-style tests / Ruff / Node22 first
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          python -m compileall -q src/relay_self/goal_navigation.py adapters/mineflayer/s49_goal_executor_dev.py adapters/mineflayer/s49_goal_loop_real_dev.py tests/test_s49_goal_navigation_dev.py
          ruff check src/relay_self/goal_navigation.py adapters/mineflayer/s49_goal_executor_dev.py adapters/mineflayer/s49_goal_loop_real_dev.py tests/test_s49_goal_navigation_dev.py
          python -m pytest -q tests/test_s49_goal_navigation_dev.py tests/test_s49_l0_native_xz_goal_dev.py
          node --check adapters/mineflayer/bridge.mjs
      - name: Install original Mineflayer unchanged
        run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - name: One official Minecraft 1.21.8 World, L2-L1 goal autonomous L0
        run: |
          set -euo pipefail
          python -m adapters.mineflayer.s49_goal_loop_real_dev \
            --output-dir "$DEV_OUTPUT" \
            --confirm S49-GOAL-L0-DEV-DISPOSABLE-WORLD \
            --offset-m 2.6
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["DEV_OUTPUT"])/"goal_report.json").read_text())
          assert r["status"]=="PASS" and r["stage"]=="GOAL_REACHED"
          assert r["real_model_calls"]==0
          assert r["learned_L1_attested"] is False
          assert r["zombie_events_needed_for_continuation"] is False
          assert r["existing_S49_action_supervisor_reused"] is True
          assert r["legacy_zombie_S14_admission_reused"] is False
          assert r["goal_S14_dev_admission"] is True
          assert r["node_exit"]==0 and r["server_exit"]==0
          assert 1<=len(r["native_actions"])<=6
          assert all(a["s16_status"]=="EXECUTED" or
                     a["s16_status"]=="executed" for a in r["native_actions"])
          assert all(a["s16_terminal"]=="outcome" for a in r["native_actions"])
          assert len([d for d in r["l0_decisions"] if d["kind"]=="MOVE"])==len(r["native_actions"])
          assert len([d for d in r["l0_decisions"] if d["kind"]=="REACHED"])==1
          assert r["final_native_xz"]["euclidean_error_m"]<=r["goal_l1"]["tolerance_m"]
          assert r["qualification_go"] is False and r["science_go"] is False
          print("S49_L2_L1_GOAL_AUTONOMOUS_L0_REAL_WORLD_DEV_PASS",
                json.dumps({"actions":len(r["native_actions"]),
                "final_error":r["final_native_xz"]["euclidean_error_m"],
                "goal_tolerance":r["goal_l1"]["tolerance_m"]}))
          PY
      - name: Preserve real World original sources even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s49-autonomous-goal-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEV_OUTPUT }}
          retention-days: 7
      - name: Classification
        if: always()
        run: echo 'DEV_ONLY / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
