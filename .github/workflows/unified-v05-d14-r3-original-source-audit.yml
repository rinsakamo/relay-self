name: D14 R3 original natural death source read-only audit
on:
  push:
    branches:
      - dev/d14-r3-natural-world-entry-20261108
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-r3-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Original archived-run audit source tests
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python -m pytest -q tests/test_d14_natural_world.py
          ruff check tools/bug0_d14_natural_world.py tools/bug0_d14_natural_post.py tests/test_d14_natural_world.py
      - name: Download immutable R3 natural World artifact from old failed run
        uses: actions/download-artifact@v4
        with:
          name: d14-r3-natural-survival-oneworld-originals
          run-id: 42489075857
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: r3-original
      - name: Verify all frozen original SHA256
        run: |
          cd r3-original
          sha256sum --check SHA256SUMS.txt
      - name: Read-only Paper death and journal independent audit (no original rewrite)
        run: |
          mkdir -p r3-audit-only
          python -B -m tools.bug0_d14_natural_post \
            --report r3-original/report.json \
            --server-log r3-original/paper_original.log \
            --event-journal r3-original/d14_natural_events.jsonl \
            --source-only-failed-cleanup \
            --out r3-audit-only/source_only_independent_audit.json
          python - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path('r3-original/report.json').read_text())
          result=json.loads(Path('r3-audit-only/source_only_independent_audit.json').read_text())
          assert report['status']=='FAIL'
          assert report['classification']=='DEV_D14_R3_TEARDOWN_UNQUALIFIED'
          assert result['status']=='SOURCE_ONLY_DEV'
          assert result['teardown_qualified'] is False
          assert result['reached_10000_ticks'] is False
          assert result['self_died_before_limit'] is True
          assert result['observed_world_ticks']==309
          assert result['eventual_reason']=='SELF_DIED'
          assert result['managed_zombie_deaths']==0
          assert result['managed_zombie_respawns']==0
          assert result['new_original_s49_actions']==0
          assert result['learning_updates']==0
          print('R3_REAL_PAPER_SELF_DEATH_TICK309_SOURCE_ONLY_PASS')
          PY
          (cd r3-audit-only && sha256sum source_only_independent_audit.json > SHA256SUMS.txt)
      - name: Store DERIVATIVE ONLY, never overwrite original R3
        uses: actions/upload-artifact@v4
        with:
          name: d14-r3-early-death-source-only-independent-audit
          path: r3-audit-only/
          retention-days: 30
          if-no-files-found: error
