name: D14 R7 original S49 native evidence offline DEV
on:
  push:
    branches:
      - dev/d14-r7-original-motion-evidence-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r7-unresolved-native-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact R7 HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact HEAD
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned test tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
      - name: Repository contracts
        run: python tools/check_repository.py
      - name: R7 forensic plus original R6 and D14 regressions
        run: |
          python -m pytest -q -x \
            tests/test_d14_r7_native_evidence.py \
            tests/test_d14_natural_motion_r6.py \
            tests/test_d14_natural_world.py \
            tests/test_d14_natural_active_s49.py \
            tests/test_d14_local_oneworld.py \
            tests/test_d14_tick_horizon.py \
            tests/test_d12_experience_bridge.py \
            tests/test_d12_third_intent_rearm.py
      - name: Ruff evidence boundaries
        run: |
          ruff check \
            adapters/mineflayer/s31a_real_server_ci.py \
            tools/bug0_d14_natural_motion.py \
            tools/bug0_d14_natural_world.py \
            tools/bug0_d14_natural_active_post.py \
            tools/bug0_d14_natural_life.py \
            tools/bug0_d14_local_oneworld.py \
            tools/bug0_d14_r7_evidence_post.py \
            tests/test_d14_r7_native_evidence.py \
            tests/test_d14_natural_motion_r6.py
      - name: Build pinned DEV respawn plugin
        run: mvn -B -ntp -f adapters/mineflayer/zombie_respawn_dev/pom.xml -DskipTests package
      - name: Original Java respawn and natural tick tests
        run: |
          java -ea -cp adapters/mineflayer/zombie_respawn_dev/target/classes:adapters/mineflayer/zombie_respawn_dev/target/test-classes \
            io.github.rinsakamo.respawn.RespawnCycleTest
          java -ea -cp adapters/mineflayer/zombie_respawn_dev/target/classes:adapters/mineflayer/zombie_respawn_dev/target/test-classes \
            io.github.rinsakamo.respawn.TickObservationHorizonTest
          java -ea -cp adapters/mineflayer/zombie_respawn_dev/target/classes:adapters/mineflayer/zombie_respawn_dev/target/test-classes \
            io.github.rinsakamo.respawn.NaturalAnchorCandidatesTest
