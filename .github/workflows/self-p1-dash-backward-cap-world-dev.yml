name: P1 DASH Backward Cap Real World DEV
on:
  push:
    branches:
      - self/dev-p1-gait-net-recovery-dash-20261025
    paths:
      - .github/workflows/self-p1-dash-backward-cap-world-dev.yml
      - adapters/mineflayer/s49_paper_world_first_dev.py
      - 'adapters/mineflayer/s49_paper_dash_dev/**'

permissions:
  contents: read

concurrency:
  group: s49-dash-backward-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  world-first-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      DEV_OUTPUT: '/tmp/s49-paper-dash-${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify DEV observer config, dependencies and loopback isolation
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -q '^enabled: false$' adapters/mineflayer/s49_paper_wait_observer_dev/src/main/resources/config.yml
          python - <<'PY'
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
              s.bind(("127.0.0.1", 25565))
          print("Fresh loopback Minecraft port available; no external process touched")
          PY
      - name: Python 3.12 focused and Ruff BEFORE any World
        run: |
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          python -m compileall -q adapters/mineflayer/s49_paper_world_first_dev.py experiments/p1_gait_dev.py tests/test_p1_gait_dev.py
          ruff check adapters/mineflayer/s49_paper_world_first_dev.py experiments/p1_gait_dev.py tests/test_p1_gait_dev.py
          python -m pytest -q tests/test_p1_gait_dev.py tests/test_fatigue_p1.py
      - name: Compile single read-only Paper wait observer on Java 21
        run: |
          mvn -B -ntp -f adapters/mineflayer/s49_paper_wait_observer_dev/pom.xml -DskipTests package
          test -f adapters/mineflayer/s49_paper_wait_observer_dev/target/relay-s49-wait-observer-dev-0.1.0-dev.jar
      - name: Compile independent Paper DASH modifier plugin
        run: |
          mvn -B -ntp -f adapters/mineflayer/s49_paper_dash_dev/pom.xml -DskipTests package
          test -f adapters/mineflayer/s49_paper_dash_dev/target/relay-s49-dash-dev-0.1.0-dev.jar
      - name: Install original Mineflayer package (unmodified bridge)
        run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - name: Fetch official stable Paper 1.21.8 build 60 and verify published SHA256
        id: paper
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          version = "1.21.8"
          api = f"https://fill.papermc.io/v3/projects/paper/versions/{version}/builds"
          ua = "RelaySelf-S49-P1-WORLD-FIRST-DEV/0.1 (https://github.com/rinsakamo/relay-self)"
          req = urllib.request.Request(api, headers={"User-Agent": ua})
          with urllib.request.urlopen(req, timeout=50) as rsp:
              builds = json.loads(rsp.read(3_000_000))
          stable = [b for b in builds if b.get("channel") == "STABLE" and b.get("id") == 60]
          if len(stable) != 1:
              raise RuntimeError("Pinned Paper 1.21.8 stable build 60 unavailable")
          artifact = stable[0]["downloads"]["server:default"]
          expected = "8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e"
          if (artifact["checksums"]["sha256"] != expected
                  or artifact["size"] != 52811717):
              raise RuntimeError("Pinned original Paper build metadata mismatch")
          url = artifact["url"]
          parsed = urllib.parse.urlparse(url)
          if (parsed.scheme != "https" or parsed.hostname != "fill-data.papermc.io"
                  or not parsed.path.startswith("/v1/objects/")):
              raise RuntimeError("Untrusted Paper binary URL")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "paper-1.21.8-dev.jar"
          hash_ = hashlib.sha256()
          total = 0
          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua}), timeout=120) as src, target.open("xb") as dst:
              while chunk := src.read(1048576):
                  total += len(chunk)
                  if total > 52811717: raise RuntimeError("Paper size exceeded")
                  dst.write(chunk)
                  hash_.update(chunk)
          if total != 52811717 or hash_.hexdigest() != expected:
              raise RuntimeError("Paper downloaded bytes mismatch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"jar={target}\nsha256={expected}\n")
          print("PAPER_DEV_PINNED", total, expected)
          PY
      - name: One real Paper World — original S49 BACKWARD Action with DASH stance
        env:
          PAPER_JAR: ${{ steps.paper.outputs.jar }}
          PAPER_SHA: ${{ steps.paper.outputs.sha256 }}
        run: |
          set -euo pipefail
          OBSERVER="$PWD/adapters/mineflayer/s49_paper_wait_observer_dev/target/relay-s49-wait-observer-dev-0.1.0-dev.jar"
          OBSERVER_SHA="$(sha256sum "$OBSERVER" | cut -d' ' -f1)"
          DASH="$PWD/adapters/mineflayer/s49_paper_dash_dev/target/relay-s49-dash-dev-0.1.0-dev.jar"
          DASH_SHA="$(sha256sum "$DASH" | cut -d' ' -f1)"
          python -m adapters.mineflayer.s49_paper_world_first_dev \
            --output-dir "$DEV_OUTPUT" \
            --paper-jar "$PAPER_JAR" --paper-sha256 "$PAPER_SHA" \
            --observer-jar "$OBSERVER" --observer-sha256 "$OBSERVER_SHA" \
            --dash-jar "$DASH" --dash-sha256 "$DASH_SHA" \
            --confirm S49-P1-DEV-DISPOSABLE-PAPER-WORLD \
            --dash-negative-control-dev
      - name: Verify original S49 issued BACKWARD effect and no DASH bonus
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["DEV_OUTPUT"])
          report=json.loads((root/"world_first_dev_report.json").read_text())
          source=json.loads((root/"original_s49_report.json").read_text())
          assert report["status"] == "PASS" and source["status"] == "PASS"
          assert source["node_exit"] == 0 and source["server_exit"] == 0
          assert len(source["actual_native_actions"]) == 2
          assert all(a["terminal"] == "outcome" for a in source["actual_native_actions"])
          n=report["dash_negative_control_result_dev"]
          assert n["status"] == "DEV_S49_BACKWARD_MOTION_NO_DASH_BOOST_OBSERVED"
          assert n["original_issued_action_id"] == source["actual_native_actions"][1]["action"]
          assert n["source_session_id"] == source["session_id"]
          assert n["paper_gait_ticks_observed"] >= 1
          assert n["forward_modifier_active_ticks"] == 0
          assert n["dash_stance_kept_during_backward"] is True
          assert n["m0_posted"] is False and n["p1_native_updated"] is False
          assert n["forward_dash_verified"] is False and n["sideways_cap_verified"] is False
          assert n["qualification_go"] is False and n["science_go"] is False
          print("S49_DASH_BACKWARD_NEGATIVE_REAL_WORLD_DEV_PASS",n)
          PY
      - name: Print bounded Paper DEV plugin log for failure diagnosis
        if: failure()
        run: |
          if test -f "$DEV_OUTPUT/paper_server.log"; then
            grep -E 'S49_DASH_DEV|RelayS49DashDev|S49 FAIL|SEVERE' "$DEV_OUTPUT/paper_server.log" | tail -n 70 || true
          fi
      - name: Preserve native S49/Paper/Node and three-clock review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s49-dash-backward-cap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEV_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 7
      - name: DEV epistemic boundary
        if: always()
        run: |
          echo 'DEV_ONLY / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
          echo 'Backward-only negative control cannot qualify forward DASH or sideways speed cap.'
