name: Bug-0 original S49 REST one passive World DEV
on:
  push:
    branches:
      - dev/bug0-s49-rest-passive-world-20261104

permissions:
  contents: read

jobs:
  one-rest-world:
    # A unique commit message alone authorizes one new passive DEV World.
    if: ${{ github.event.head_commit.message == 'run-bug0-s49-rest-passive-once-20261104' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      S49_REAL_SERVER_CI: '1'
      S49_BUG0_REST_DEV_ONLY: '1'
      NODE_OPTIONS: ''
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if (require('./adapters/mineflayer/node_modules/mineflayer/package.json').version !== '4.39.0') process.exit(2)"
      - name: One original S49 passive REST World
        run: |
          mkdir -p rest-evidence
          python -B -m adapters.mineflayer.s49_normal_session_real_ci --bug0-rest-dev --report rest-evidence/s49_rest.json --server-log rest-evidence/paper.log
      - name: Verify bounded hold but NO P1 fatigue recovery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('rest-evidence/s49_rest.json').read_text())
          assert r['status']=='PASS',r.get('error')
          assert r['classification']=='DEV_ONLY_S49_REST_PAPER_TICKS_AND_STATIONARY_ENDPOINTS'
          assert r['actual_native_actions']==[] and r['rest_action_issued'] is False
          assert r['rest_endpoint_stationary_observed'] is True
          assert r['rest_endpoint_position_delta_m']<=0.03
          assert 8<=r['rest_paper_elapsed_ticks']<=100
          b,a=r['rest_paper_time_before'],r['rest_paper_time_after']
          assert a['tick']-b['tick']==r['rest_paper_elapsed_ticks']
          assert a['source']==b['source']=='ORIGINAL_PAPER_SERVER_CONSOLE'
          assert r['rest_original_native_before']['preferred']=='REST'
          assert r['rest_original_native_after']['preferred']=='REST'
          assert r['rest_p1_model_integrated'] is False
          assert r['rest_p1_fatigue_before'] is None
          assert r['rest_p1_fatigue_after'] is None
          assert r['rest_p1_fatigue_recovered']==0
          assert r['rest_full_tick_inactivity_attested'] is False
          assert r['rest_world_source_independently_attested'] is False
          assert r['rest_energy_debit']==0 and r['m_energy_credited'] is False
          assert r['real_model_calls']==0 and r['learning_in_world'] is False
          assert r['node_exit']==0 and r['server_exit']==0
          print('S49_DEV_REST_PASSIVE_ONLY',b['tick'],a['tick'])
          PY
      - name: Hash originals on success or failure
        if: always()
        run: |
          if test -d rest-evidence; then
            (cd rest-evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bug0-s49-rest-passive-originals
          path: rest-evidence/
          if-no-files-found: warn
          retention-days: 30
