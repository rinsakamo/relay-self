name: Bug-0 S51 EAT owner lineage offline
on:
  push:
    branches:
      - dev/bug0-s51-eat-lineage-guard-20261103
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install offline test tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
      - name: Static contracts
        run: |
          python tools/check_repository.py
          python -m compileall -q adapters/mineflayer/eat_execution.py adapters/mineflayer/normal_action.py adapters/mineflayer/s51_eat_real_ci.py tests/test_bug0_s51_eat_owner_binding.py tests/test_bug0_s49_s51_eat_handoff.py
          ruff check adapters/mineflayer/eat_execution.py adapters/mineflayer/s51_eat_real_ci.py tests/test_bug0_s51_eat_owner_binding.py
      - name: Original S49 S51 and Bug-0 bounded tests
        run: |
          python -m pytest -q tests/test_bug0_s49_s51_eat_handoff.py tests/test_bug0_s51_eat_owner_binding.py tests/test_feature_s51_eat_execution.py tests/test_feature_s46_eat.py tests/test_feature_s49_normal_runtime.py
      - name: No physical World or model run
        run: |
          echo 'OFFLINE_ONLY; World=0; Gemma=0; physical_Action=0; Learning_write=0'
