name: SelfBody S50 next original S49 native epoch DEV
on:
  push:
    branches:
      - dev/selfbody-s50-next-epoch-passive-20261031
    paths:
      - 'adapters/mineflayer/self_body_s50_next_epoch_passive.py'
      - 'tests/test_self_body_s50_next_epoch_passive.py'
      - 'docs/selfbody-s50-next-epoch-dev-20261031.md'
      - '.github/workflows/selfbody-s50-next-epoch-dev.yml'
  pull_request:
    paths:
      - 'adapters/mineflayer/self_body_s50_next_epoch_passive.py'
      - 'tests/test_self_body_s50_next_epoch_passive.py'
      - 'docs/selfbody-s50-next-epoch-dev-20261031.md'
      - '.github/workflows/selfbody-s50-next-epoch-dev.yml'
permissions:
  contents: read
jobs:
  offline-next-epoch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src:tests:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Typed existing S49 and SelfBody next native source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          ruff check adapters/mineflayer/self_body_s50_next_epoch_passive.py tests/test_self_body_s50_next_epoch_passive.py
          python -m compileall -q adapters/mineflayer/self_body_s50_next_epoch_passive.py tests/test_self_body_s50_next_epoch_passive.py
          python -m pytest -o addopts='' -q \
            tests/test_self_body_s50_next_epoch_passive.py \
            tests/test_self_body_s50_original_closure.py \
            tests/test_self_body_s50_motion_companion.py \
            tests/test_self_body.py \
            tests/test_self_product_passive_views.py
          python tools/check_repository.py
      - name: No real World in CI
        if: always()
        run: echo 'DEV_ONLY / NEXT_EPOCH_OFFLINE_OWNER_SHAPE / NO_REAL_NEXT_L0_PROBE / NO_NATIVE_PROBE_ISSUED / NO_ACTION/GOAL/P1/L10/SCIENCE'
