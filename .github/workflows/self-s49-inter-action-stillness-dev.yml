name: S49 Original Inter-Action Stillness Candidate DEV
on:
  push:
    branches:
      - self/dev-s49-forward-motor-admission-20261026
      - self/dev-p1-causal-wait-shadow-20261027
      - self/dev-p1-observed-wait-frames-20261027
      - self/dev-p1-selfbody-next-epoch-20261027
    paths:
      - .github/workflows/self-s49-inter-action-stillness-dev.yml
      - adapters/mineflayer/bridge.mjs
      - adapters/mineflayer/s49_normal_session_real_ci.py
      - adapters/mineflayer/s49_inter_action_stillness_dev.py
      - adapters/mineflayer/s49_causal_wait_fence_dev.py
      - adapters/mineflayer/s49_p1_fenced_recovery_shadow_dev.py
      - tests/test_s49_p1_fenced_recovery_shadow_dev.py
      - adapters/mineflayer/s49_p1_dev_wait_observed.py
      - tests/test_s49_p1_dev_wait_observed.py
      - adapters/mineflayer/s49_p1_selfbody_epoch_shadow_dev.py
      - tests/test_s49_p1_selfbody_epoch_shadow_dev.py
      - 'adapters/mineflayer/s49_paper_dash_dev/**'
      - adapters/mineflayer/s49_paper_forward_dash_dev.py
      - tests/test_s49_inter_action_stillness_dev.py
      - tests/test_s49_original_owner_gap_dev.py
      - tests/test_s49_causal_wait_fence_dev.py

permissions:
  contents: read

concurrency:
  group: s49-inter-action-stillness-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  world-first-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      S49_REAL_SERVER_CI: '1'
      S49_FORWARD_MOTOR_DEV_ONLY: '1'
      S49_SPRINT_MOTOR_DEV_ONLY: '1'
      S49_SPEED_ATTR_DIAG_DEV_ONLY: '1'
      S49_SPEED_ATTR_SYNC_DEV_ONLY: '1'
      S49_P1_LIVE_DASH_DEV_ONLY: '1'
      S49_M0_DASH_DEBIT_DEV_ONLY: '1'
      S49_M0_ACTION_STEP_DEV_ONLY: '1'
      S49_NATIVE_EFFECT_EDGE_DEV_ONLY: '1'
      S49_POST_RELEASE_MOTION_DEV_ONLY: '1'
      S49_NODE_PHYSICS_TRACE_DEV_ONLY: '1'
      S49_M0_WORLDTIME_SHADOW_DEV_ONLY: '1'
      S49_TWO_ACTION_WORLD_TIMELINE_DEV_ONLY: '1'
      S49_INTER_ACTION_CONTROL_DEV_ONLY: '1'
      S49_INTER_ACTION_OWNER_GAP_DEV_ONLY: '1'
      S49_CAUSAL_OWNER_PAPER_FENCE_DEV_ONLY: '1'
      S49_P1_FENCED_SHADOW_DEV_ONLY: '1'
      S49_P1_OBSERVED_WAIT_MODEL_DEV_ONLY: '1'
      S49_P1_NEXT_SELFBODY_EPOCH_DEV_ONLY: '1'
      DEV_OUTPUT: '/tmp/s49-stillness-${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify DEV observer config, dependencies and loopback isolation
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -q '^enabled: false$' adapters/mineflayer/s49_paper_wait_observer_dev/src/main/resources/config.yml
          python - <<'PY'
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
              s.bind(("127.0.0.1", 25565))
          print("Fresh loopback Minecraft port available; no external process touched")
          PY
      - name: Python 3.12 focused and Ruff BEFORE any World
        run: |
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          node --check adapters/mineflayer/bridge.mjs
          node --test adapters/mineflayer/s49_speed_attribute_bridge_dev.test.mjs
          python -m compileall -q adapters/mineflayer/s49_paper_forward_dash_dev.py adapters/mineflayer/s49_normal_session_real_ci.py adapters/mineflayer/b0_energy_bridge.py tests/test_s49_m0_action_steps_dev.py tests/test_s49_paper_action_bracket_dev.py tests/test_s49_native_ack_paper_edges_dev.py tests/test_s49_post_release_motion_dev.py tests/test_s49_node_physics_postclear_dev.py tests/test_s49_node_paper_motion_fingerprint_dev.py tests/test_s49_m0_world_time_shadow_dev.py adapters/mineflayer/s49_m0_world_time_shadow_dev.py adapters/mineflayer/s49_two_action_world_timeline_dev.py tests/test_s49_two_action_world_timeline_dev.py adapters/mineflayer/s49_inter_action_stillness_dev.py tests/test_s49_inter_action_stillness_dev.py tests/test_s49_original_owner_gap_dev.py tests/test_s49_causal_wait_fence_dev.py adapters/mineflayer/s49_causal_wait_fence_dev.py adapters/mineflayer/s49_p1_fenced_recovery_shadow_dev.py tests/test_s49_p1_fenced_recovery_shadow_dev.py adapters/mineflayer/s49_p1_dev_wait_observed.py tests/test_s49_p1_dev_wait_observed.py adapters/mineflayer/s49_p1_selfbody_epoch_shadow_dev.py tests/test_s49_p1_selfbody_epoch_shadow_dev.py
          ruff check adapters/mineflayer/s49_p1_selfbody_epoch_shadow_dev.py tests/test_s49_p1_selfbody_epoch_shadow_dev.py adapters/mineflayer/s49_p1_dev_wait_observed.py tests/test_s49_p1_dev_wait_observed.py adapters/mineflayer/s49_p1_fenced_recovery_shadow_dev.py tests/test_s49_p1_fenced_recovery_shadow_dev.py adapters/mineflayer/s49_causal_wait_fence_dev.py tests/test_s49_causal_wait_fence_dev.py adapters/mineflayer/s49_inter_action_stillness_dev.py tests/test_s49_inter_action_stillness_dev.py tests/test_s49_original_owner_gap_dev.py adapters/mineflayer/s49_two_action_world_timeline_dev.py tests/test_s49_two_action_world_timeline_dev.py adapters/mineflayer/s49_m0_world_time_shadow_dev.py tests/test_s49_m0_world_time_shadow_dev.py adapters/mineflayer/s49_paper_forward_dash_dev.py adapters/mineflayer/s49_normal_session_real_ci.py adapters/mineflayer/b0_energy_bridge.py adapters/mineflayer/s49_node_physics_postclear_dev.py adapters/mineflayer/execution.py tests/test_s49_node_physics_postclear_dev.py tests/test_s49_node_paper_motion_fingerprint_dev.py tests/test_s49_m0_dash_extra_owner_dev.py
          python -m pytest -q tests/test_s49_p1_selfbody_epoch_shadow_dev.py tests/test_s49_p1_dev_wait_observed.py tests/test_s49_p1_fenced_recovery_shadow_dev.py tests/test_s49_causal_wait_fence_dev.py tests/test_s49_original_owner_gap_dev.py tests/test_s49_inter_action_stillness_dev.py tests/test_s49_two_action_world_timeline_dev.py tests/test_s49_m0_world_time_shadow_dev.py tests/test_s49_node_physics_postclear_dev.py tests/test_s49_node_paper_motion_fingerprint_dev.py tests/test_s49_native_ack_paper_edges_dev.py tests/test_s49_post_release_motion_dev.py tests/test_s49_m0_action_steps_dev.py tests/test_s49_paper_action_bracket_dev.py tests/test_b0_energy_bridge.py tests/test_s49_p1_paper_motor_dev.py tests/test_p1_gait_dev.py tests/test_s49_paper_forward_dash_dev.py tests/test_s49_forward_motor_admission_dev.py
      - name: Compile independent Paper DASH modifier plugin
        run: |
          mvn -B -ntp -f adapters/mineflayer/s49_paper_dash_dev/pom.xml -DskipTests package
          test -f adapters/mineflayer/s49_paper_dash_dev/target/relay-s49-dash-dev-0.1.0-dev.jar
      - name: Verify original Node bridge parses
        run: node --check adapters/mineflayer/bridge.mjs
      - name: Install original Mineflayer package (unmodified bridge)
        run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - name: Fetch official stable Paper 1.21.8 build 60 and verify published SHA256
        id: paper
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          version = "1.21.8"
          api = f"https://fill.papermc.io/v3/projects/paper/versions/{version}/builds"
          ua = "RelaySelf-S49-P1-WORLD-FIRST-DEV/0.1 (https://github.com/rinsakamo/relay-self)"
          req = urllib.request.Request(api, headers={"User-Agent": ua})
          with urllib.request.urlopen(req, timeout=50) as rsp:
              builds = json.loads(rsp.read(3_000_000))
          stable = [b for b in builds if b.get("channel") == "STABLE" and b.get("id") == 60]
          if len(stable) != 1:
              raise RuntimeError("Pinned Paper 1.21.8 stable build 60 unavailable")
          artifact = stable[0]["downloads"]["server:default"]
          expected = "8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e"
          if (artifact["checksums"]["sha256"] != expected
                  or artifact["size"] != 52811717):
              raise RuntimeError("Pinned original Paper build metadata mismatch")
          url = artifact["url"]
          parsed = urllib.parse.urlparse(url)
          if (parsed.scheme != "https" or parsed.hostname != "fill-data.papermc.io"
                  or not parsed.path.startswith("/v1/objects/")):
              raise RuntimeError("Untrusted Paper binary URL")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "paper-1.21.8-dev.jar"
          hash_ = hashlib.sha256()
          total = 0
          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua}), timeout=120) as src, target.open("xb") as dst:
              while chunk := src.read(1048576):
                  total += len(chunk)
                  if total > 52811717: raise RuntimeError("Paper size exceeded")
                  dst.write(chunk)
                  hash_.update(chunk)
          if total != 52811717 or hash_.hexdigest() != expected:
              raise RuntimeError("Paper downloaded bytes mismatch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"jar={target}\nsha256={expected}\n")
          print("PAPER_DEV_PINNED", total, expected)
          PY
      - name: One real Paper World — original S49 M0 owner debits P1 verified DASH
        env:
          PAPER_JAR: ${{ steps.paper.outputs.jar }}
          PAPER_SHA: ${{ steps.paper.outputs.sha256 }}
        run: |
          set -euo pipefail
          DASH="$PWD/adapters/mineflayer/s49_paper_dash_dev/target/relay-s49-dash-dev-0.1.0-dev.jar"
          DASH_SHA="$(sha256sum "$DASH" | cut -d' ' -f1)"
          python -m adapters.mineflayer.s49_paper_forward_dash_dev \
            --output-dir "$DEV_OUTPUT" \
            --paper-jar "$PAPER_JAR" --paper-sha256 "$PAPER_SHA" \
            --dash-jar "$DASH" --dash-sha256 "$DASH_SHA" \
            --confirm S49-P1-DEV-DISPOSABLE-PAPER-WORLD --p1-live-dev --m0-live-dev --m0-move-dev --native-edges-dev --post-release-dev --node-physics-dev --m0-worldtime-shadow-dev --two-action-timeline-dev --inter-action-stillness-dev --causal-owner-fence-dev --p1-fenced-recovery-shadow-dev --p1-observed-wait-model-dev --p1-next-selfbody-epoch-dev
      - name: Verify original forward+sprint S16 and Paper positive modifier ticks
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from adapters.mineflayer.self_action_evidence import verify_native_action_evidence
          root=Path(os.environ["DEV_OUTPUT"])
          report=json.loads((root/"paper_forward_dash_dev_report.json").read_text())
          source=json.loads((root/"original_s49_report.json").read_text())
          assert report["status"] in ("DEV_FORWARD_SPRINT_POSITIVE_PAPER_DASH_OBSERVED", "DEV_FORWARD_SPRINT_MOTION_GATED_PAPER_DASH_OBSERVED"), report
          assert source["status"] == "PASS" and source["node_exit"] == 0 and source["server_exit"] == 0
          assert source["dev_sprint_motor"] is True
          assert len(source["actual_native_actions"]) == 2
          for a in source["actual_native_actions"]:
              e=a["execution_evidence"]
              assert a["terminal"] == "outcome" and a["movement_m"] > 0.05
              assert e["action_ref"] == "MOVE_FORWARD_SPRINT_DEV"
              verify_native_action_evidence(
                  e, action_id=a["action"], session_id=source["session_id"],
                  movement_m=a["movement_m"],
                  allow_dev_forward=True, allow_dev_sprint=True,
              )
          p=report["paper"]
          assert p["paper_forward_boost_ticks"] >= 1
          assert p["paper_forward_boost_ticks"] >= p["paper_motion_inferred_boost_ticks"]
          assert p["paper_modifier_removed"] is True
          p1=report["p1_paper_motor_dev"]
          assert p1["single_p1_model_replayed"] is True
          assert p1["world_ticks_replayed"] >= 10
          assert p1["actual_power_fade"] > 0.01
          assert 0 < p1["last_boost_power"] < p1["initial_boost_power"] < 1
          assert p1["m0_charge_proposal_not_posted"] > 0
          assert p1["p1_ledger_posted"] is False
          assert p1["m0_ledger_posted"] is False
          assert p1["source_qualified"] is False
          posted=report["m0_s49_original_owner_postings"]
          assert len(posted) == 2
          debit=posted[0]
          second=posted[1]
          assert source["dev_m0_dash_owner"] is True
          assert source["dev_m0_dash_m0_tick"] == 2
          assert debit["session_id"] == source["session_id"]
          assert debit["action_id"] == source["actual_native_actions"][0]["action"]
          assert debit["m0_tick_before"] == 0 and debit["m0_tick_after"] == 1
          assert second["m0_tick_before"] == 1 and second["m0_tick_after"] == 2
          assert debit["basal_debit"] == second["basal_debit"] == .5
          assert debit["move_debit"] == second["move_debit"] == .25
          assert debit["dash_extra_debit"] > 0 and second["dash_extra_debit"] == 0
          assert debit["paper_world_ticks_for_dash"] == p1["world_ticks_replayed"]
          assert second["paper_world_ticks_for_dash"] == 0
          assert abs(debit["dash_extra_debit"]-p1["m0_charge_proposal_not_posted"]) < 1e-10
          assert abs(debit["energy_before"]-debit["energy_after"]-(.75+debit["dash_extra_debit"])) < 1e-10
          assert abs(second["energy_before"]-second["energy_after"]-.75) < 1e-10
          assert len(source["dev_m0_dash_unboosted_actions"]) == 1
          assert source["dev_m0_dash_unboosted_actions"] == [source["actual_native_actions"][1]["action"]]
          assert report["m0_debit_classification"] == "S49_NATIVE_OUTCOME_TWO_M0_MOVE_STEPS_PAPER_BRACKET_DEV_ONLY"
          assert report["m0_world_tick_basal_accounted"] is False
          bracket=report["paper_action_bracket"]
          assert bracket["elapsed_callbacks"] == p1["world_ticks_replayed"]
          assert bracket["boosted_callbacks"] == p["paper_forward_boost_ticks"]
          assert bracket["arm_tick"] < bracket["first_tick"] <= bracket["last_tick"] <= bracket["release_tick"]
          assert bracket["original_owner_release"] is True
          assert bracket["independent_source_attested"] is False
          ack=report["original_s49_effect_ack_paper_edges"]
          native=source["actual_native_actions"][0]["execution_evidence"]
          assert ack["native_dispatch_ack_seq"] == native["dispatch_receipt"]["seq"]
          assert ack["native_cleanup_ack_seq"] == native["cleanup_receipt"]["seq"]
          assert bracket["arm_tick"] <= ack["paper_dispatch_ack_marker_tick"] <= ack["paper_cleanup_ack_marker_tick"] <= bracket["release_tick"]
          assert ack["marker_after_native_ack"] is True
          assert ack["native_single_reader"] is True
          assert ack["cross_host_clock_synchronized"] is False
          assert ack["client_effect_world_tick_attested"] is False
          assert ack["independent_source_attested"] is False
          post=report["post_release_paper_motion_dev"]
          assert post["classification"] == "PAPER_PASSIVE_POST_RELEASE_TRANSLATION_DEV_ONLY"
          assert post["paper_callbacks"] == 5
          assert post["first_sample_tick"] == bracket["release_tick"] + 1
          assert post["last_sample_tick"] == bracket["release_tick"] + 5
          assert len(post["post_release_deltas_m"]) == 4
          assert post["first_delta_m_mixed_boundary"] >= 0
          assert all(0 <= v <= 2 for v in post["post_release_deltas_m"])
          assert post["speed_modifier_present"] is False
          assert post["action_authority"] is False
          assert post["WAIT_sourcebound_admitted"] is False
          assert post["P1_posted"] is False and post["M0_posted"] is False
          assert post["native_control_effect_tick_attested"] is False
          node=report["node_physics_postclear_dev"]
          assert node["classification"] == "NODE_LOCAL_PHYSICS_AFTER_CONTROL_CLEAR_DEV_ONLY"
          assert node["action_id"] == source["actual_native_actions"][0]["action"]
          assert node["session_id"] == source["session_id"]
          assert node["node_active_physics_ticks"] >= 2
          assert node["node_postclear_physics_ticks"] == 5
          assert node["node_forward_sprint_at_set"] is True
          assert node["node_forward_sprint_at_clear"] is False
          assert node["node_postclear_forward_sprint_all_false"] is True
          assert len(node["node_postclear_horizontal_deltas_m"]) == 5
          assert node["node_paper_tick_join_attested"] is False
          assert node["client_packet_world_tick_attested"] is False
          assert node["WAIT_sourcebound_admitted"] is False
          assert node["M0_posted"] is False and node["P1_posted"] is False
          motion=report["node_paper_motion_fingerprint_dev"]
          assert motion["native_Paper_tick_correspondence_attested"] is False
          assert motion["M0_posted"] is False and motion["P1_posted"] is False
          if motion["classification"] == "S49_NODE_PAPER_CONSECUTIVE_TRANSLATION_FOOTPRINT_DEV_ONLY":
              assert motion["matched_consecutive_nonzero_deltas"] >= 2
              assert motion["two_producer_local_motion_views_consistent"] is True
              assert "m0_worldtime_basal_shadow_dev" in report
              shadow=report["m0_worldtime_basal_shadow_dev"]
              assert shadow["classification"] == "M0_PAPER_WORLD_TICK_BASAL_SHADOW_NOT_POSTED_DEV_ONLY"
              assert shadow["observed_distinct_world_ticks"] == bracket["elapsed_callbacks"] + 5
              assert shadow["M0_posted"] is False
          else:
              # Extra continuous Paper logging shifts native Node physics
              # sampling. Do NOT turn a failed 1um match into matching proof.
              assert motion["classification"] == "NODE_PAPER_GEOMETRIC_FINGERPRINT_UNDETERMINED"
              assert motion["exact_match_confirmed"] is False
              assert "m0_worldtime_basal_shadow_dev" not in report
          timeline=report["m0_two_action_worldtime_shadow_dev"]
          assert timeline["classification"] == "M0_TWO_NATIVE_ACTIONS_CONTIGUOUS_WORLD_TIMELINE_SHADOW_DEV_ONLY"
          assert timeline["action_ids"] == [a["action"] for a in source["actual_native_actions"]]
          assert timeline["session_id"] == source["session_id"]
          assert timeline["first_sample_tick"] == bracket["arm_tick"]+1
          assert timeline["last_sample_tick"] > timeline["second_ack_delivery_cleared_tick"]
          assert timeline["first_action_paper_tick_count"] == bracket["elapsed_callbacks"]
          assert timeline["first_release_to_second_ack_delivery_bridge_ticks"] >= 5
          assert timeline["second_ack_delivery_window_ticks"] >= 3
          assert timeline["second_window_translation_proxy_ticks"] >= 3
          assert timeline["second_clear_to_tail_ticks"] == 5
          assert timeline["observed_contiguous_paper_ticks"] == (
              timeline["first_action_paper_tick_count"] +
              timeline["first_release_to_second_ack_delivery_bridge_ticks"] +
              timeline["second_ack_delivery_window_ticks"] +
              timeline["second_clear_to_tail_ticks"])
          assert abs(timeline["basal_shadow_all_observed_ticks_not_posted"] -
                     .025*timeline["observed_contiguous_paper_ticks"]) < 1e-10
          assert timeline["explicit_move_rate_per_normalized_world_second"] == .25
          assert timeline["second_window_not_exact_native_effect_timing"] is True
          assert timeline["bridge_motion_classification"] == "UNKNOWN_NOT_CERTIFIED_WAIT_OR_MOVE"
          assert timeline["tick_gaps_or_replay"] is False and timeline["double_counted_world_ticks"] is False
          assert timeline["original_owner_energy_unchanged"] == source["dev_m0_dash_energy_remaining"]
          assert timeline["original_owner_energy_unchanged"] == report["m0_s49_original_owner_remaining"]
          assert timeline["legacy_action_m0_replaced"] is False
          assert timeline["world_tick_m0_debits_posted"] is False
          assert timeline["P1_recovery_posted"] is False and timeline["WAIT_sourcebound_admitted"] is False
          assert timeline["independent_source_attested"] is False
          assert timeline["qualification_go"] is False and timeline["science_go"] is False
          print("TWO_ORIGINAL_S49_ACTIONS_CONTIGUOUS_M0_SHADOW_PASS", timeline)
          still=report["inter_action_stillness_dev"]
          assert still["classification"] == "S49_INTER_ACTION_STILLNESS_CANDIDATE_DEV_ONLY"
          assert still["action_ids"] == [a["action"] for a in source["actual_native_actions"]]
          assert still["session_id"] == source["session_id"]
          assert still["paper_consecutive_low_motion_ticks"] >= 8
          assert still["paper_first_candidate_tick"] > bracket["release_tick"] + 5
          assert still["paper_last_candidate_tick"] < timeline["second_ack_delivery_applied_tick"]
          assert still["node_physics_samples"] >= 20
          assert still["node_all_controls_off_until_second_set"] is True
          assert still["paper_observer_motor_write"] is False
          assert still["node_paper_tick_join_attested"] is False
          assert still["second_native_effect_tick_attested"] is False
          assert still["physical_WAIT_admitted"] is False
          assert still["P1_recovery_posted"] is False and still["M0_posted"] is False
          assert still["independent_source_attested"] is False
          assert still["qualification_go"] is False and still["science_go"] is False
          print("S49_INTER_ACTION_STILLNESS_CANDIDATE_NO_WAIT_PASS", still)
          owner=report["original_owner_inputoff_static_join_dev"]
          assert owner["classification"] == "S49_ORIGINAL_OWNER_NO_ACTION_ISSUE_PLUS_NODE_PAPER_STATIC_CANDIDATE_DEV_ONLY"
          assert owner["action_ids"] == [a["action"] for a in source["actual_native_actions"]]
          assert owner["session_id"] == source["session_id"]
          assert owner["same_original_executor"] is True
          assert owner["original_owner_no_new_issue_between_bookends"] is True
          assert owner["first_terminal_count"] == 1
          assert owner["at_next_action_request_count"] == 1
          assert owner["after_second_terminal_count"] == 2
          assert owner["open_actions_at_bookends"] == [0,0,0]
          assert owner["original_owner_gap_monotonic_ms"] > 100
          assert owner["node_input_off_observed_duration_ms"] > 100
          assert abs(owner["host_node_duration_difference_ms"]) <= 1000
          assert owner["host_node_duration_difference_bound_ms"] == 1000
          assert owner["bounded_source_local_duration_consistency"] is True
          assert owner["paper_candidate_consecutive_still_ticks"] >= 8
          assert owner["node_input_off_physics_callbacks"] >= 20
          assert owner["host_node_monotonic_clocks_calibrated"] is False
          assert owner["host_paper_world_tick_clocks_calibrated"] is False
          assert owner["physical_overlap_time_attested"] is False
          assert owner["global_issuer_absence_attested"] is False
          assert owner["physical_WAIT_admitted"] is False
          assert owner["P1_recovery_posted"] is False
          assert owner["M0_posted"] is False
          assert owner["qualification_go"] is False and owner["science_go"] is False
          print("S49_ORIGINAL_OWNER_INTER_ACTION_NO_NEW_ISSUE_DEV_PASS", owner)
          fence=report["original_owner_causal_paper_wait_candidate_dev"]
          assert fence["classification"] == "S49_CAUSAL_OWNER_PAPER_STATIC_SUBWINDOW_DEV_ONLY"
          assert fence["action_ids"] == [a["action"] for a in source["actual_native_actions"]]
          assert fence["session_id"] == source["session_id"]
          assert fence["world_uuid"] == timeline["world_uuid"]
          assert fence["paper_first_owner_fence_delivery_tick"] > bracket["release_tick"]
          assert fence["paper_second_owner_fence_delivery_tick"] < timeline["second_ack_delivery_applied_tick"]
          assert fence["paper_causal_subwindow_contiguous_still_ticks"] >= 8
          assert fence["paper_causal_subwindow_first_tick"] > fence["paper_first_owner_fence_delivery_tick"]
          assert fence["paper_causal_subwindow_last_tick"] < fence["paper_second_owner_fence_delivery_tick"]
          assert fence["node_original_first_clear_before_start_delivery"] is True
          assert fence["node_original_second_set_after_end_delivery"] is True
          assert fence["original_issuer_no_second_issue_during_causal_subwindow"] is True
          assert fence["paper_body_static_measured_inside_causal_subwindow"] is True
          assert fence["node_physics_paper_tick_1_to_1_attested"] is False
          assert fence["global_world_quiescence_attested"] is False
          assert fence["global_action_absence_attested"] is False
          assert fence["physical_WAIT_admitted"] is False
          assert fence["P1_recovery_posted"] is False and fence["M0_posted"] is False
          assert fence["qualification_go"] is False and fence["science_go"] is False
          print("S49_CAUSAL_OWNER_PAPER_STATIC_SUBWINDOW_DEV_PASS", fence)
          p1_shadow=report["p1_fenced_recovery_shadow_dev"]
          assert p1_shadow["classification"] == "P1_CAUSALLY_FENCED_STATIC_WAIT_COUNTERFACTUAL_UNAPPLIED_DEV_ONLY"
          assert p1_shadow["candidate_ticks"] == fence["paper_causal_subwindow_contiguous_still_ticks"]
          assert p1_shadow["counterfactual_p1_recovered_if_all_wait"] > 0
          assert p1_shadow["verified_physical_WAIT_ticks"] == 0
          assert p1_shadow["p1_recovery_applied"] == 0
          assert p1_shadow["actual_p1_state_updated"] is False
          assert p1_shadow["m0_posted"] is False
          assert p1_shadow["original_m0_energy_remaining_unchanged"] == source["dev_m0_dash_energy_remaining"]
          assert p1_shadow["physical_wait_admitted"] is False
          assert p1_shadow["qualification_go"] is False and p1_shadow["science_go"] is False
          print("S49_P1_FENCED_WAIT_COUNTERFACTUAL_UNAPPLIED_DEV_PASS", p1_shadow)
          model=report["p1_observed_wait_model_dev"]
          assert model["evidence_grade"] == "DEV_WORLD_OBSERVED"
          assert model["dev_wait_model_ticks_replayed"] == fence["paper_causal_subwindow_contiguous_still_ticks"]
          assert model["first_tick"] == fence["paper_causal_subwindow_first_tick"]
          assert model["last_tick"] == fence["paper_causal_subwindow_last_tick"]
          assert abs(model["p1_dev_model_recovered"] - p1_shadow["counterfactual_p1_recovered_if_all_wait"]) < 1e-11
          assert model["p1_dev_state_is_counterfactual_copy"] is True
          assert model["actual_physical_recovery_attested"] is False
          assert model["r_qualified_wait_ticks"] == 0
          assert model["r_qualified_p1_recovery"] == 0
          assert model["live_p1_owner_state_modified"] is False
          assert model["m0_posted"] is False and model["source_bound_tick_created"] is False
          assert model["qualification_go"] is False and model["science_go"] is False
          print("S49_P1_SOURCE_TICK_DEV_MODEL_REPLAY_PASS", model)

          body=report["p1_next_selfbody_epoch_shadow_dev"]
          assert body["classification"] == "P1_RETROSPECTIVE_NEXT_SELFBODY_HYPOTHESES_DEV_ONLY"
          assert body["session_id"] == source["session_id"]
          assert body["action_ids"] == [a["action"] for a in source["actual_native_actions"]]
          assert body["epoch_hypotheses_count"] == 2
          assert body["paper_candidate_source_sha256"] == model["paper_candidate_source_sha256"]
          assert body["unclassified_gap_ticks_before_candidate"] >= 1
          assert body["no_recovery_carry_fatigue_bp"] > body["wait_assumed_fatigue_bp"]
          assert body["wait_assumed_forward_dash_ceiling_bp"] >= body["no_recovery_forward_dash_ceiling_bp"]
          assert body["model_ceiling_gain_bp"] > 0
          assert body["model_not_actual_fatigue_bounds"] is True
          assert body["next_original_action_is_historical"] is True
          assert body["native_present_or_postcandidate_p1_sensor"] is None
          assert body["physically_admitted_next_action_power"] is None
          assert body["original_s49_action_policy_modified"] is False
          assert body["new_action_issuers"] == 0 and body["additional_native_reads"] == 0
          assert body["live_p1_state_modified"] is False and body["m0_posted"] is False
          assert body["qualified_wait_ticks"] == 0
          assert body["qualification_go"] is False and body["science_go"] is False
          print("P1_NEXT_SELFBODY_HYPOTHETICAL_CAPACITY_DEV_PASS", body)

          gain=report["physical_gain_dev"]
          assert gain["native_gain_observed_dev"] is True
          assert gain["native_displacement_gain_m"] >= 0.40
          assert gain["paper_sampled_peak_mps"] >= 7.5
          assert gain["speed_cap_or_direction_qualified"] is False
          assert p["m0_posted"] is False and p["p1_native_updated"] is False # Paper itself never owns M0
          assert p["qualification_go"] is False and p["science_go"] is False
          print("S49_ORIGINAL_FORWARD_SPRINT_PAPER_DASH_DEV_PASS",p)
          PY
      - name: Print bounded Paper speed attribute trace for source debugging
        if: always()
        run: |
          if test -f "$DEV_OUTPUT/paper_server.log"; then
            grep -E 'S49_DASH_SPEED_ATTRIBUTE_DEV' "$DEV_OUTPUT/paper_server.log" | head -n 32 || true
          fi
      - name: Print bounded Paper DEV plugin log for failure diagnosis
        if: failure()
        run: |
          if test -f "$DEV_OUTPUT/paper_server.log"; then
            grep -E 'S49_DASH_DEV|RelayS49DashDev|S49 FAIL|SEVERE' "$DEV_OUTPUT/paper_server.log" | tail -n 70 || true
          fi
      - name: Preserve native S49/Paper/Node and three-clock review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s49-inter-action-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEV_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 7
      - name: DEV epistemic boundary
        if: always()
        run: |
          echo 'DEV_ONLY / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
          echo 'Original S49 inter-Action Paper stillness candidate plus Node input-off local trace: unknown clock join; no physical WAIT, M0 debit or P1 recovery.'
