name: S49 L1 Detour Original L2 Goal Native Minecraft DEV
on:
  push:
    branches:
      - self/dev-goal-l1-waypoint-bypass-20261028
    paths:
      - .github/workflows/self-goal-l1-detour-dev.yml
      - src/relay_self/goal_detour_dev.py
      - adapters/mineflayer/s49_goal_executor_dev.py
      - adapters/mineflayer/s49_goal_loop_real_dev.py
      - adapters/mineflayer/s49_goal_waypoint_route_dev.py
      - adapters/mineflayer/s49_goal_l1_detour_review_dev.py
      - tests/test_s49_goal_l1_detour_dev.py

permissions:
  contents: read

concurrency:
  group: s49-l1-detour-${{ github.ref }}
  cancel-in-progress: false

jobs:
  two-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      S49_REAL_SERVER_CI: '1'
      S49_FORWARD_MOTOR_DEV_ONLY: '1'
      S49_L0_GOAL_LOOP_DEV_ONLY: '1'
      S49_L0_TURN_DEV_ONLY: '1'
      S49_L0_WALL_DEV_ONLY: '1'
      S49_L1_WAYPOINT_DEV_ONLY: '1'
      DEV_OUTPUT: '/tmp/s49-l1-route-${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Python3.12 focused, Ruff, node syntax, then Minecraft
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          python -m compileall -q src/relay_self/goal_detour_dev.py adapters/mineflayer/s49_goal_executor_dev.py adapters/mineflayer/s49_goal_loop_real_dev.py adapters/mineflayer/s49_goal_waypoint_route_dev.py adapters/mineflayer/s49_goal_l1_detour_review_dev.py tests/test_s49_goal_l1_detour_dev.py
          ruff check src/relay_self/goal_detour_dev.py adapters/mineflayer/s49_goal_executor_dev.py adapters/mineflayer/s49_goal_loop_real_dev.py adapters/mineflayer/s49_goal_waypoint_route_dev.py adapters/mineflayer/s49_goal_l1_detour_review_dev.py tests/test_s49_goal_l1_detour_dev.py
          python -m pytest -q tests/test_s49_goal_l1_detour_dev.py tests/test_s49_goal_turn_wall_dev.py tests/test_s49_goal_navigation_dev.py
          node --check adapters/mineflayer/bridge.mjs
      - name: Install original Mineflayer
        run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - name: Two original physical Minecraft 1.21.8 Worlds wall-only and detour
        run: |
          set -euo pipefail
          mkdir -m 700 "$DEV_OUTPUT"
          python -m adapters.mineflayer.s49_goal_loop_real_dev \
            --output-dir "$DEV_OUTPUT/WALL_STOP" \
            --confirm S49-GOAL-L0-DEV-DISPOSABLE-WORLD \
            --offset-m 4.0 --obstacle-wall-dev
          python -m adapters.mineflayer.s49_goal_loop_real_dev \
            --output-dir "$DEV_OUTPUT/DETOUR" \
            --confirm S49-GOAL-L0-DEV-DISPOSABLE-WORLD \
            --offset-m 4.0 --obstacle-wall-dev --detour-after-wall-dev
          python -m adapters.mineflayer.s49_goal_l1_detour_review_dev --root "$DEV_OUTPUT"
      - name: Always archive raw original World sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s49-l1-real-detour-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEV_OUTPUT }}
          retention-days: 7
      - name: Never promote DEV to QUAL or SCIENCE
        if: always()
        run: echo 'DEV_ONLY / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
