name: Unified v0.5 Bug-0 D5 + C1/S10 single S49 owner integration OFFLINE
on:
  push:
    branches:
      - dev/unified-v05-d5-c1-owner-integration-20261107

permissions:
  contents: read

jobs:
  owner-bridge-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Pinned offline dependencies and repository contract
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python tools/check_repository.py
          python -m compileall -q adapters/mineflayer/normal_action.py adapters/mineflayer/s49_c1_motion_owner_dev.py adapters/mineflayer/s49_normal_session_real_ci.py src/relay_self/c1_motion_journal.py src/relay_self/c1_physical_action_fence.py tools/bug0_d5_oneworld.py tests/test_unified_d5_c1_owner_integration.py
          ruff check adapters/mineflayer/normal_action.py adapters/mineflayer/s34_native_world_cognition_ci.py adapters/mineflayer/s49_c1_motion_owner_dev.py adapters/mineflayer/s49_normal_session_real_ci.py adapters/mineflayer/bug0_intent_motion_learning.py src/relay_self/c1_motion_journal.py src/relay_self/c1_physical_action_fence.py tools/bug0_d4_oneworld.py tools/bug0_d5_oneworld.py tools/bug0_d5_post.py tests/test_unified_d5_c1_owner_integration.py tests/test_c1_motion_journal.py tests/test_c1_physical_action_fence.py tests/test_bug0_d5_intent_epoch_rearm.py
      - name: Cross-lane owner identity and negative replay tests
        run: |
          python -m pytest -q \
            tests/test_unified_d5_c1_owner_integration.py \
            tests/test_bug0_d5_intent_epoch_rearm.py \
            tests/test_bug0_d5_world_post.py \
            tests/test_bug0_d4_post.py \
            tests/test_bug0_d4_precombat_native_hunger.py \
            tests/test_bug0_s49_repeat_attack.py \
            tests/test_bug0_s49_attack_owner.py \
            tests/test_bug0_s49_s51_eat_handoff.py \
            tests/test_c1_motion_journal.py \
            tests/test_c1_physical_action_fence.py \
            tests/test_s49_c1_motion_owner_dev.py \
            tests/test_bug0_intent_motion_source_join.py \
            tests/test_bug0_intent_motion_learning.py \
            tests/test_s49_completed_decision_bridge.py \
            tests/test_persistent_cognition.py
      - name: Strict offline-only evidence boundary
        run: |
          python - <<'PY'
          from adapters.mineflayer.normal_action import NormalSessionActionExecutor
          from relay_self.c1_physical_action_fence import OriginalS49PhysicalFence
          assert hasattr(NormalSessionActionExecutor, 'advance_intent_epoch')
          assert hasattr(OriginalS49PhysicalFence, 'require_clear')
          print('DEV_D5_C1_SINGLE_ORIGINAL_S49_OWNER_OFFLINE_PASS')
          print('WORLD_NOT_RUN / NO_PHYSICAL_ACTION / NO_NEW_MODEL_CALL')
          print('ATTACK_AND_EAT_PREISSUE_FENCE_NOT_IMPLEMENTED')
          PY
