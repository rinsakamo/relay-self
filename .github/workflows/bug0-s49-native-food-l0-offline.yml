name: Bug-0 S49 native food L0 loop DEV offline
on:
  push:
    branches:
      - dev/bug0-s49-normal-food-loop-20261104

permissions:
  contents: read

concurrency:
  group: bug0-s49-native-food-l0-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s49-food-l0-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact DEV HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install offline tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
      - name: Repository contract, compile and lint
        run: |
          python tools/check_repository.py
          python -m compileall -q adapters/mineflayer/normal_action.py adapters/mineflayer/s49_normal_session_real_ci.py adapters/mineflayer/s49_food_loop_dev.py tests/test_bug0_s49_food_l0.py
          ruff check adapters/mineflayer/normal_action.py adapters/mineflayer/s49_normal_session_real_ci.py adapters/mineflayer/s49_food_loop_dev.py tests/test_bug0_s49_food_l0.py
      - name: S49 L0, original S49/S51 and nonissuing/physical first-EAT offline regression
        run: |
          python -m pytest -q tests/test_bug0_s49_food_l0.py tests/test_feature_s49_normal_runtime.py tests/test_s49_cleanup.py tests/test_bug0_s49_s51_eat_handoff.py tests/test_bug0_first_eat_dev_world.py tests/test_bug0_first_eat_shadow.py tests/test_feature_s51_eat_execution.py
      - name: No World or physical outcome from offline regression
        run: echo 'DEV_OFFLINE / WORLD_0 / EAT_0 / QUALIFICATION_NO_GO'
