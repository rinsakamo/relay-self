name: R M0.2 V7 one consumed BASE_ON qualification ORIGINAL offline rereview

on:
  push:
    branches:
      - infra/rsee-r6-s9-native-original-readback-20261012
    paths:
      - '.github/workflows/rsee-m02-v7-new-base-qualification-original-replay.yml'

permissions:
  contents: read
  actions: read

jobs:
  immutable-original-independent-rereview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_REPO: rinsakamo/relay-self
      GH_TOKEN: ${{ github.token }}
      S_ONE_SHOT_RUN: '38907469772'
      S_ONE_SHOT_HEAD: '6931d57c1037c47ebd89295bdc3cd4f237f64d09'
      S_ONE_SHOT_ARTIFACT_NAME: 'rsee-m02-new-tick-base-on-qualification-38907469772-1'
      S_ONE_SHOT_ARTIFACT_ID: '12048564191'
      S_ONE_SHOT_ZIP_DIGEST: 'sha256:6dd93e90dea3dfa40a5d7c02ddac82ad5a3485a8476f7ef912db164fb66ea847'
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact consumed S run and immutable original archive metadata
        run: |
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ["GH_REPO"]
          run=os.environ["S_ONE_SHOT_RUN"]
          original=json.loads(subprocess.check_output(
              ["gh","api",f"repos/{repo}/actions/runs/{run}"]))
          assert original["head_sha"]==os.environ["S_ONE_SHOT_HEAD"]
          assert original["run_attempt"]==1 and original["event"]=="push"
          # The physical producer itself exited 0, but the original R
          # audit failed on a too-small 20 MB Paper JAR input cap.
          assert original["status"]=="completed"
          assert original["conclusion"]=="failure"
          artifacts=json.loads(subprocess.check_output(
              ["gh","api",f"repos/{repo}/actions/runs/{run}/artifacts?per_page=100"]))["artifacts"]
          expected=[a for a in artifacts
                    if a["name"]==os.environ["S_ONE_SHOT_ARTIFACT_NAME"]]
          assert len(expected)==1 and str(expected[0]["id"])==os.environ["S_ONE_SHOT_ARTIFACT_ID"]
          assert expected[0]["digest"]==os.environ["S_ONE_SHOT_ZIP_DIGEST"]
          assert not expected[0]["expired"]
          print("R_BASE_ON_ONE_SHOT_ORIGINAL_ARCHIVE_AND_SOURCE_RUN_PINNED")
          PY
      - name: Reopen original consumed-run archive without starting a new World
        run: |
          mkdir -p "$RUNNER_TEMP/r-replay-originals"
          gh run download "$S_ONE_SHOT_RUN" -R "$GH_REPO" \
            -n "$S_ONE_SHOT_ARTIFACT_NAME" \
            -D "$RUNNER_TEMP/r-replay-originals"
          find "$RUNNER_TEMP/r-replay-originals" -maxdepth 3 -type f -printf '%P %s bytes\n' | sort
      - name: Inspect bounded S50 versus S51 native original command authorities
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=(pathlib.Path(os.environ["RUNNER_TEMP"])/"r-replay-originals"
             /"originals/owner_commands.jsonl")
          assert p.is_file() and p.stat().st_size<2_000_000
          rows=[json.loads(s) for s in p.read_text().splitlines()]
          assert len(rows)<=100
          print("R_QUAL_ORIGINAL_COMMAND_AUTHORITY_DIAGNOSTIC="+json.dumps([
              {"seq":i,"type":x.get("type"),"action_id":x.get("action_id"),
               "effect":x.get("effect"),"control":x.get("control"),
               "request_id":x.get("request_id")}
              for i,x in enumerate(rows)],sort_keys=True))
          PY
      - name: R independent original-byte qualification, no producer rerun
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/r-replay-review"
          python -m experiments.standard_env.m02_v7_tick_qualification_audit \
            --original-root "$RUNNER_TEMP/r-replay-originals/originals" \
            --asset-root "$RUNNER_TEMP/r-replay-originals/assets" \
            --witness "$RUNNER_TEMP/r-replay-originals/independent-host-witness.json" \
            --workflow-run-id "$S_ONE_SHOT_RUN" \
            | tee "$RUNNER_TEMP/r-replay-review/r-independent-rereview.json"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"r-replay-review"
          v=json.loads((root/"r-independent-rereview.json").read_text())
          assert v["classification"]=="R_M02_V7_NEW_BASE_ON_TICK_CHORD_ENGINEERING_QUALIFIED_ONLY"
          assert v["github_run_id"]==os.environ["S_ONE_SHOT_RUN"]
          assert v["grant_consumed"] and v["candidate_engineering_qualified"]
          assert v["java_launches"]==v["node_sessions"]==1
          assert v["independent_host_pid_port_witness"]
          assert not v["all_other_profiles_qualified"]
          assert not v["continuous_subtick_path_qualified"]
          assert v["science_trials"]==0
          assert not v["science_go"] and not v["production_go"]
          print("R_ORIGINAL_ONLY_NEW_BASE_ON_ENGINEERING_QUALIFIED_NOT_SCIENCE")
          PY
      - name: Retain original immutable qualification evidence and this R verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsee-m02-v7-base-one-shot-offline-rereview-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r-replay-originals/
            ${{ runner.temp }}/r-replay-review/
          retention-days: 90
          if-no-files-found: warn
