name: S49 L1 motor expectation real heldout one-shot DEV World

on:
  push:
    branches:
      - integration/s49-slm-passive-dev-20261031
    paths:
      - docs/s49-slm-motor-expectation-one-shot-trigger-20261031.md

permissions:
  contents: read
  actions: read

jobs:
  one-disposable-world:
    if: "github.event.head_commit.message == 'dev-world approved S49 motor expectation heldout one-shot'"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      S49_REAL_SERVER_CI: '1'
      NODE_OPTIONS: ''
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
      PRIOR_SHA: 7f5d69f72a2cbfde7751960eaef4a06c9434b2ec94fa57e50b6ce63604bd5e8c
    steps:
      - name: Checkout exact single-issuer S49 and L8/M integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
      - name: Offline source/model/S49 no-authority regressions
        run: |
          python -m pytest -q tests/test_s49_slm_motor_expectation_dev.py tests/test_s49_slm_prior_world_dev.py tests/test_s49_slm_passive_dev.py tests/test_s49_slm_empty_memory_shadow.py
          ruff check adapters/mineflayer/slm_motor_expectation_dev.py adapters/mineflayer/slm_prior_world_dev.py adapters/mineflayer/slm_passive_dev.py adapters/mineflayer/slm_passive_dev_run.py tests/test_s49_slm_motor_expectation_dev.py
          python tools/check_repository.py
      - name: Download earlier real World original bytes, not its model prediction
        uses: actions/download-artifact@v4
        with:
          run-id: 41174086368
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: s49-slm-prior-source-withheld-two-world-dev
          path: dev-evidence/previous
      - name: Freeze prior-W3 motor expectation before Java/Node or any current Action
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from adapters.mineflayer.slm_motor_expectation_dev import (
              read_previous_motor_history, score_motor_expectation,
          )
          root = (Path.cwd() / "dev-evidence/previous/world-one").resolve()
          h = read_previous_motor_history(
              root, expected_stdout_sha256=os.environ["PRIOR_SHA"],
          )
          assert h.source_session_id == "eb66128b-a3d2-4bc2-889f-429f0a7c93de"
          p = score_motor_expectation(
              h, current_session_id="preworld-prediction-only", current_actions=[],
          )
          assert p["holdout_observations"] == 0
          assert p["model_expected_m"] != p["cheap_expected_m"]
          assert p["action_authority"] is p["policy_changed"] is False
          Path("dev-evidence/preworld-model.json").write_text(
              json.dumps(p, indent=2, sort_keys=True))
          print("PREWORLD_SOURCE_ONLY_MOTOR_PREDICTION_FROZEN")
          PY
      - name: Existing Mineflayer Java/Node preflight
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if(require('./adapters/mineflayer/node_modules/mineflayer/package.json').version !== '4.39.0') process.exit(2)"
          java -version
      - name: Exactly one disposable real Mojang S49 World, no Action override
        shell: bash
        run: |
          set -euo pipefail
          python -B -m adapters.mineflayer.slm_passive_dev_run \
            --confirm S49-SLM-ONE-DISPOSABLE-DEV-WORLD \
            --l8-empty-memory-shadow \
            --l1-motor-expectation-shadow \
            --previous-world-root "$GITHUB_WORKSPACE/dev-evidence/previous/world-one" \
            --previous-w3-sha256 "$PRIOR_SHA" \
            --output-dir "$GITHUB_WORKSPACE/dev-evidence/world-one" \
            2>&1 | tee dev-evidence/host.log
      - name: Score real unseen Action outcomes against frozen prior mean and cheap last
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          root = Path("dev-evidence")
          report = json.loads((root / "world-one/report.json").read_text())
          pre = json.loads((root / "preworld-model.json").read_text())
          assert report["status"] == "PASS"
          assert report["session_id"] != pre["past_session"]
          assert [x["selected"] for x in report["decisions"]] == [
              "WAIT", "MOVE_AWAY", "MOVE_AWAY",
          ]
          original = report["actual_native_actions"]
          assert len(original) == 2
          assert all(x["terminal"] == "outcome" for x in original)
          slm = report["slm_dev"]
          assert slm["classification"] == "DEV_ONLY"
          assert slm["one_l8_memory_owner"] is True
          assert slm["observer_errors"] == 0
          assert slm["l8_training_admissions"] == 0
          assert slm["l8_retention_enabled"] is True
          assert len(slm["rows"]) == 3
          assert all(
              x["status"] == "RECORDED"
              and x["l1_status"] == "no_admissible_l1_proposal"
              and x["l1_candidate"] is None
              and x["learning_updates"] == x["action_issues"] == 0
              for x in slm["rows"]
          )
          motor = slm["l1_motor_expectation"]
          assert motor["status"] == "HELDOUT_SCORED"
          assert motor["past_session"] == pre["past_session"]
          assert motor["current_session"] == report["session_id"]
          assert motor["training_observations"] == 2
          assert motor["holdout_observations"] == 2
          assert math.isclose(motor["model_expected_m"], pre["model_expected_m"],
                              rel_tol=0, abs_tol=1e-10)
          assert math.isclose(motor["cheap_expected_m"], pre["cheap_expected_m"],
                              rel_tol=0, abs_tol=1e-10)
          assert motor["beats_cheap_control"] == (
              motor["model_mae_m"] < motor["cheap_mae_m"]
          )
          assert motor["source_independently_attested"] is False
          assert motor["action_authority"] is motor["policy_changed"] is False
          assert motor["real_goal_training_labels"] == motor["l8_learning_updates"] == 0
          assert motor["s10_updates"] == 0
          assert report["learning_in_world"] is False
          assert report["real_model_calls"] == slm["model_calls"] == 0
          assert report["node_exit"] == report["server_exit"] == 0
          assert report["w3_node_stdout_capture"]["status"] == "COMPLETE_NODE_STDOUT"
          verdict = {
              "classification": "DEV_REAL_SELF_SUPERVISED_MOTOR_FORECAST_SCORED",
              "real_s49_actions": 2,
              "original_s49_outcomes": 2,
              "mean_prior_m": motor["model_expected_m"],
              "cheap_last_m": motor["cheap_expected_m"],
              "model_mae_m": motor["model_mae_m"],
              "cheap_last_mae_m": motor["cheap_mae_m"],
              "beats_cheap_control": motor["beats_cheap_control"],
              "motor_prediction_is_action_policy": False,
              "independently_goal_qualified": False,
              "qualification_no_go": True,
              "science_not_run": True,
          }
          (root / "verification.json").write_text(json.dumps(
              verdict, indent=2, sort_keys=True))
          print("S49_SELF_SUPERVISED_MOTOR_HOLDOUT_DEV_PASS", json.dumps(verdict))
          PY
      - name: Preserve past originals, frozen forecast and new real World evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s49-slm-motor-forecast-real-heldout-evidence
          path: dev-evidence/
          if-no-files-found: warn
          retention-days: 30
