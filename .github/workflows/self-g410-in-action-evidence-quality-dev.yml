name: S49 G4.10 In-Action Evidence Quality LIGHT DEV
on:
  push:
    branches:
      - self/dev-g410-in-action-evidence-quality-20261030
    paths:
      - .github/workflows/self-g410-in-action-evidence-quality-dev.yml
      - adapters/mineflayer/g410_in_action_evidence_quality_dev.py
      - adapters/mineflayer/s49_goal_loop_real_dev.py
      - tests/test_s49_g410_in_action_evidence_quality_dev.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g410-read-only-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: G4.10 strict read-only source tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install 'pytest==9.1.1' 'ruff==0.17.0'
          ruff check adapters/mineflayer/g410_in_action_evidence_quality_dev.py tests/test_s49_g410_in_action_evidence_quality_dev.py adapters/mineflayer/s49_goal_loop_real_dev.py
          python -m compileall -q adapters/mineflayer/g410_in_action_evidence_quality_dev.py adapters/mineflayer/s49_goal_loop_real_dev.py tests/test_s49_g410_in_action_evidence_quality_dev.py
          python -m pytest -q tests/test_s49_g410_in_action_evidence_quality_dev.py tests/test_s49_g49_original_action_gap_census_dev.py
      - name: Honest classification
        if: always()
        run: echo 'DEV_ONLY / G410_OFFLINE_SOURCE_QUALITY_MATRIX / PHYSICAL_WORLD_NOT_RUN / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
