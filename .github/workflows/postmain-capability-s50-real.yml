name: Post-MAIN S50 genuine supervised SEEK step
on:
  push:
    branches:
      - self/postmain-feature-s50-seek-execution-20261009
  pull_request:
    branches:
      - self/postmain-feature-s49-normal-runtime-20261009
permissions:
  contents: read
jobs:
  s50-real-seek:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      S50_REAL_SERVER_CI: '1'
      NODE_OPTIONS: ''
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Genuine Mineflayer package
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if(require('./adapters/mineflayer/node_modules/mineflayer/package.json').version !== '4.39.0') process.exit(2)"
      - name: Exact issued SEEK native forward step and measured progress
        run: |
          mkdir -p s50-artifacts
          python -B -m adapters.mineflayer.s50_seek_real_ci --report s50-artifacts/report.json --server-log s50-artifacts/minecraft.log
      - name: Preserve physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s50-real-supervised-seek
          path: s50-artifacts/
          if-no-files-found: warn
          retention-days: 30
