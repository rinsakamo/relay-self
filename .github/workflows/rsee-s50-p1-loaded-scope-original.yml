# One read-only replay of S source 38976662458; never launch Paper/Node or qualify P1 WAIT.
name: R P1 loaded-chunk WAIT source independent replay (offline)
on:
  push:
    branches: [infra/rsee-r6-s9-native-original-readback-20261012]
    paths: ['.github/workflows/rsee-s50-p1-loaded-scope-original.yml']
permissions:
  contents: read
  actions: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: rinsakamo/relay-self
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: R-owned negative controls after JAR-default resolution, before originals
        run: |
          python -m pip install --disable-pip-version-check 'pytest==9.1.1'
          python -m pytest -q tests/test_rsee_s50_p1_wait_original_audit.py tests/test_rsee_s50_p1_scope_original_audit.py
      - name: Pin past S source and download its one immutable DEV archive
        run: |
          set -euo pipefail
          gh api "/repos/$GH_REPO/actions/runs/38976662458" --jq '.head_sha' | grep -Fx '3f9e79bfb00f171672c661b024b27a0c18729154'
          gh api "/repos/$GH_REPO/actions/runs/38976662458" --jq '.run_attempt' | grep -Fx '1'
          gh api "/repos/$GH_REPO/actions/runs/38976662458" --jq '.conclusion' | grep -Fx 'success'
          gh api "/repos/$GH_REPO/actions/artifacts/12079520551" --jq '.name' | grep -Fx 's-p1-postaction-wait-dev-61021-38976662458'
          mkdir -p "$RUNNER_TEMP/r-s50-scope"
          gh run download 38976662458 -R "$GH_REPO" \
            -n s-p1-postaction-wait-dev-61021-38976662458 \
            -D "$RUNNER_TEMP/r-s50-scope"
      - name: Independent original movement, Action, census and event source review
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          from experiments.standard_env.s50_p1_scope_original_audit import review, JAR, CLASS
          root = Path(os.environ['RUNNER_TEMP'])/'r-s50-scope'
          reports = list(root.rglob('m02_report.json'))
          jars = list(root.rglob('relay-metabolism-paper-dev.jar'))
          assert len(reports)==1 and len(jars)==1
          target = reports[0].parent
          assert jars[0].is_file() and not jars[0].is_symlink()
          assert hashlib.sha256(jars[0].read_bytes()).hexdigest() == JAR
          if jars[0].parent != target:
              assert not (target/'relay-metabolism-paper-dev.jar').exists()
              shutil.copyfile(jars[0], target/'relay-metabolism-paper-dev.jar')
          receipt = review(target)
          assert receipt['classification'] == CLASS
          assert receipt['independently_checked_scope_rows'] == 8
          assert receipt['observed_stationary_samples'] == 8
          assert len(receipt['other_loaded_entities_seen_ticks']) == 8
          assert receipt['other_online_players_seen_ticks'] == []
          assert receipt['p1_wait_ticks_admitted'] == 0
          assert receipt['p1_fatigue_recovered'] == 0.0
          assert receipt['true_full_tick_wait_proven'] is False
          assert receipt['global_solo_proven'] is False
          assert receipt['science_go'] is False
          output = Path(os.environ['RUNNER_TEMP'])/'r-p1-loaded-scope-verdict.json'
          output.write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          print('R_P1_LOADED_CHUNK_SAMPLE_AND_ACTIVITY_COUNTERS_REVIEW_ONLY')
          PY
      - name: Preserve independent R receipt, not a new source original
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-p1-loaded-scope-source-only-${{ github.run_id }}
          path: ${{ runner.temp }}/r-p1-loaded-scope-verdict.json
          retention-days: 90
          if-no-files-found: warn
