name: Unified v0.5 D5 original ATTACK EAT durable preISSUE one World DEV
on:
  push:
    branches:
      - dev/unified-v05-s49-attack-eat-preissue-fence-20261107

permissions:
  contents: read

jobs:
  one-world:
    # A separate one-use trigger commit, never on normal source pushes.
    if: ${{ github.event.head_commit.message == 'run-unified-d5-nonmotion-fence-oneworld-once-20261107' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S49_REAL_SERVER_CI: '1'
      BUG0_S49_D4_ONE_WORLD_ONLY: '1'
      BUG0_S49_NONMOTION_FENCE_DEV_ONLY: '1'
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      NODE_OPTIONS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Strict one-time trigger and independent preworld negatives
        run: |
          test "$(git show --format= --name-only HEAD | sed '/^$/d')" = "docs/unified-d5-nonmotion-fence-trigger-20261107.md"
          test "$(git show --format=%s -s HEAD)" = "run-unified-d5-nonmotion-fence-oneworld-once-20261107"
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python - <<'PY'
          from pathlib import Path
          import subprocess
          doc=Path('docs/unified-d5-nonmotion-fence-trigger-20261107.md').read_text()
          source=[line.split(': ',1)[1] for line in doc.splitlines()
                  if line.startswith('source_head: ')]
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert len(source)==1 and source[0]==parent and len(parent)==40
          print('EXACT_PREVIOUS_OFFLINE_SOURCE_SHA_MATCH',parent)
          PY
          python tools/check_repository.py
          ruff check src/relay_self/s49_nonmotion_physical_fence.py adapters/mineflayer/normal_action.py adapters/mineflayer/eat_execution.py tests/test_s49_nonmotion_physical_fence.py tools/bug0_d4_oneworld.py tools/bug0_d4_natural_loot_eat.py tools/bug0_d4_post.py tools/bug0_d5_oneworld.py tools/bug0_d5_post.py tests/test_bug0_d4_post.py tests/test_bug0_d5_world_post.py tests/test_bug0_d5_intent_epoch_rearm.py
          python -m pytest -q tests/test_s49_nonmotion_physical_fence.py tests/test_bug0_d5_world_post.py tests/test_bug0_d5_intent_epoch_rearm.py tests/test_bug0_d4_post.py tests/test_bug0_d4_precombat_native_hunger.py tests/test_bug0_s49_combat_d3_post.py tests/test_bug0_s49_repeat_attack.py tests/test_bug0_s49_attack_owner.py tests/test_bug0_s49_s51_eat_handoff.py
          python - <<'PY'
          import socket
          with socket.socket(socket.AF_INET,socket.SOCK_STREAM) as sock:
              assert sock.connect_ex(('127.0.0.1',25565)) != 0
          PY
      - name: Download pinned official Paper 1.21.8 stable #60
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.parse,urllib.request
          url='https://fill.papermc.io/v3/projects/paper/versions/1.21.8/builds'
          req=urllib.request.Request(url,headers={'User-Agent':'RelaySelf-Bug0-R1/1.0 (https://github.com/rinsakamo/relay-self)'})
          with urllib.request.urlopen(req,timeout=50) as stream:
              builds=json.loads(stream.read(3000000))
          rows=[b for b in builds if b.get('channel')=='STABLE' and b.get('id')==60]
          assert len(rows)==1
          p=rows[0]['downloads']['server:default']
          assert p['name']=='paper-1.21.8-60.jar' and p['size']==52811717
          assert p['checksums']['sha256']=='8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e'
          uri=urllib.parse.urlparse(p['url'])
          assert uri.scheme=='https' and uri.hostname=='fill-data.papermc.io' and uri.path.startswith('/v1/objects/')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'paper-1.21.8.jar'
          digest=hashlib.sha256()
          with urllib.request.urlopen(urllib.request.Request(p['url'],headers={'User-Agent':'RelaySelf-Bug0-R1/1.0'}),timeout=120) as s, target.open('xb') as out:
              n=0
              while chunk:=s.read(1024*1024):
                  n+=len(chunk)
                  assert n<=52811717
                  digest.update(chunk)
                  out.write(chunk)
          assert n==52811717 and digest.hexdigest()==p['checksums']['sha256']
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('BUG0_D4_PAPER_JAR='+str(target)+'\n')
          print('PINNED_PAPER_1_21_8_R1')
          PY
      - name: Build pinned Paper respawn and independent natural-drop witness
        run: |
          mvn -B -ntp -f adapters/mineflayer/zombie_respawn_dev/pom.xml -DskipTests package
          mvn -B -ntp -f adapters/mineflayer/zombie_drop_witness_dev/pom.xml -DskipTests package
          python - <<'PY'
          import hashlib,os,pathlib
          targets=(
              ('BUG0_D4_RESPAWN','adapters/mineflayer/zombie_respawn_dev/target/relay-zombie-respawn-dev-0.1.0-dev.jar'),
              ('BUG0_D4_WITNESS','adapters/mineflayer/zombie_drop_witness_dev/target/relay-zombie-drop-witness-dev-0.1.0-dev.jar'),
          )
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              for var,rel in targets:
                  jar=pathlib.Path(rel).resolve()
                  assert jar.is_file() and not jar.is_symlink()
                  digest=hashlib.sha256(jar.read_bytes()).hexdigest()
                  f.write(var+'_JAR='+str(jar)+'\n')
                  f.write(var+'_SHA256='+digest+'\n')
                  print(var+'_SHA256='+digest)
          PY
      - name: Install pinned Mineflayer 4.39
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if (require('./adapters/mineflayer/node_modules/mineflayer/package.json').version!=='4.39.0') process.exit(2)"
      - name: D4 first real kill/conditional pickup/EAT -> World 600tick -> D5 second Intent ATTACK
        run: |
          mkdir -p unified-d5-nonmotion-fence-evidence
          python -B tools/bug0_d5_oneworld.py \
            --report unified-d5-nonmotion-fence-evidence/report.json \
            --server-log unified-d5-nonmotion-fence-evidence/paper_original.log \
            --nonmotion-fence-dev
      - name: Post-World independent D4 original + D5 same S49 second Action audit
        run: |
          python -B tools/bug0_d5_post.py \
            --report unified-d5-nonmotion-fence-evidence/report.json \
            --server-log unified-d5-nonmotion-fence-evidence/paper_original.log \
            --out unified-d5-nonmotion-fence-evidence/operator_post_audit.json
      - name: Independent original S49 ATTACK EAT durable physical fence readback
        run: |
          python -B - <<'PY'
          import json
          from pathlib import Path
          from relay_self.s49_nonmotion_physical_fence import OriginalS49NonmotionFence
          root=Path('unified-d5-nonmotion-fence-evidence')
          report=json.loads((root/'report.json').read_text())
          assert report['status']=='PASS_DEV'
          fence=OriginalS49NonmotionFence.restore(
              root/'s49_nonmotion_physical_fence.json',
              self_id='s49-original-self',
          )
          fence.require_clear()
          expected=[a['action_id'] for a in report['s49_actions']]
          if report['d4_self_eat_issued']:
              expected.append(report['d4_eat_action_id'])
          expected.append(report['d5_second_action']['action_id'])
          assert [r['action_id'] for r in fence.actions]==expected
          assert all(r['status']=='S16_OUTCOME' for r in fence.actions)
          assert report['nonmotion_fence']['sha256']==fence.sha256
          assert report['nonmotion_fence']['action_ids']==expected
          assert len(fence.actions)==report['d5_owner_total_action_count']
          for logged,row in zip(report['s49_actions'],fence.actions):
              assert row['action_kind']=='ATTACK'
              assert row['decision_seq']==logged['admitted_seq']
              assert row['effect_seq']==logged['effect_seq']
              assert row['after_seq']==logged['after_seq']
              assert row['attack_effect_only'] is True
          if report['d4_self_eat_issued']:
              row=fence.actions[-2]
              eat=report['d4_eat_outcome']
              assert row['action_kind']=='EAT'
              assert row['food_item']=='rotten_flesh'
              assert row['food_before']==eat['food_before']
              assert row['food_after']==eat['food_after']
              assert row['count_before']==eat['count_before']
              assert row['count_after']==eat['count_after']
              assert row['after_seq']==eat['after_probe_seq']
              assert row['effect_seq']<row['consume_seq']<row['after_seq']
          else:
              assert report['real_rotten_flesh_count']==0
              assert all(r['action_kind']=='ATTACK' for r in fence.actions)
          final=fence.actions[-1]
          d5=report['d5_second_action']
          assert final['action_kind']=='ATTACK'
          assert final['action_id']==d5['action_id']
          assert final['decision_seq']==d5['admitted_seq']
          assert final['effect_seq']==d5['effect_seq']
          assert final['after_seq']==d5['after_seq']
          assert final['attack_effect_only'] is True
          out={'status':'DEV_ORIGINAL_S49_NONMOTION_FENCE_RESTORED_PASS',
               'actions':len(fence.actions),'sha256':fence.sha256,
               'original_ids':expected,'physical_exactly_once_attested':False,
               'attack_effect_ack_proves_death':False,
               'world_runs_in_post_audit':0}
          (root/'nonmotion_fence_independent_readback.json').write_text(
              json.dumps(out,sort_keys=True,indent=2)+'\n')
          print('DEV_ORIGINAL_S49_NONMOTION_FENCE_RESTORED_PASS',len(fence.actions))
          PY
      - name: Preserve originals and SHA256
        if: always()
        run: |
          if test -d unified-d5-nonmotion-fence-evidence; then
            (cd unified-d5-nonmotion-fence-evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          fi
      - name: Store exact one-World DEV original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-d5-nonmotion-fence-oneworld
          path: unified-d5-nonmotion-fence-evidence/
          if-no-files-found: warn
          retention-days: 30
