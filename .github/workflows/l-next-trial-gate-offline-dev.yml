name: L fresh next World capture and PID origin gate offline DEV
on:
  push:
    branches: [dev/l-new-trial-capture-process-gate-20261102]
  pull_request:
    paths:
      - 'tools/l_mp11_next_trial_gate.py'
      - 'tests/test_l_mp11_next_trial_gate.py'
      - '.github/workflows/l-next-trial-gate-offline-dev.yml'
permissions:
  contents: read
jobs:
  capture-and-owned-java-process:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      PYTHONPATH: src:tests:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact offline testing versions
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
      - name: Validate new-World preparation and original regressions
        run: |
          set -euo pipefail
          ruff check tools/l_mp11_next_trial_gate.py tests/test_l_mp11_next_trial_gate.py
          python -m compileall -q tools/l_mp11_next_trial_gate.py tests/test_l_mp11_next_trial_gate.py
          python -m pytest -o addopts='' -q \
            tests/test_l_mp11_next_trial_gate.py \
            tests/test_l_mp11_gemma_wire_contract.py \
            tests/test_l_mp11_evidence_id_selection.py \
            tests/test_l_mp11_feedback_original_audit.py \
            tests/test_l_mp11_live_l2_shadow.py \
            tests/test_l_mp11_eof_and_typed_feedback.py \
            tests/test_mp11_g2_s49_original_audit.py \
            tests/test_self_body_s50_l2_mp11_paper_audit.py \
            tests/test_feature_s49_normal_runtime.py
          python tools/check_repository.py
      - name: No real World, model or new grant issued
        run: echo 'NEXT_WORLD_PREPARE_AND_PID_SOURCE_OFFLINE_ONLY / NEW_WORLD_0 / NEW_GEMMA_0 / OLD_FAIL_UNCHANGED / QUALIFICATION_NO_GO'
