name: S49 original host fourth epoch DEV focused
on:
  push:
    branches:
      - self/dev-s49-native-next-epoch-20261025
    paths:
      - .github/workflows/self-s49-next-epoch-focused-dev.yml
      - adapters/mineflayer/s49_normal_session_real_ci.py
      - adapters/mineflayer/s49_paper_world_first_dev.py
      - tests/test_s49_original_next_epoch_dev.py

permissions:
  contents: read

concurrency:
  group: s49-original-next-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python312:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Pin isolated DEV candidate and preserved Action/P1 original blobs
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse 'HEAD:adapters/mineflayer/normal_action.py')" = '0ded8fa296c92076a643de08cd6fc360061e1d08'
          test "$(git rev-parse 'HEAD:experiments/fatigue_p1.py')" = 'bd4f35a4079da0770ef11cdec921dbba31de9b81'
          echo 'Original S49 qualify() source is a modified DEV candidate; NO original-blob equivalence asserted.'
          echo 'Original main, S18, grants and R/V results are unchanged.'
      - name: Install Python 3.12 focused tools
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
      - name: Syntax
        run: python -m compileall -q adapters/mineflayer src/relay_self tests
      - name: Scoped Ruff
        run: ruff check adapters/mineflayer/s49_normal_session_real_ci.py adapters/mineflayer/s49_paper_world_first_dev.py tests/test_s49_original_next_epoch_dev.py
      - name: DEV original-host focused and negative tests
        run: python -m pytest -q tests/test_s49_original_next_epoch_dev.py tests/test_s49_paper_world_first_dev.py tests/test_s49_p1_postwait_native_dev.py
