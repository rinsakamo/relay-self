name: S49 Forward Sprint Positive DASH Real World DEV
on:
  push:
    branches:
      - self/dev-s49-forward-motor-admission-20261026
    paths:
      - .github/workflows/self-s49-forward-dash-world-dev.yml
      - 'adapters/mineflayer/s49_paper_dash_dev/**'
      - adapters/mineflayer/s49_paper_forward_dash_dev.py
      - tests/test_s49_paper_forward_dash_dev.py

permissions:
  contents: read

concurrency:
  group: s49-forward-dash-positive-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  world-first-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      S49_REAL_SERVER_CI: '1'
      S49_FORWARD_MOTOR_DEV_ONLY: '1'
      S49_SPRINT_MOTOR_DEV_ONLY: '1'
      DEV_OUTPUT: '/tmp/s49-paper-forward-dash-${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify DEV observer config, dependencies and loopback isolation
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -q '^enabled: false$' adapters/mineflayer/s49_paper_wait_observer_dev/src/main/resources/config.yml
          python - <<'PY'
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
              s.bind(("127.0.0.1", 25565))
          print("Fresh loopback Minecraft port available; no external process touched")
          PY
      - name: Python 3.12 focused and Ruff BEFORE any World
        run: |
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          python -m compileall -q adapters/mineflayer/s49_paper_forward_dash_dev.py tests/test_s49_paper_forward_dash_dev.py
          ruff check adapters/mineflayer/s49_paper_forward_dash_dev.py tests/test_s49_paper_forward_dash_dev.py
          python -m pytest -q tests/test_s49_paper_forward_dash_dev.py tests/test_s49_forward_motor_admission_dev.py
      - name: Compile independent Paper DASH modifier plugin
        run: |
          mvn -B -ntp -f adapters/mineflayer/s49_paper_dash_dev/pom.xml -DskipTests package
          test -f adapters/mineflayer/s49_paper_dash_dev/target/relay-s49-dash-dev-0.1.0-dev.jar
      - name: Install original Mineflayer package (unmodified bridge)
        run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - name: Fetch official stable Paper 1.21.8 build 60 and verify published SHA256
        id: paper
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          version = "1.21.8"
          api = f"https://fill.papermc.io/v3/projects/paper/versions/{version}/builds"
          ua = "RelaySelf-S49-P1-WORLD-FIRST-DEV/0.1 (https://github.com/rinsakamo/relay-self)"
          req = urllib.request.Request(api, headers={"User-Agent": ua})
          with urllib.request.urlopen(req, timeout=50) as rsp:
              builds = json.loads(rsp.read(3_000_000))
          stable = [b for b in builds if b.get("channel") == "STABLE" and b.get("id") == 60]
          if len(stable) != 1:
              raise RuntimeError("Pinned Paper 1.21.8 stable build 60 unavailable")
          artifact = stable[0]["downloads"]["server:default"]
          expected = "8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e"
          if (artifact["checksums"]["sha256"] != expected
                  or artifact["size"] != 52811717):
              raise RuntimeError("Pinned original Paper build metadata mismatch")
          url = artifact["url"]
          parsed = urllib.parse.urlparse(url)
          if (parsed.scheme != "https" or parsed.hostname != "fill-data.papermc.io"
                  or not parsed.path.startswith("/v1/objects/")):
              raise RuntimeError("Untrusted Paper binary URL")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "paper-1.21.8-dev.jar"
          hash_ = hashlib.sha256()
          total = 0
          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua}), timeout=120) as src, target.open("xb") as dst:
              while chunk := src.read(1048576):
                  total += len(chunk)
                  if total > 52811717: raise RuntimeError("Paper size exceeded")
                  dst.write(chunk)
                  hash_.update(chunk)
          if total != 52811717 or hash_.hexdigest() != expected:
              raise RuntimeError("Paper downloaded bytes mismatch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"jar={target}\nsha256={expected}\n")
          print("PAPER_DEV_PINNED", total, expected)
          PY
      - name: One real Paper World — original S49 issued FORWARD + SPRINT
        env:
          PAPER_JAR: ${{ steps.paper.outputs.jar }}
          PAPER_SHA: ${{ steps.paper.outputs.sha256 }}
        run: |
          set -euo pipefail
          DASH="$PWD/adapters/mineflayer/s49_paper_dash_dev/target/relay-s49-dash-dev-0.1.0-dev.jar"
          DASH_SHA="$(sha256sum "$DASH" | cut -d' ' -f1)"
          python -m adapters.mineflayer.s49_paper_forward_dash_dev \
            --output-dir "$DEV_OUTPUT" \
            --paper-jar "$PAPER_JAR" --paper-sha256 "$PAPER_SHA" \
            --dash-jar "$DASH" --dash-sha256 "$DASH_SHA" \
            --confirm S49-P1-DEV-DISPOSABLE-PAPER-WORLD
      - name: Verify original forward+sprint S16 and Paper positive modifier ticks
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from adapters.mineflayer.self_action_evidence import verify_native_action_evidence
          root=Path(os.environ["DEV_OUTPUT"])
          report=json.loads((root/"paper_forward_dash_dev_report.json").read_text())
          source=json.loads((root/"original_s49_report.json").read_text())
          assert report["status"] in ("DEV_FORWARD_SPRINT_POSITIVE_PAPER_DASH_OBSERVED", "DEV_FORWARD_SPRINT_MOTION_GATED_PAPER_DASH_OBSERVED"), report
          assert source["status"] == "PASS" and source["node_exit"] == 0 and source["server_exit"] == 0
          assert source["dev_sprint_motor"] is True
          assert len(source["actual_native_actions"]) == 2
          for a in source["actual_native_actions"]:
              e=a["execution_evidence"]
              assert a["terminal"] == "outcome" and a["movement_m"] > 0.05
              assert e["action_ref"] == "MOVE_FORWARD_SPRINT_DEV"
              verify_native_action_evidence(
                  e, action_id=a["action"], session_id=source["session_id"],
                  movement_m=a["movement_m"],
                  allow_dev_forward=True, allow_dev_sprint=True,
              )
          p=report["paper"]
          assert p["paper_forward_boost_ticks"] >= 1
          assert p["paper_forward_boost_ticks"] >= p["paper_motion_inferred_boost_ticks"]
          assert p["paper_modifier_removed"] is True
          assert p["m0_posted"] is False and p["p1_native_updated"] is False
          assert p["qualification_go"] is False and p["science_go"] is False
          print("S49_ORIGINAL_FORWARD_SPRINT_PAPER_DASH_DEV_PASS",p)
          PY
      - name: Print bounded Paper DEV plugin log for failure diagnosis
        if: failure()
        run: |
          if test -f "$DEV_OUTPUT/paper_server.log"; then
            grep -E 'S49_DASH_DEV|RelayS49DashDev|S49 FAIL|SEVERE' "$DEV_OUTPUT/paper_server.log" | tail -n 70 || true
          fi
      - name: Preserve native S49/Paper/Node and three-clock review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s49-forward-dash-positive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEV_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 7
      - name: DEV epistemic boundary
        if: always()
        run: |
          echo 'DEV_ONLY / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
          echo 'Paper boost may use server-facing motion inference, NOT authenticated Input forward packet; no hard directional cap or settled speed qualified.'
