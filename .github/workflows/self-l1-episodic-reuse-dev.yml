name: S49 L1 Cross-World Episodic Detour Reuse DEV
on:
  push:
    branches:
      - self/dev-l1-episodic-detour-reuse-20261028
    paths:
      - .github/workflows/self-l1-episodic-reuse-dev.yml
      - src/relay_self/goal_experience_dev.py
      - adapters/mineflayer/s49_l1_experience_export_dev.py
      - adapters/mineflayer/s49_l1_experience_transfer_review_dev.py
      - adapters/mineflayer/s49_goal_loop_real_dev.py
      - tests/test_s49_l1_episodic_reuse_dev.py

permissions:
  contents: read

concurrency:
  group: s49-episodic-reuse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  episodic-real-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      S49_REAL_SERVER_CI: '1'
      S49_FORWARD_MOTOR_DEV_ONLY: '1'
      S49_L0_GOAL_LOOP_DEV_ONLY: '1'
      S49_L0_TURN_DEV_ONLY: '1'
      S49_L0_WALL_DEV_ONLY: '1'
      S49_L1_WAYPOINT_DEV_ONLY: '1'
      S49_L1_EPISODIC_REUSE_DEV_ONLY: '1'
      DEV_OUTPUT: '/tmp/s49-l1-cross-world-${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Focused Py3.12, Ruff, bridge Node22
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          python -m compileall -q src/relay_self/goal_experience_dev.py adapters/mineflayer/s49_l1_experience_export_dev.py adapters/mineflayer/s49_l1_experience_transfer_review_dev.py adapters/mineflayer/s49_goal_loop_real_dev.py tests/test_s49_l1_episodic_reuse_dev.py
          ruff check src/relay_self/goal_experience_dev.py adapters/mineflayer/s49_l1_experience_export_dev.py adapters/mineflayer/s49_l1_experience_transfer_review_dev.py adapters/mineflayer/s49_goal_loop_real_dev.py tests/test_s49_l1_episodic_reuse_dev.py
          python -m pytest -q tests/test_s49_l1_episodic_reuse_dev.py tests/test_s49_goal_l1_detour_dev.py tests/test_s49_goal_navigation_dev.py
          node --check adapters/mineflayer/bridge.mjs
      - name: Original Mineflayer install
        run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - name: Three original Minecraft Worlds, source digest memory, fresh transfer
        run: |
          set -euo pipefail
          mkdir -m 700 "$DEV_OUTPUT"
          python -m adapters.mineflayer.s49_goal_loop_real_dev \
            --output-dir "$DEV_OUTPUT/WALL_STOP" \
            --confirm S49-GOAL-L0-DEV-DISPOSABLE-WORLD \
            --offset-m 4.0 --obstacle-wall-dev
          python -m adapters.mineflayer.s49_goal_loop_real_dev \
            --output-dir "$DEV_OUTPUT/DETOUR" \
            --confirm S49-GOAL-L0-DEV-DISPOSABLE-WORLD \
            --offset-m 4.0 --obstacle-wall-dev --detour-after-wall-dev
          python -m adapters.mineflayer.s49_l1_experience_export_dev \
            --root "$DEV_OUTPUT" \
            --output "$DEV_OUTPUT/l1_route_episode_dev.json"
          python -m adapters.mineflayer.s49_goal_loop_real_dev \
            --output-dir "$DEV_OUTPUT/TRANSFER" \
            --confirm S49-GOAL-L0-DEV-DISPOSABLE-WORLD \
            --offset-m 4.0 --obstacle-wall-dev --detour-after-wall-dev \
            --experience-memory-dev "$DEV_OUTPUT/l1_route_episode_dev.json" \
            --experience-source-report-dev "$DEV_OUTPUT/DETOUR/goal_report.json"
          python -m adapters.mineflayer.s49_l1_experience_transfer_review_dev \
            --root "$DEV_OUTPUT"
      - name: Preserve source reports, episodic memory and failed cases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s49-l1-episodic-three-worlds-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEV_OUTPUT }}
          retention-days: 7
      - name: DEV classification
        if: always()
        run: echo 'DEV_ONLY / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
