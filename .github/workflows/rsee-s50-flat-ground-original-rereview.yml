name: R S50 flat ground DEV native original offline rereview
on:
  push:
    branches: ['infra/rsee-r6-s9-native-original-readback-20261012']
    paths: ['.github/workflows/rsee-s50-flat-ground-original-rereview.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: r-s50-flat-ground-real-seed63101-offline-rereview
  cancel-in-progress: false
jobs:
  r-independent-original-bytes:
    if: "github.run_attempt == 1 && github.event.head_commit.message == 'R S50 FLAT DEV: reread original Paper seed63101 without new World'"
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: rinsakamo/relay-self
      SOURCE_RUN: '38989215391'
      SOURCE_HEAD: '09f4dc238ee338d3fa421c6e1bf055b49a93ad8d'
      SOURCE_ART: '12084531180'
      SOURCE_ART_DIGEST: 'df981ff1d3eb064e78602ff785984a03a22d78943569b8c14dd9591675b103f7'
      PAPER_SHA: '8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Pin real source's FAILURE and original artifact; never rewrite as CI SUCCESS
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ["GH_REPO"]
          def api(path): return json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/{path}"]))
          s=api("actions/runs/"+os.environ["SOURCE_RUN"])
          a=api("actions/artifacts/"+os.environ["SOURCE_ART"])
          assert s["head_sha"]==os.environ["SOURCE_HEAD"]
          assert s["run_attempt"]==1 and s["conclusion"]=="failure"
          assert a["workflow_run"]["id"]==s["id"] and not a["expired"]
          assert a["digest"]=="sha256:"+os.environ["SOURCE_ART_DIGEST"]
          assert a["name"]=="s50-flat-ground-native-world-seed63101-38989215391-1"
          print("R_S50_FLAT_SOURCE_ORIGINAL_ARTIFACT_METADATA_PINNED_SOURCE_WORKFLOW_FAILED")
          PY
      - name: Download original flat stopped World and native console on separate R runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original"
          gh run download "$SOURCE_RUN" -R "$GH_REPO" \
            -n "s50-flat-ground-native-world-seed63101-38989215391-1" \
            -D "$RUNNER_TEMP/original"
      - name: Independent all-file bytes, native surface and original real seed
        env:
          PYTHONPATH: src:tests:.
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,re,stat
          from experiments.standard_env.v7_m02_world_nbt_audit import review_level_dat
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"original"/"flat-source"
          original=json.loads((root/"flat_dev_receipt.json").read_text())
          paper=(root/"paper_console.log").read_bytes()
          props=(root/"server/server.properties").read_bytes()
          level=(root/"server/world/level.dat").read_bytes()
          jar=(root/"server/paper-1.21.8.jar").read_bytes()
          digest=lambda b: hashlib.sha256(b).hexdigest()
          native=review_level_dat(level,expected_seed=63101)
          assert digest(jar)==os.environ["PAPER_SHA"]
          assert original["source_paper_sha256"]==digest(jar)
          assert original["classification"]=="S50_FLAT_PAPER_NATIVE_SURFACE_DEV_ONLY_NOT_QUALIFIED"
          assert original["status"]=="FLAT_GROUND_NATIVE_WITNESSED_DEV_ONLY"
          assert original["java_launch_attempts"]==1 and original["java_exit"]==0
          assert original["port_released"] is True and original["mineflayer_sessions"]==0
          assert original["native_surface_witnesses"]==25 and original["native_missing_markers"]==[]
          assert b"level-type=" in props and b"flat" in props and b"level-seed=63101" in props
          assert b"Done (" in paper and b"All dimensions are saved" in paper
          lines=paper.decode("utf-8",errors="replace").splitlines()
          found=set()
          for x in (-4,-2,0,2,4):
              for z in (-4,-2,0,2,4):
                  mark=f"S50_FLAT_DEV_GROUND_X{x}_Z{z}"
                  matches=[line for line in lines if "[Server] "+mark in line]
                  assert len(matches)==1,(mark,len(matches))
                  found.add(mark)
          assert len(found)==25
          index=[]
          w=root/"server/world"
          for p in sorted(w.rglob("*")):
              assert not p.is_symlink()
              if p.is_dir(): continue
              assert p.is_file() and stat.S_ISREG(p.stat().st_mode)
              payload=p.read_bytes()
              index.append({"relative_path":p.relative_to(w).as_posix(),
                            "size":len(payload),"sha256":digest(payload)})
          assert index==original["stopped_world_index"]
          assert any(e["relative_path"].endswith(".mca") for e in index)
          assert native["world_seed_from_nbt"]==63101
          assert original["food_placed"] is False
          assert original["natural_v8_world_modified"] is False
          assert original["v8_science_trials"]==0 and not original["science_go"]
          out={
              "classification":"R_S50_FLAT_REAL_NATIVE_GROUND_ORIGINAL_READBACK_ONLY",
              "source_run":int(os.environ["SOURCE_RUN"]),
              "source_workflow_conclusion":"FAILURE_AFTER_S_PHYSICAL_SUCCESS",
              "source_artifact_id":int(os.environ["SOURCE_ART"]),
              "source_artifact_provider_digest":os.environ["SOURCE_ART_DIGEST"],
              "source_full_zip_independently_hashed":False,
              "actual_world_seed_from_nbt":native["world_seed_from_nbt"],
              "native_5x5_grass_plus_two_air_marks":len(found),
              "stopped_world_files_independently_hashed":len(index),
              "level_dat_sha256":digest(level),
              "paper_console_sha256":digest(paper),
              "paper_jar_sha256":digest(jar),
              "properties_content_sha256":digest(props),
              "source_world_present":True,
              "native_start_pose_or_food_attested":False,
              "new_R_java_or_node_world_starts":0,
              "engineering_qualification":False,"science_trials":0,
              "science_go":False,"production_go":False,
          }
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"r-flat-original-review.json"
          path.write_text(json.dumps(out,sort_keys=True,indent=2)+"\n")
          print("R_S50_FLAT_ORIGINAL_NATIVE_BYTE_READBACK_PASS",json.dumps(out,sort_keys=True))
          PY
      - name: Save distinct R review receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-s50-flat-ground-original-rereview-${{ github.run_id }}
          path: ${{ runner.temp }}/r-flat-original-review.json
          if-no-files-found: warn
          retention-days: 90
