name: L-Z2c real H2 saved evidence DEV
on:
  push:
    branches: [dev/l-z2c-real-h2-validation-20261103]
  pull_request:
    paths:
      - 'docs/evidence/l-z2c-real-h2-20261103/**'
      - 'docs/l-z2c-real-h2-result-20261103.md'
      - '.github/workflows/l-z2c-real-h2-saved-evidence-dev.yml'
permissions:
  contents: read
jobs:
  saved-real-h2-numeric-pass-semantic-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:tests:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
      - name: Verify every saved evidence SHA and replay actual failure without HTTP
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('docs/evidence/l-z2c-real-h2-20261103')
          sums = json.loads((root / 'SHA256SUMS.json').read_text())
          actual = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in root.rglob('*') if p.is_file() and p.name != 'SHA256SUMS.json'}
          assert actual == sums
          old = Path('docs/evidence/l-z2b-real-20261102')
          old_sums = json.loads((root / 'original-all-files-before.json').read_text())
          assert {str(p.relative_to(old)): hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in old.rglob('*') if p.is_file()} == old_sums
          PY
          python -m tools.l_zombie_z2c_h2_independent_audit \
            --original-root "$PWD/docs/evidence/l-z2b-real-20261102" \
            --h2-root "$PWD/docs/evidence/l-z2c-real-h2-20261103/h2-original" \
            --report /tmp/l-z2c-ci-original-readback.json
          cmp /tmp/l-z2c-ci-original-readback.json \
            docs/evidence/l-z2c-real-h2-20261103/h2-original/h2-independent-original-audit.json
      - name: Offline source and refusal controls
        run: |
          ruff check adapters/mineflayer/l_zombie_z2c_feedback_contract.py \
            tools/l_zombie_z2c_h2_original_feedback.py tools/l_zombie_z2c_h2_independent_audit.py \
            tests/test_l_zombie_z2c_feedback_contract.py tests/test_l_zombie_z2c_h2_independent_audit.py
          python -m pytest -p no:cacheprovider -o addopts='' -q \
            tests/test_l_zombie_z2c_h2_independent_audit.py \
            tests/test_l_zombie_z2c_feedback_contract.py \
            tests/test_l_zombie_z2b_policy_contract.py \
            tests/test_l_zombie_z2b_paper_policy_audit.py \
            tests/test_l_zombie_z2a_prospective_audit.py \
            tests/test_l_mp11_gemma_wire_contract.py
          python tools/check_repository.py
      - run: echo 'SAVED_REAL_H2_REPLAY_ONLY / B1_N_LIMITED_PASS / B1_Q_FAIL / B1_U_NOT_ESTABLISHED / B2_NOT_ESTABLISHED / C_NOT_RUN / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
