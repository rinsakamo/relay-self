name: D14 R13 owner-checked Action Catalog and conditional Skill DEV
on:
  push:
    branches:
      - dev/d14-r13-action-catalog-skill-composer-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r13-catalog-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact HEAD
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned checks
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
      - name: Repository contracts
        run: python tools/check_repository.py
      - name: Catalog and parent R12 / R11 offline tests
        run: |
          python -m pytest -q -x \
            tests/test_d14_r13_action_catalog.py \
            tests/test_d14_r12_l2_shadow.py \
            tests/test_d14_r11_natural_day_foraging.py \
            tests/test_d14_r10_initial_sword.py \
            tests/test_d14_natural_active_s49.py \
            tests/test_d12_experience_bridge.py
      - name: Ruff R13 and integration files
        run: |
          ruff check \
            tools/bug0_d14_r13_action_catalog.py \
            tools/bug0_d14_r12_l2_shadow.py \
            tests/test_d14_r13_action_catalog.py \
            tests/test_d14_r12_l2_shadow.py
