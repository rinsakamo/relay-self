name: L13 Independent Goal Receipt and G413 No-Learning Gate DEV
on:
  push:
    branches:
      - integration/l13-independent-goal-receipt-contract-20261030
    paths:
      - .github/workflows/l13-independent-goal-receipt-focused-dev.yml
      - adapters/mineflayer/l11_saved_real_goal_originals_dev.py
      - adapters/mineflayer/l12_archived_action_progress_no_reward_dev.py
      - src/relay_self/l13_independent_goal_receipt.py
      - tests/test_l13_independent_goal_receipt.py
      - tests/test_l11_saved_real_goal_originals_dev.py
      - tests/test_l12_archived_action_progress_no_reward_dev.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  l13-independent-goal-triplets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      L11_REAL_ORIGINAL_ZIP: '/tmp/l11-g413-original-12952335343.zip'
      GH_ACTIONS_READ_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify pinned producer run and download existing saved original artifact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json, os, pathlib, urllib.request
          root = "https://api.github.com/repos/rinsakamo/relay-self"
          token = os.environ["GH_ACTIONS_READ_TOKEN"]
          headers = {"Authorization": "Bearer " + token,
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28",
                     "User-Agent": "RelaySelf-L11-Existing-Artifact-ReadOnly"}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(
                  root + path, headers=headers), timeout=45) as stream:
                  return stream.read(2_000_001)
          run = json.loads(get("/actions/runs/40997098497"))
          assert (run["status"], run["conclusion"], run["run_attempt"],
                  run["head_sha"], run["repository"]["full_name"]) == (
                  "completed", "success", 1,
                  "55f5f7c6f2e483ceb6bcb9d692c02b1dcf751e24",
                  "rinsakamo/relay-self"), "producer run identity drift"
          artifact = json.loads(get("/actions/artifacts/12952335343"))
          assert artifact["id"] == 12952335343 and not artifact["expired"]
          assert artifact["workflow_run"]["id"] == 40997098497
          assert artifact["workflow_run"]["head_sha"] == run["head_sha"]
          # GitHub redirects ZIP downloads to signed blob storage. Keep
          # the repo token only on api.github.com, never on the blob host.
          class StripAuthOnRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  new_req = super().redirect_request(
                      req, fp, code, msg, headers, newurl
                  )
                  if new_req is not None:
                      new_req.remove_header("Authorization")
                  return new_req
          opener = urllib.request.build_opener(StripAuthOnRedirect())
          with opener.open(urllib.request.Request(
              root + "/actions/artifacts/12952335343/zip", headers=headers
          ), timeout=45) as stream:
              raw = stream.read(2_000_001)
          assert raw[:2] == b"PK" and 0 < len(raw) < 2_000_000
          pathlib.Path(os.environ["L11_REAL_ORIGINAL_ZIP"]).write_bytes(raw)
          print("EXISTING_G413_SAVED_ARTIFACT_FETCHED_WITH_PRODUCER_SHA",
                12952335343, len(raw))
          PY
      - name: Verify independent tri-state Goal source contract and archived no-learning
        run: |
          set -euo pipefail
          python -m pip install 'pytest==9.1.1' 'ruff==0.17.0'
          ruff check src/relay_self/l13_independent_goal_receipt.py tests/test_l13_independent_goal_receipt.py adapters/mineflayer/l11_saved_real_goal_originals_dev.py adapters/mineflayer/l12_archived_action_progress_no_reward_dev.py tests/test_l11_saved_real_goal_originals_dev.py tests/test_l12_archived_action_progress_no_reward_dev.py
          python -m compileall -q src/relay_self/l13_independent_goal_receipt.py tests/test_l13_independent_goal_receipt.py adapters/mineflayer/l11_saved_real_goal_originals_dev.py adapters/mineflayer/l12_archived_action_progress_no_reward_dev.py tests/test_l11_saved_real_goal_originals_dev.py tests/test_l12_archived_action_progress_no_reward_dev.py
          python -m adapters.mineflayer.l12_archived_action_progress_no_reward_dev --artifact-zip "$L11_REAL_ORIGINAL_ZIP" > /tmp/l12-action-progress.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/l12-action-progress.json"))
          assert data["classification"] == "L12_REAL_S49_ENDPOINT_PROGRESS_ONLY_NO_PER_ACTION_GOAL_TRAINING"
          assert data["original_s49_action_rows"] == 11
          assert data["original_t2_world_ticks"] == 182
          assert data["action_end_inside_tolerance"] == 1
          assert data["action_end_outside_tolerance"] == 10
          assert data["endpoint_step_exceeds_action_displacement"] == 9
          assert data["independent_per_action_goal_receipts"] == 0
          assert data["qualified_l10_training_pairs"] == 0
          assert data["original_native_pre_action_world_body_receipts"] == 0
          assert not data["physical_learning_attested"]
          assert data["new_worlds_started"] == 0
          print("L12_REAL_G413_ACTION_PROGRESS_GOAL_REWARD_BLOCKED_PASS")
          PY
          python -m pytest -q tests/test_l13_independent_goal_receipt.py tests/test_l12_archived_action_progress_no_reward_dev.py tests/test_l11_saved_real_goal_originals_dev.py tests/test_l10_world_body_cue_learning.py tests/test_l9_world_body_epoch_shadow.py
          python tools/check_repository.py
      - name: Classification
        if: always()
        run: echo 'DEV_ONLY / L13_INDEPENDENT_GOAL_CONTRACT_OFFLINE / ARCHIVED_G413_GOAL_LABELS_0 / PHYSICAL_NEW_RUN_0 / ACTION_ISSUE_0 / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
