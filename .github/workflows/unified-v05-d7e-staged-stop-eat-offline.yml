name: Unified v0.5 D7-E original S49 STOP -> S51 EAT staged item OFFLINE DEV
on:
  push:
    branches:
      - dev/unified-v05-d7e-live-stop-eat-20261107
  pull_request:
    branches:
      - dev/unified-v05-d7d-staged-stop-sensor-20261107

permissions:
  contents: read

jobs:
  preworld:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Offline D6-C physical source + D7 Paper/S50 false-STOP controls
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python tools/check_repository.py
          python -m compileall -q tools/bug0_d6_staged_move_world.py tools/bug0_d6_staged_move_post.py tools/bug0_pickup_d1_world.py tools/bug0_d7_staged_stop_post.py tools/bug0_d7e_staged_move_eat.py tools/bug0_d7e_staged_move_eat_post.py adapters/mineflayer/d7_live_staged_stop.py tests/test_d7_staged_stop_post.py tests/test_d7e_live_staged_stop.py tests/test_d7e_staged_move_eat_post.py adapters/mineflayer/process_session.py
          ruff check tools/bug0_d6_staged_move_world.py tools/bug0_d6_staged_move_post.py tools/bug0_pickup_d1_world.py tools/bug0_d7_staged_stop_post.py tools/bug0_d7e_staged_move_eat.py tools/bug0_d7e_staged_move_eat_post.py adapters/mineflayer/d7_live_staged_stop.py adapters/mineflayer/normal_action.py tests/test_d7_staged_stop_post.py tests/test_d7e_live_staged_stop.py tests/test_d7e_staged_move_eat_post.py tools/bug0_d7_postmove_native_controls_post.py tools/bug0_d7_paper_server_tick_post.py adapters/mineflayer/process_session.py
          python -m pytest -q -x tests/test_d7e_live_staged_stop.py tests/test_d7e_staged_move_eat_post.py tests/test_d7_staged_stop_post.py tests/test_d7_postmove_native_controls.py tests/test_d7_paper_server_tick_post.py tests/test_d7c_multigen_postpickup_wait.py tests/test_d6_staged_move_world.py tests/test_d6_original_s49_loot_move.py tests/test_d6_loot_approach.py tests/test_bug0_pickup_d1_post.py tests/test_c1_physical_action_fence.py
      - name: Build reused original Paper staged-item and natural-drop witness plugins
        run: |
          mvn -B -ntp -f adapters/mineflayer/loot_pickup_fixture_dev/pom.xml -DskipTests package
          mvn -B -ntp -f adapters/mineflayer/zombie_drop_witness_dev/pom.xml -DskipTests package
      - name: Verify no World or new Action
        run: |
          echo 'D7_E_ORIGINAL_S49_S51_STOP_EAT_SOURCE_PREWORLD / WORLD0 / ACTION0 / EAT0 / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
