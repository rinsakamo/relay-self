name: L Z2a prospective CHEAP Paper freeze offline DEV
on:
  push:
    branches: [dev/l-zombie-z2a-prospective-cheap-20261102]
  pull_request:
    paths: ['adapters/mineflayer/l_zombie_paper_dev/**','tools/l_zombie_z1_one_world_dev.py','tools/l_zombie_z2a_prospective_audit.py','tests/test_l_zombie_z2a_prospective_audit.py']
permissions:
  contents: read
jobs:
  prospective-original-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: src:tests:.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
      - name: Native source forecast and original feedback/legacy regressions
        run: |
          set -euo pipefail
          ruff check tools/l_zombie_z2a_prospective_audit.py tests/test_l_zombie_z2a_prospective_audit.py tools/l_zombie_z1_one_world_dev.py tests/test_l_zombie_z1_one_world_dev.py
          python -m compileall -q tools/l_zombie_z2a_prospective_audit.py tools/l_zombie_z1_one_world_dev.py
          python -m pytest -p no:cacheprovider -o addopts='' -q \
            tests/test_l_zombie_z2a_prospective_audit.py \
            tests/test_l_zombie_z1_one_world_dev.py \
            tests/test_l_zombie_paper_original_audit.py \
            tests/test_l_zombie_z1_motion_audit.py \
            tests/test_l_zombie_20tick_shadow.py \
            tests/test_l_mp11_b1_forecast_contract.py
          python tools/check_repository.py
      - name: Paper plugin original native Java21 compile
        run: mvn -B -ntp -f adapters/mineflayer/l_zombie_paper_dev/pom.xml -DskipTests package
      - name: Source only verdict
        run: echo 'Z2A_OFFLINE_DEV / EXACT_FROZEN_CHEAP_ONLY / REAL_WORLD_0 / REAL_GEMMA_0 / NO_L2_OR_L0'
