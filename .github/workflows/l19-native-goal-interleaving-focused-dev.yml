name: L19 Native Goal Interleaving Focused DEV
on:
  push:
    branches:
      - integration/l19-native-goal-interleaving-world-readiness-20261031
    paths:
      - .github/workflows/l19-native-goal-interleaving-focused-dev.yml
      - adapters/mineflayer/l16_first_action_goal_originals.py
      - src/relay_self/l14_original_bridge_goal_window.py
      - tests/test_l19_native_goal_interleaving.py
      - tests/test_l15_s49_original_goal_preflight.py
      - tests/test_l16_s49_first_action_original_capture.py
      - tests/test_l17_first_action_goal_handoff.py
      - tests/test_l18_s16_terminal_owner_original.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-native-goal-interleaving:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify native entity interleavings preserve no-reward source contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          ruff check adapters/mineflayer/l16_first_action_goal_originals.py src/relay_self/l14_original_bridge_goal_window.py tests/test_l19_native_goal_interleaving.py
          python -m compileall -q adapters/mineflayer/l16_first_action_goal_originals.py src/relay_self/l14_original_bridge_goal_window.py tests/test_l19_native_goal_interleaving.py
          python -m pytest -q tests/test_l19_native_goal_interleaving.py tests/test_l16_s49_first_action_original_capture.py tests/test_l17_first_action_goal_handoff.py tests/test_l18_s16_terminal_owner_original.py
          python tools/check_repository.py
      - name: Classification
        if: always()
        run: echo 'DEV_ONLY / L19_BOUNDED_NATIVE_EVENT_GOAL_STREAM / EXTERNAL_GOAL_0 / REAL_L10_0 / NEW_WORLD_0 / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
