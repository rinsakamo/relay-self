name: Unified v0.5 D6-C staged-item original S49 MOVE preworld OFFLINE DEV
on:
  push:
    branches:
      - dev/unified-v05-d6-staged-item-world-20261107

permissions:
  contents: read

jobs:
  preworld-staged-item:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Static, simulated original S49 + C1 MOVE and source preflight
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python tools/check_repository.py
          python -m compileall -q tools/bug0_d6_staged_move_world.py tools/bug0_d6_staged_move_post.py tools/bug0_pickup_d1_world.py adapters/mineflayer/s34_native_world_cognition_ci.py tests/test_d6_staged_move_world.py
          ruff check tools/bug0_d6_staged_move_world.py tools/bug0_d6_staged_move_post.py tools/bug0_pickup_d1_world.py adapters/mineflayer/s34_native_world_cognition_ci.py tests/test_d6_staged_move_world.py
          python -m pytest -q -x tests/test_d6_staged_move_world.py tests/test_d6_original_s49_loot_move.py tests/test_d6_loot_approach.py tests/test_bug0_pickup_d1_post.py tests/test_c1_physical_action_fence.py
      - name: Build modified DEV-only original pickup Paper plugin without World
        run: |
          mvn -B -ntp -f adapters/mineflayer/loot_pickup_fixture_dev/pom.xml -DskipTests package
      - name: No World or physical Action was started
        run: |
          echo 'D6_C_PREWORLD_ONLY / WORLD0 / ACTION0 / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
