name: S49 L22 prior external Goal withheld one-shot World DEV

on:
  push:
    branches:
      - integration/s49-slm-passive-dev-20261031
    paths:
      - docs/s49-slm-l22-external-goal-one-shot-trigger-20261031.md

permissions:
  contents: read
  actions: read

jobs:
  one-disposable-world:
    if: "github.event.head_commit.message == 'dev-world approved S49 L22 external Goal withheld one-shot'"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      S49_REAL_SERVER_CI: '1'
      NODE_OPTIONS: ''
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
    steps:
      - name: Checkout exact current S49 sole issuer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Focused tools
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
      - name: Existing S49 + L8 + external Goal DEV contracts
        run: |
          python -m pytest -q tests/test_s49_slm_external_goal_dev.py tests/test_s49_slm_prior_world_dev.py tests/test_s49_slm_passive_dev.py tests/test_s49_slm_empty_memory_shadow.py
          ruff check adapters/mineflayer/slm_external_goal_candidate_dev.py adapters/mineflayer/slm_passive_dev.py adapters/mineflayer/slm_passive_dev_run.py tests/test_s49_slm_external_goal_dev.py
          python tools/check_repository.py
      - name: Fetch pre-reviewed exact pinned L22 real original source diagnostic
        uses: actions/download-artifact@v4
        with:
          run-id: 41174901216
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: s49-slm-l22-pinned-separate-client-review
          path: dev-evidence/
      - name: Reject external Goal training admission before any Java startup
        run: |
          python - <<'PY'
          from pathlib import Path
          from adapters.mineflayer.slm_external_goal_candidate_dev import read_external_goal_diagnostic

          row = read_external_goal_diagnostic(
              Path.cwd() / "dev-evidence/previous-l22-review",
          )
          assert row.source_session_id == "0b7d893c-9985-4e0e-a9a1-b99c107b7367"
          assert row.original_action_id == "s49-native-move-24"
          assert row.native_received_sha256 == "22c8100795e7e37acd91dea50a4db4943a4b448431d8b2b994d4d7aac72c6ea7"
          assert row.native_sent_sha256 == "97a7d70ac524f563e2e48de7a1921429b0d91fae1417bd34f8ee90968130e06f"
          assert row.original_s16_sha256 == "4f2d0a8f3c78d1046e094ee282fe477cad9395f034a42dcf63fbba4b66018f7b"
          assert row.separate_client_original_sha256 == "51f3280d19224ef26709cba8554101d551d0b1a2e7deee4d2a196cf3af00445a"
          assert row.separate_client_observation == "NOT_REACHED"
          assert row.native_goal_status == row.accepted_goal_status == "UNDETERMINED"
          assert row.settling_state == "SETTLING_OBSERVED"
          assert row.move_events_after_s16 == 6
          assert row.qualified_l8_training_pairs == 0
          assert row.external_owner_authenticated is False
          assert row.learning_authority is False
          print("PINNED_REAL_L22_UNDETERMINED_PREWORLD_REFUSAL_PASS")
          PY
      - name: Original Mineflayer runtime preflight
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if(require('./adapters/mineflayer/node_modules/mineflayer/package.json').version !== '4.39.0') process.exit(2)"
          java -version
      - name: Exactly one fresh disposable original S49 native World
        shell: bash
        run: |
          set -euo pipefail
          python -B -m adapters.mineflayer.slm_passive_dev_run \
            --confirm S49-SLM-ONE-DISPOSABLE-DEV-WORLD \
            --l8-empty-memory-shadow \
            --previous-external-goal-root "$GITHUB_WORKSPACE/dev-evidence/previous-l22-review" \
            --output-dir "$GITHUB_WORKSPACE/dev-evidence/world-one" \
            2>&1 | tee dev-evidence/host.log
      - name: Verify original outcomes and L8 previous independent-client abstention
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("dev-evidence")
          report = json.loads((root / "world-one/report.json").read_text())
          assert report["status"] == "PASS"
          assert report["session_id"] != "0b7d893c-9985-4e0e-a9a1-b99c107b7367"
          assert [x["selected"] for x in report["decisions"]] == [
              "WAIT", "MOVE_AWAY", "MOVE_AWAY",
          ]
          actions = report["actual_native_actions"]
          assert len(actions) == 2
          assert all(a["terminal"] == "outcome" for a in actions)
          slm = report["slm_dev"]
          assert slm["classification"] == "DEV_ONLY"
          assert slm["observer_errors"] == 0
          assert slm["one_l8_memory_owner"] is True
          assert slm["l8_retention_enabled"] is True
          assert slm["l8_training_admissions"] == 0
          ext = slm["previous_external_goal"]
          assert ext["source_session_id"] == "0b7d893c-9985-4e0e-a9a1-b99c107b7367"
          assert ext["separate_client_observation"] == "NOT_REACHED"
          assert ext["native_goal_status"] == ext["accepted_goal_status"] == "UNDETERMINED"
          assert ext["settling_state"] == "SETTLING_OBSERVED"
          assert ext["move_events_after_s16"] == 6
          assert ext["qualified_l8_training_pairs"] == 0
          assert ext["learning_authority"] is False
          assert ext["action_authority"] is False
          assert ext["external_owner_authenticated"] is False
          assert len(slm["rows"]) == 3
          assert all(
              row["status"] == "RECORDED"
              and row["l1_status"] == "no_admissible_l1_proposal"
              and row["l1_candidate"] is None
              and row["action_issues"] == row["learning_updates"]
              == row["habit_grants"] == row["food_credits"] == row["new_native_reads"] == 0
              for row in slm["rows"]
          )
          assert report["learning_in_world"] is False
          assert report["real_model_calls"] == slm["model_calls"] == 0
          assert report["node_exit"] == report["server_exit"] == 0
          assert report["w3_node_stdout_capture"]["status"] == "COMPLETE_NODE_STDOUT"
          (root / "verification.json").write_text(json.dumps({
              "classification": "DEV_L22_SEPARATE_CLIENT_GOAL_CANDIDATE_CARRIED_WITHHELD",
              "old_external_observer_goal": "NOT_REACHED",
              "old_native_goal": "UNDETERMINED",
              "admitted_training_labels": 0,
              "real_s49_actions": 2,
              "real_s49_s16_outcomes": 2,
              "current_l8_abstentions": 3,
              "qualification_no_go": True,
              "science_not_run": True,
          }, sort_keys=True, indent=2))
          print("S49_REAL_WORLD_WITH_SEPARATE_GOAL_CANDIDATE_WITHHELD_PASS")
          PY
      - name: Preserve audit, native originals, and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s49-slm-l22-external-goal-one-world-dev-originals
          path: dev-evidence/
          if-no-files-found: warn
          retention-days: 30
