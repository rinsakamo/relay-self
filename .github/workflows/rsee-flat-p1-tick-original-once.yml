name: R S50 FLAT P1 original native tick/owner preview audit once
on:
  push:
    branches: ['infra/rsee-r6-s9-native-original-readback-20261012']
    paths: ['.github/workflows/rsee-flat-p1-tick-original-once.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: r-s50-flat-p1-tick-original-once
  cancel-in-progress: false
jobs:
  original-readback-only:
    if: "github.run_attempt == 1 && github.event.head_commit.message == 'R S50 FLAT P1: independent one-shot old native and new tick preview readback'"
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: rinsakamo/relay-self
      S_ORIGINAL_RUN: '38994504183'
      S_ORIGINAL_HEAD: '9cb7a009b392ea8127528c310171d804251c90ec'
      S_ORIGINAL_ART: '12086324331'
      S_ORIGINAL_SHA: '6bd9d446eefb0a27a7599cdc4d1b79837bff3ef14d6c12ef6361435a9ea69ca6'
      S_PREVIEW_RUN: '39003515983'
      S_PREVIEW_HEAD: '5ef136f5c91d4d0cc65b91ebf638e4b669c831be'
      S_PREVIEW_ART: '12089998075'
      S_PREVIEW_SHA: 'b09f5f8c4392cd7b9073f21f51fde1819f8490e2135ec94a53052020de2db384'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: r
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: R-owned negatives and lint before source admission
        run: |
          set -euo pipefail
          test "$(git -C r rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.16.7'
          PYTHONPATH=r/src:r/tests:r python -m pytest -q             r/tests/test_rsee_s50_flat_p1_tick_lineage_original.py
          ruff check r/experiments/standard_env/s50_flat_p1_tick_lineage_original_audit.py             r/tests/test_rsee_s50_flat_p1_tick_lineage_original.py
      - name: Pin exact S original and S derived artifact identities
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ["GH_REPO"]
          def api(path):
              return json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/{path}"]))
          for kind in ("ORIGINAL","PREVIEW"):
              run=api("actions/runs/"+os.environ[f"S_{kind}_RUN"])
              art=api("actions/artifacts/"+os.environ[f"S_{kind}_ART"])
              assert run["head_sha"]==os.environ[f"S_{kind}_HEAD"]
              assert run["run_attempt"]==1 and run["conclusion"]=="success"
              assert art["workflow_run"]["id"]==run["id"] and not art["expired"]
              assert art["digest"]=="sha256:"+os.environ[f"S_{kind}_SHA"]
          print("R_FLAT_P1_S_ORIGINAL_AND_PREVIEW_PROVIDER_IDS_PINNED")
          PY
      - name: Download two archived sources and independently verify entire ZIP SHA256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s-original" "$RUNNER_TEMP/s-preview"
          gh api "repos/$GH_REPO/actions/artifacts/$S_ORIGINAL_ART/zip" > "$RUNNER_TEMP/s-original.zip"
          echo "$S_ORIGINAL_SHA  $RUNNER_TEMP/s-original.zip" | sha256sum -c -
          gh api "repos/$GH_REPO/actions/artifacts/$S_PREVIEW_ART/zip" > "$RUNNER_TEMP/s-preview.zip"
          echo "$S_PREVIEW_SHA  $RUNNER_TEMP/s-preview.zip" | sha256sum -c -
          python - <<'PY'
          import os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          for name,folder in (("s-original.zip","s-original"),("s-preview.zip","s-preview")):
              with zipfile.ZipFile(root/name) as z:
                  assert all(not pathlib.PurePosixPath(n).is_absolute()
                             and ".." not in pathlib.PurePosixPath(n).parts
                             for n in z.namelist())
                  z.extractall(root/folder)
          print("R_FLAT_P1_ENTIRE_ORIGINAL_AND_PREVIEW_ZIP_SHA_MATCH")
          PY
      - name: R reparse actual native Paper four-arm motion against S tick preview
        env:
          PYTHONPATH: r/src:r/tests:r
        run: |
          set -euo pipefail
          python -m experiments.standard_env.s50_flat_p1_tick_lineage_original_audit             --original "$RUNNER_TEMP/s-original/flat-four-results"             --derived "$RUNNER_TEMP/s-preview/s-flat-p1-tick-lineage-preview.json"             --output "$RUNNER_TEMP/r-flat-p1-tick-source-review.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-flat-p1-original-tick-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/r-flat-p1-tick-source-review.json
          if-no-files-found: warn
          retention-days: 90
