name: D12 R2 read-only long-run Experience join DEV offline
on:
  push:
    branches:
      - dev/unified-v05-d12r2-survival-experience-join-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-experience-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact branch HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned offline validator
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1" "ruff==0.16.7" "jsonschema==4.25.1"
      - name: Existing repository contracts
        run: python tools/check_repository.py
      - name: Source integrity and read-only bridge negative controls
        run: |
          python -m pytest -q -x \
            tests/test_d12_experience_bridge.py \
            tests/test_d12_third_intent_rearm.py \
            tests/test_d8_two_natural_food_post.py \
            tests/test_d8_two_natural_live_stop.py
      - name: Ruff
        run: |
          ruff check \
            tools/bug0_d12_experience_bridge.py \
            tests/test_d12_experience_bridge.py \
            tools/bug0_d12_third_intent_rearm_post.py \
            tools/bug0_d12_third_intent_rearm_world.py
