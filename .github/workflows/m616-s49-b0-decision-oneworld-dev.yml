name: M616 S49 B0 owner decision-only one World DEV
on:
  push:
    branches:
      - research/m616-s49-b0-decision-oneworld-20261103

permissions:
  contents: read

jobs:
  m616-b0-original-decision-oneworld:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      S49_REAL_SERVER_CI: '1'
      S49_COMPLETED_L0_DEV_ONLY: '1'
      S49_COMPLETED_PLANNED_DEV_ONLY: '1'
      M616_S49_LIVE_DEV_ONLY: '1'
      M616_S14_PLANNED_LIVE_DEV_ONLY: '1'
      S49_B0_DECISION_WITNESS_DEV_ONLY: '1'
      M616_B0_DECISION_LIVE_DEV_ONLY: '1'
      NODE_OPTIONS: ''
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
    steps:
      - name: Checkout fixed M code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.1
        with:
          node-version: '22'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Original S #709 decision-only B0 owner pinned checkout (do not edit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 42921b3f6a66f4cb622f9f628ffdc2c1cd12ba5d
          path: product_s49_b0_contract
          persist-credentials: false
      - name: Install pinned bootstrap and native dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          npm ci --omit=dev --no-audit --no-fund --prefix product_s49_b0_contract/adapters/mineflayer
          java -version
          node -e "if (require('./product_s49_b0_contract/adapters/mineflayer/node_modules/mineflayer/package.json').version !== '4.39.0') process.exit(2)"
      - name: Pre-world original S owner and M module import check
        run: |
          mkdir -p m616-b0-evidence
          python -B - <<'PY' > m616-b0-evidence/preflight.log
          from pathlib import Path
          import pytest
          from tools.m616_s49_b0_decision_owner_bootstrap import bootstrap_original_s49_b0_decision_owner
          from tools.m616_s49_b0_decision_live_owner_dev import M616B0DecisionLiveTap
          root = bootstrap_original_s49_b0_decision_owner(Path("product_s49_b0_contract"))
          from adapters.mineflayer.s49_normal_session_real_ci import qualify
          assert callable(qualify)
          assert M616B0DecisionLiveTap(enabled=True).s14.original.lease.enabled
          print("B0_PINNED_ORIGINAL_OWNER_PREWORLD_IMPORT_PASS", root)
          PY
      - name: Exactly one disposable physical Minecraft World DEV
        run: |
          set +e
          python -B -m tools.m616_s49_b0_decision_live_owner_dev \
            --s49-owner-dir product_s49_b0_contract \
            --report m616-b0-evidence/s49-report.json \
            --server-log m616-b0-evidence/minecraft.log \
            --m-report m616-b0-evidence/m-original-b0.json \
            --live-world-dev \
            > m616-b0-evidence/stdout.log \
            2> m616-b0-evidence/stderr.log
          rc=$?
          printf '{"process_exit": %s, "world_attempts": 1, "retries": 0}\n' "$rc" > m616-b0-evidence/exit.json
          exit "$rc"
      - name: Append evidence SHA and bounded status (never promote after failure)
        if: always()
        run: |
          mkdir -p m616-b0-evidence
          find m616-b0-evidence -maxdepth 1 -type f -not -name SHA256SUMS -print0 \
            | sort -z | xargs -0 -r sha256sum > m616-b0-evidence/SHA256SUMS
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("m616-b0-evidence")
          for p in ("exit.json","s49-report.json","m-original-b0.json"):
              path=root/p
              if path.exists():
                  data=json.loads(path.read_text())
                  print(p, "status=", data.get("status"), "reason=", data.get("reason"))
              else:
                  print(p, "NOT_PRODUCED")
          PY
      - name: Always preserve one-World raw evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m616-s49-b0-decision-oneworld-dev
          path: m616-b0-evidence/
          if-no-files-found: warn
          retention-days: 30
