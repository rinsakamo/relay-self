name: S49 cleanup isolated owner review (DEV ONLY)

on:
  push:
    branches:
      - 'self/product-self-one-command-s49cleanup-20261021'
  workflow_dispatch:

permissions:
  contents: read

# Review-only; does not suppress or rebaseline W4's protected original 19-blob gate.
jobs:
  s49-cleanup-prospective-offline:
    name: S49 fake-port cleanup review (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Fake original qualify and finalization policy, no World
        env:
          PYTHONPATH: 'src:tests:.'
          S49_REAL_SERVER_CI: '0'
          S49_STAGE_R_DEV_ONLY: '0'
        run: |
          python -m pytest -q tests/test_self_world_stage_w4_optin_offline.py \
            -k 'original_s49_qualify_fake_node_cleanup_failure or s49_finalization_candidate or s49_candidate'
