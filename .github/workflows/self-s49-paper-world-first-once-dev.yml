# DEV follow-on: read-only frozen S42/P1 capacity shadow, not actual L0 Action.
# DEV extension: same native post-WAIT source in SelfWorld and SelfBody.
# DEV native-next: one correlated post-WAIT probe through original S49 reader.
# DEV follow-on: native MOVE→P1 WAIT→two read-only SelfBody model epochs.
# DEV native-distance follow-on run: replaces explicit fatigue seed 0.5
# with fatigue accrued by P1 from the final original S49 MOVE's observed
# displacement, then checks Paper's later 8 WAIT callback ticks.
# The first DEV World RUN 40146589860 proved seeded WAIT path on Paper.
# DEV retry-002: initial run 40146359686 observed S49+Paper but
# post-action scheduler callback began later than console clock.
# Anchoring BEGIN to first Paper callback avoids fabricated missing tick.
name: S49 Paper World-first single DEV run
on:
  push:
    branches:
      - self/dev-s49-s50-p1-world-first-20261025
    paths:
      - .github/workflows/self-s49-paper-world-first-once-dev.yml

permissions:
  contents: read

concurrency:
  group: s49-paper-world-first-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  world-first-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      DEV_OUTPUT: '/tmp/s49-paper-p1-${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify DEV observer config, dependencies and loopback isolation
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -q '^enabled: false$' adapters/mineflayer/s49_paper_wait_observer_dev/src/main/resources/config.yml
          python - <<'PY'
          import socket
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
              s.bind(("127.0.0.1", 25565))
          print("Fresh loopback Minecraft port available; no external process touched")
          PY
      - name: Python 3.12 focused DEV entrypoint checks BEFORE any World
        run: |
          python -m pip install --disable-pip-version-check 'pytest==9.1.1'
          python -m pytest -q tests/test_s49_s50_p1_wait_replay_dev.py tests/test_s49_paper_world_first_dev.py tests/test_s49_paper_wait_observer_dev.py tests/test_s49_p1_self_body_dev.py tests/test_s49_p1_postwait_native_dev.py tests/test_s49_p1_l0_shadow_dev.py
      - name: Compile single read-only Paper wait observer on Java 21
        run: |
          mvn -B -ntp -f adapters/mineflayer/s49_paper_wait_observer_dev/pom.xml -DskipTests package
          test -f adapters/mineflayer/s49_paper_wait_observer_dev/target/relay-s49-wait-observer-dev-0.1.0-dev.jar
      - name: Install original Mineflayer package (unmodified bridge)
        run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - name: Fetch official stable Paper 1.21.8 build 60 and verify published SHA256
        id: paper
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          version = "1.21.8"
          api = f"https://fill.papermc.io/v3/projects/paper/versions/{version}/builds"
          ua = "RelaySelf-S49-P1-WORLD-FIRST-DEV/0.1 (https://github.com/rinsakamo/relay-self)"
          req = urllib.request.Request(api, headers={"User-Agent": ua})
          with urllib.request.urlopen(req, timeout=50) as rsp:
              builds = json.loads(rsp.read(3_000_000))
          stable = [b for b in builds if b.get("channel") == "STABLE" and b.get("id") == 60]
          if len(stable) != 1:
              raise RuntimeError("Pinned Paper 1.21.8 stable build 60 unavailable")
          artifact = stable[0]["downloads"]["server:default"]
          expected = "8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e"
          if (artifact["checksums"]["sha256"] != expected
                  or artifact["size"] != 52811717):
              raise RuntimeError("Pinned original Paper build metadata mismatch")
          url = artifact["url"]
          parsed = urllib.parse.urlparse(url)
          if (parsed.scheme != "https" or parsed.hostname != "fill-data.papermc.io"
                  or not parsed.path.startswith("/v1/objects/")):
              raise RuntimeError("Untrusted Paper binary URL")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "paper-1.21.8-dev.jar"
          hash_ = hashlib.sha256()
          total = 0
          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua}), timeout=120) as src, target.open("xb") as dst:
              while chunk := src.read(1048576):
                  total += len(chunk)
                  if total > 52811717: raise RuntimeError("Paper size exceeded")
                  dst.write(chunk)
                  hash_.update(chunk)
          if total != 52811717 or hash_.hexdigest() != expected:
              raise RuntimeError("Paper downloaded bytes mismatch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"jar={target}\nsha256={expected}\n")
          print("PAPER_DEV_PINNED", total, expected)
          PY
      - name: Run original S49 on one disposable Paper World, then DEV P1
        env:
          PAPER_JAR: ${{ steps.paper.outputs.jar }}
          PAPER_SHA: ${{ steps.paper.outputs.sha256 }}
        run: |
          OBSERVER="$PWD/adapters/mineflayer/s49_paper_wait_observer_dev/target/relay-s49-wait-observer-dev-0.1.0-dev.jar"
          OBSERVER_SHA="$(sha256sum "$OBSERVER" | cut -d' ' -f1)"
          python -m adapters.mineflayer.s49_paper_world_first_dev \
            --output-dir "$DEV_OUTPUT" \
            --paper-jar "$PAPER_JAR" \
            --paper-sha256 "$PAPER_SHA" \
            --observer-jar "$OBSERVER" \
            --observer-sha256 "$OBSERVER_SHA" \
            --confirm S49-P1-DEV-DISPOSABLE-PAPER-WORLD
      - name: Check real-run SelfBody model handoff (no fake native or L0)
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["DEV_OUTPUT"]) /
                               "world_first_dev_report.json").read_text())
          assert report["status"] == "PASS"
          assert report["classification"] == "DEV_WORLD_OBSERVED_MOVE_DISTANCE_TO_WAIT_P1_MODEL"
          p1, body = report["p1"], report["self_body_dev"]
          assert p1["dev_fatigue_before"] > p1["dev_fatigue_after"] == 0
          assert body["p1_sensor_pct_after_move"] > body["p1_sensor_pct_after_wait"] == 0
          assert body["body_model_origin"] == "hypothesis"
          assert body["source_scope"] == (
              "DEV_ACTION_DISTANCE_AND_PAPER_WAIT_MODEL_NO_NATIVE_POSTWAIT"
          )
          assert body["session_id"] == p1["session_id"]
          assert body["action_id"] == p1["action_id"]
          assert body["world"] == p1["world"]
          assert body["observer_run_id"] == p1["observer_run_id"]
          assert body["paper_wait_sample_count"] == 8
          assert body["native_postwait_observation"] is None
          assert body["native_postwait_sensor_handoff"] is None
          assert body["actual_next_l0_decision_consumed"] is False
          assert body["additional_action_issuers"] == 0
          assert body["additional_native_receivers"] == 0
          assert body["qualification_go"] is False
          assert body["science_go"] is False
          next_epoch = report["next_cognition_native_dev"]
          assert next_epoch["status"] == "DEV_REAL_NATIVE_NEXT_COGNITION_INPUT"
          assert next_epoch["session_id"] == body["session_id"]
          assert next_epoch["action_id"] == body["action_id"]
          assert next_epoch["paper_world"] == body["world"]
          assert next_epoch["observer_run_id"] == body["observer_run_id"]
          assert next_epoch["native_seq"] > next_epoch["previous_action_after_probe_seq"]
          assert next_epoch["native_source_ref"].startswith(
              f"native-probe:{body['session_id']}:"
          )
          assert next_epoch["native_request_id"] == (
              f"s49-postwait:{body['session_id']}:{body['action_id']}"
          )
          assert next_epoch["p1_dev_origin"] == "hypothesis"
          assert next_epoch["p1_dev_hypothesis_sensor_pct"] == (
              body["p1_sensor_pct_after_wait"]
          )
          assert next_epoch["p1_native_sensor"] is None
          assert next_epoch["p1_native_observation"] is None
          assert next_epoch["one_original_session_reader"] is True
          assert next_epoch["extra_native_probes"] == 1
          assert next_epoch["extra_action_issuers"] == 0
          assert next_epoch["real_next_l0_decision_consumed"] is False
          assert next_epoch["qualification_go"] is False
          print("S49_P1_SELF_BODY_NEXT_NATIVE_DEV_PASS", next_epoch)
          joined = report["next_self_world_dev"]
          assert joined["status"] == "DEV_NEXT_COGNITION_WORLD_BODY_SOURCE_JOINED"
          assert joined["session_id"] == next_epoch["session_id"]
          assert joined["native_seq"] == next_epoch["native_seq"]
          assert joined["native_request_id"] == next_epoch["native_request_id"]
          assert joined["native_source_ref"] == next_epoch["native_source_ref"]
          assert joined["world_body_same_object"] is True
          assert joined["world_body_same_epoch"] is True
          assert joined["p1_model_sensor_pct"] == next_epoch[
              "p1_dev_hypothesis_sensor_pct"
          ]
          assert joined["p1_source_kind"] == (
              "SELF_BODY_HYPOTHESIS_NOT_NATIVE_OBSERVATION"
          )
          assert joined["native_paper_exact_tick_joined"] is False
          assert joined["extra_protocol_receivers"] == 0
          assert joined["extra_action_issuers"] == 0
          assert joined["next_l0_consumed"] is False
          assert joined["qualification_go"] is False
          print("S49_P1_NEXT_SELF_WORLD_BODY_DEV_PASS", joined)
          shadow = report["next_l0_shadow_dev"]
          assert shadow["status"] == "DEV_S42_ORIGINAL_POLICY_SHADOW_COMPARISON"
          assert shadow["native_seq"] == next_epoch["native_seq"]
          assert shadow["native_request_id"] == next_epoch["native_request_id"]
          assert shadow["body_epoch_id"] == next_epoch["epoch_id"]
          assert shadow["s42_has_p1_input"] is False
          assert shadow["p1_changed_original_s42_selection"] is False
          assert shadow["actual_reactive_l0_decide_called"] is False
          assert shadow["original_l0_entities_event_consumed"] is False
          assert shadow["fresh_action_grant_issued"] is False
          assert shadow["after_move_p1_model_efficiency_pct"] < (
              shadow["after_wait_p1_model_efficiency_pct"]
          )
          assert shadow["after_wait_p1_model_efficiency_pct"] == 100
          assert shadow["additional_native_probes"] == 0
          assert shadow["extra_action_issuers"] == 0
          assert shadow["qualification_go"] is False and shadow["science_go"] is False
          print("S49_P1_L0_SHADOW_DEV_PASS", shadow)
          PY
      - name: Preserve original DEV receipts and failures (R/SCIENCE not run)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s49-paper-world-first-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEV_OUTPUT }}/world_first_dev_report.json
            ${{ env.DEV_OUTPUT }}/original_s49_report.json
            ${{ env.DEV_OUTPUT }}/paper_server.log
            ${{ env.DEV_OUTPUT }}/paper_observer_window.log
          if-no-files-found: warn
          retention-days: 7
      - name: State DEV boundary
        if: always()
        run: |
          echo 'DEV_ONLY / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
          echo 'No external R custody, V science, production P1 state, or Golden evidence changed.'
