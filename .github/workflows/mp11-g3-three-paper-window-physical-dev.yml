name: MP11 G3 one real Paper World three original S49/S16+S50 windows
on:
  push:
    branches: [dev/mp11-g3-paper-three-window-20261101]
    paths: ['.github/workflows/mp11-g3-three-paper-window-physical-dev.yml']
permissions:
  contents: read
jobs:
  one-paper-three-original-actions:
    if: github.event_name == 'push' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[mp11-g3-real-paper]')
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      S49_REAL_SERVER_CI: '1'
      MP11_S49_THREE_ACTION_DEV: '1'
      MP11_G3_PAPER_THREE_WINDOWS_DEV: '1'
      NODE_OPTIONS: ''
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src:tests:.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline preflight BEFORE any new World
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          ruff check adapters/mineflayer/s49_normal_session_real_ci.py \
            adapters/mineflayer/self_body_s50_l2_mp11_paper_audit.py \
            tools/mp11_g2_s49_original_audit.py tools/mp11_g3_paper_one_world_audit.py
          python -m compileall -q adapters/mineflayer/s49_normal_session_real_ci.py \
            tools/mp11_g3_paper_one_world_audit.py
          python -m pytest -o addopts='' -q \
            tests/test_mp11_g2_s49_original_audit.py \
            tests/test_self_body_s50_l2_mp11_paper_audit.py \
            tests/test_feature_s49_normal_runtime.py \
            tests/test_self_body_s50_original_closure.py \
            tests/test_s49_cleanup.py \
            tests/test_s49_native_os_custody.py
          python tools/check_repository.py
      - name: Build exact source Paper plugin + pinned Mineflayer 4.39.0
        run: |
          set -euo pipefail
          mvn -B -ntp -f adapters/mineflayer/m02_paper_dev/pom.xml -DskipTests package
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if(require('./adapters/mineflayer/node_modules/mineflayer/package.json').version!=='4.39.0')process.exit(1)"
      - name: Fetch official exact pinned Paper 1.21.8 build 60 by SHA256 and size
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os,pathlib,urllib.request
          h='8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e'
          url='https://fill-data.papermc.io/v1/objects/'+h+'/paper-1.21.8-60.jar'
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'mp11-g3-paper-1.21.8-60.jar'
          request=urllib.request.Request(url,headers={'User-Agent':'RelaySelf-MP11-G3-DEV (https://github.com/rinsakamo/relay-self)'})
          digest=hashlib.sha256();size=0
          with urllib.request.urlopen(request,timeout=120) as src,dest.open('xb') as out:
              while chunk:=src.read(1048576):
                  size+=len(chunk)
                  if size>52811717:raise ValueError('oversized Paper')
                  out.write(chunk);digest.update(chunk)
          assert size==52811717 and digest.hexdigest()==h
          PY
      - name: Freeze operator-only MP11 Paper profile from versioned disabled default
        run: |
          set -euo pipefail
          mkdir -p mp11-g3-originals/native-stdout
          python - <<'PY'
          from pathlib import Path
          p=Path('adapters/mineflayer/m02_paper_dev/src/main/resources/config.yml')
          original=p.read_text()
          cfg=original
          for key in ('dev-enabled','s50-input-witness-dev','s50-paper-local-forecast-dev','s50-ice-floor-dev','s50-mp11-multitrial-dev'):
              off=f'{key}: false'
              assert cfg.count(off)==1
              cfg=cfg.replace(off,f'{key}: true')
          assert 's50-tick-meter-dev:' not in cfg
          cfg=cfg.replace('dev-enabled: true','dev-enabled: true\ns50-tick-meter-dev: true')
          assert 's50-forecast-gate-dev: false' in cfg
          assert 's50-changed-body-condition-dev: false' in cfg
          out=Path('mp11-g3-originals/paper-active-config-original.yml')
          out.write_text(cfg)
          assert out.read_text()==cfg
          print('MP11_G3_ACTIVATED_BOUNDED_ONE_WORLD_PAPER_PROFILE')
          PY
      - name: One disposable Paper World; three original S49 Actions, no retry
        timeout-minutes: 11
        run: |
          set -euo pipefail
          python -B -m adapters.mineflayer.s49_normal_session_real_ci \
            --mp11-three-actions-dev \
            --mp11-g3-paper-jar "$RUNNER_TEMP/mp11-g3-paper-1.21.8-60.jar" \
            --mp11-g3-plugin-jar "$PWD/adapters/mineflayer/m02_paper_dev/target/relay-metabolism-paper-dev-0.2.0-dev.jar" \
            --mp11-g3-config "$PWD/mp11-g3-originals/paper-active-config-original.yml" \
            --raw-capture-root "$PWD/mp11-g3-originals/native-stdout" \
            --report mp11-g3-originals/report.json \
            --server-log mp11-g3-originals/paper-stdout-original.log
          python tools/mp11_g3_paper_one_world_audit.py \
            --report mp11-g3-originals/report.json \
            --original-paper mp11-g3-originals/paper-stdout-original.log \
            --output mp11-g3-originals/independent-paper-native-readback.json
      - name: Preserve originals even on failure; never retry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp11-g3-paper-one-world-three-original-windows-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
          path: mp11-g3-originals/
      - name: DEV only; L2 and autonomous learning not performed
        if: always()
        run: echo 'ONE_PAPER_WORLD / THREE_ORIGINAL_S49_ACTIONS_MAX / THREE_S50_WAIT8 / L2_REAL_CALLS_ZERO / NO_NEW_LEARNING / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
