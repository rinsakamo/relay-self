name: Unified v0.5 S49 ATTACK EAT preissue fence OFFLINE DEV
on:
  push:
    branches:
      - dev/unified-v05-d5-c1-combat-food-fence-20261107

permissions:
  contents: read
jobs:
  nonmotion-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Pinned dependencies and offline original owner contract
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 ruff==0.16.7
          python tools/check_repository.py
          python -m compileall -q src/relay_self/s49_nonmotion_physical_fence.py adapters/mineflayer/eat_execution.py adapters/mineflayer/normal_action.py tests/test_s49_nonmotion_physical_fence.py
          ruff check src/relay_self/s49_nonmotion_physical_fence.py adapters/mineflayer/eat_execution.py adapters/mineflayer/normal_action.py tests/test_s49_nonmotion_physical_fence.py
      - name: ATTACK and EAT preissue crash replay negative tests
        run: |
          python -m pytest -q -x tests/test_s49_nonmotion_physical_fence.py tests/test_bug0_s49_attack_owner.py tests/test_bug0_s49_s51_eat_handoff.py tests/test_bug0_d5_intent_epoch_rearm.py tests/test_unified_d5_c1_owner_integration.py tests/test_c1_physical_action_fence.py
      - name: No real World or physical Action
        run: |
          echo 'DEV_S49_NONMOTION_PREISSUE_FENCE_OFFLINE_PASS'
          echo 'WORLD_NOT_RUN / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
