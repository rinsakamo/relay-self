name: L11 Saved Real G413 Original Goal Boundary Read-only DEV
on:
  push:
    branches:
      - integration/l11-g413-real-original-goal-boundary-20261030
    paths:
      - .github/workflows/l11-g413-real-original-goal-audit-dev.yml
      - adapters/mineflayer/l11_saved_real_goal_originals_dev.py
      - tests/test_l11_saved_real_goal_originals_dev.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  l11-original-goal-saved-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      L11_REAL_ORIGINAL_ZIP: '/tmp/l11-g413-original-12952335343.zip'
      GH_ACTIONS_READ_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify pinned producer run and download existing saved original artifact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json, os, pathlib, urllib.request
          root = "https://api.github.com/repos/rinsakamo/relay-self"
          token = os.environ["GH_ACTIONS_READ_TOKEN"]
          headers = {"Authorization": "Bearer " + token,
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28",
                     "User-Agent": "RelaySelf-L11-Existing-Artifact-ReadOnly"}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(
                  root + path, headers=headers), timeout=45) as stream:
                  return stream.read(2_000_001)
          run = json.loads(get("/actions/runs/40997098497"))
          assert (run["status"], run["conclusion"], run["run_attempt"],
                  run["head_sha"], run["repository"]["full_name"]) == (
                  "completed", "success", 1,
                  "55f5f7c6f2e483ceb6bcb9d692c02b1dcf751e24",
                  "rinsakamo/relay-self"), "producer run identity drift"
          artifact = json.loads(get("/actions/artifacts/12952335343"))
          assert artifact["id"] == 12952335343 and not artifact["expired"]
          assert artifact["workflow_run"]["id"] == 40997098497
          assert artifact["workflow_run"]["head_sha"] == run["head_sha"]
          # GitHub redirects ZIP downloads to signed blob storage. Keep
          # the repo token only on api.github.com, never on the blob host.
          class StripAuthOnRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  new_req = super().redirect_request(
                      req, fp, code, msg, headers, newurl
                  )
                  if new_req is not None:
                      new_req.remove_header("Authorization")
                  return new_req
          opener = urllib.request.build_opener(StripAuthOnRedirect())
          with opener.open(urllib.request.Request(
              root + "/actions/artifacts/12952335343/zip", headers=headers
          ), timeout=45) as stream:
              raw = stream.read(2_000_001)
          assert raw[:2] == b"PK" and 0 < len(raw) < 2_000_000
          pathlib.Path(os.environ["L11_REAL_ORIGINAL_ZIP"]).write_bytes(raw)
          print("EXISTING_G413_SAVED_ARTIFACT_FETCHED_WITH_PRODUCER_SHA",
                12952335343, len(raw))
          PY
      - name: Validate real originals, negative controls and L10 regression
        run: |
          set -euo pipefail
          python -m pip install 'pytest==9.1.1' 'ruff==0.17.0'
          ruff check adapters/mineflayer/l11_saved_real_goal_originals_dev.py tests/test_l11_saved_real_goal_originals_dev.py
          python -m compileall -q adapters/mineflayer/l11_saved_real_goal_originals_dev.py tests/test_l11_saved_real_goal_originals_dev.py
          python -m adapters.mineflayer.l11_saved_real_goal_originals_dev --artifact-zip "$L11_REAL_ORIGINAL_ZIP" > /tmp/l11-original-audit.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/l11-original-audit.json"))
          assert data["classification"] == "L11_REAL_ORIGINAL_WORLD_GOAL_ONLY_NO_ACTION_LABELS"
          assert data["original_s49_outcomes"] == 11
          assert data["original_t2_world_ticks"] == 182
          assert data["action_goal_labels_admitted"] == 0
          assert data["l10_qualified_episode_pairs"] == 0
          assert not data["l10_current_world_body_cues_admitted"]
          assert not data["physical_learning_attested"]
          print("L11_REAL_G413_ORIGINAL_GOAL_BOUNDARY_SOURCE_ONLY_PASS")
          PY
          python -m pytest -q tests/test_l11_saved_real_goal_originals_dev.py tests/test_l10_world_body_cue_learning.py tests/test_l9_world_body_epoch_shadow.py
          python tools/check_repository.py
      - name: Classification
        if: always()
        run: echo 'DEV_ONLY / L11_SAVED_G413_ORIGINALS_SHA_BOUND / S49_OUTCOME_NOT_GOAL_LABEL / L10_SOURCE_GAP_PRESERVED / PHYSICAL_NEW_RUN_0 / ACTION_ISSUE_0 / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
