name: L Lane L2 forecast observation (offline)

on:
  push:
    branches:
      - 'learning/l2-forecast-observation-*'
  pull_request:
    branches:
      - 'self/l-lane-l1-experience-reuse-*'

permissions:
  contents: read

concurrency:
  group: l-lane-l2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prediction-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact L1 ancestry and head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 40db58d548ea31c4a70acabcc71b0954c7b6ce42 HEAD
          python tools/check_repository.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Ephemeral CI test package only
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Focused L2/L1/PRD tests (no World)
        env:
          PYTHONPATH: 'src:tests:.'
        run: python -m pytest -q tests/test_forecast_bridge.py tests/test_experience_bridge.py tests/test_prediction_qualification.py
      - name: Complete inherited Python regression
        env:
          PYTHONPATH: 'src:tests:.'
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.7'
      - run: ruff check src tests experiments adapters observability
