name: Self 1.0 one-command product integration

on:
  push:
    branches:
      - 'self/product-self-one-command-*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 'self/s60b1-loopback-adapter-*'

permissions:
  contents: read

concurrency:
  group: self-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact head + inherited S60-B1 dependency
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 66b8045fd2b47d9c35febb12c495379d1248bb4e HEAD
          # S49 original evidence and other product owners are immutable.
          # The old single-S49-file gate was historical and contradicted
          # the already existing #545 product branch's integrated changes.
          B0_PARENT=4edac0b139d2d49b0169ffaad7c5892bed7fa2d1
          git merge-base --is-ancestor "$B0_PARENT" HEAD
          git diff --quiet "$B0_PARENT" HEAD -- adapters/mineflayer/s49_normal_session_real_ci.py
          # Stable S owner-path fence, not an ever-growing exact file allowlist.
          git diff --name-only --diff-filter=ACDMRTUXB "$B0_PARENT" HEAD > "$RUNNER_TEMP/s-paths"
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/self-demo.yml|adapters/mineflayer/*|docs/self-demo.md|docs/v6-world-qualification-once.md|experiments/metabolism_viability.py|experiments/ac_c_c15_manifest.json|src/relay_self/eat_hunger.py|tests/test_*.py) ;;
              *) echo "Cross-owner or protected file: $changed" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/s-paths"
      - run: python tools/check_repository.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Frozen S V1/V2 producer blob tests require immutable ancestor objects.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Verify usable CLI and integration tests with NO physical World
        env:
          PYTHONPATH: 'src:tests:.'
        run: |
          python -m adapters.mineflayer.self_demo
          python -m adapters.mineflayer.self_demo --smoke
          # Fast DEV contracts: B0/B1 behavior, issued Action, metabolism and isolation.
          # Full V6/legacy/LLM/UI cases run when the PR is ready for review.
          python -m pytest -q tests/test_b1_local_adaptation.py tests/test_b1_dev.py tests/test_b0_energy_bridge.py tests/test_b0_ground_foraging.py tests/test_b0_two_epoch.py tests/test_b0_rsee.py tests/test_feature_s51_eat_execution.py tests/test_self_dev.py tests/test_self_demo.py tests/test_self_action_evidence.py
      - name: Full inherited regression (review / integration only)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.7'
      - run: ruff check src tests experiments adapters observability

  mineflayer-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - run: npm run check --prefix adapters/mineflayer
