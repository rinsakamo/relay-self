name: Self 1.0 one-command product integration

on:
  push:
    branches:
      - 'self/product-self-one-command-*'
  pull_request:
    branches:
      - 'self/s60b1-loopback-adapter-*'

permissions:
  contents: read

concurrency:
  group: self-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact head + inherited S60-B1 dependency
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 66b8045fd2b47d9c35febb12c495379d1248bb4e HEAD
          # The product evidence fix intentionally adds one append-only field
          # to the S49 report writer; every other inherited source stays frozen.
          changed="$(git diff --name-only --diff-filter=CDMRTUXB 66b8045fd2b47d9c35febb12c495379d1248bb4e HEAD)"
          test "$changed" = "adapters/mineflayer/s49_normal_session_real_ci.py"
      - run: python tools/check_repository.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Verify usable CLI and integration tests with NO physical World
        env:
          PYTHONPATH: 'src:tests:.'
        run: |
          python -m adapters.mineflayer.self_demo
          python -m adapters.mineflayer.self_demo --smoke
          python -m pytest -q tests/test_self_demo.py tests/test_self_action_evidence.py
          timeout 35s python -m pytest -vv -s -x -o faulthandler_timeout=5 tests/test_self_think.py
          timeout 35s python -m pytest -q -x tests/test_self_live_think.py
      - name: Full inherited regression
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.7'
      - run: ruff check src tests experiments adapters observability

  mineflayer-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - run: npm run check --prefix adapters/mineflayer
