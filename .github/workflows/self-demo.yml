name: Self 1.0 one-command product integration

on:
  push:
    branches:
      - 'self/product-self-one-command-*'
  pull_request:
    branches:
      - 'self/s60b1-loopback-adapter-*'
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  actions: read

concurrency:
  group: self-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact head + inherited S60-B1 dependency
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 66b8045fd2b47d9c35febb12c495379d1248bb4e HEAD
          # S49 original evidence and other product owners are immutable.
          # The old single-S49-file gate was historical and contradicted
          # the already existing #545 product branch's integrated changes.
          B0_PARENT=4edac0b139d2d49b0169ffaad7c5892bed7fa2d1
          git merge-base --is-ancestor "$B0_PARENT" HEAD
          # Stage R: explicit opt-in S49 DEV migration; historical
          # evidence is immutable, default route regressed by focused tests.
          test -f adapters/mineflayer/s49_normal_session_real_ci.py
          # Permit ordinary S-owned feature/test growth, not changes in other lanes.
          # Existing S50 seek_execution remains the sole Action issuer; the
          # DEV-only phase hook adds observability, not admission authority.
          changed="$(git diff --name-only --diff-filter=ACDMRTUXB "$B0_PARENT" HEAD)"
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              .github/workflows/self-demo.yml|\
              .github/workflows/m02-paper-dev-build.yml|\
              .github/workflows/m02-v7-five-arm-dev.yml|\
              .github/workflows/m02-v7-controlled-pose-dev.yml|\
              .github/workflows/s50-five-original-meter-screen.yml|\
              .github/workflows/s50-p1-wait-dev.yml|\
              .github/workflows/s50-flat-four-one-shot-dev.yml|\
              .github/workflows/m02-v7-new-base-on-one-shot-qualification.yml|\
              .github/workflows/m02-v7-remaining-four-one-shot-qualification.yml|\
              .github/workflows/m02-paper-physical-dev.yml|\
              adapters/mineflayer/m02_paper_dev/**|\
              adapters/mineflayer/b0_*.py|\
              adapters/mineflayer/b1_*.py|\
              adapters/mineflayer/bridge.mjs|\
              adapters/mineflayer/package.json|\
              adapters/mineflayer/python_protocol.py|\
              adapters/mineflayer/process_session.py|\
              adapters/mineflayer/normal_action.py|\
              adapters/mineflayer/seek_execution.py|\
              adapters/mineflayer/s51_eat_real_ci.py|\
              adapters/mineflayer/self_demo.py|\
              adapters/mineflayer/self_live_think.py|\
              adapters/mineflayer/self_body_projection.py|\
              src/relay_self/self_body.py|\
              docs/selfbody-v0.md|\
              tests/test_self_body.py|\
              adapters/mineflayer/self_world_projection.py|\
              adapters/mineflayer/self_world_prospective.py|\
              adapters/mineflayer/self_world_learning_gate.py|\
              adapters/mineflayer/self_world_native_feedback.py|\
              adapters/mineflayer/self_world_owner_handoff.py|\
              adapters/mineflayer/self_world_epoch_handoff.py|\
              adapters/mineflayer/self_world_epoch_control.py|\
              adapters/mineflayer/self_world_stage_r_owner.py|\
              adapters/mineflayer/self_world_stage_s_feedback.py|\
              adapters/mineflayer/self_world_stage_t_policy.py|\
              adapters/mineflayer/self_world_stage_u_gate.py|\
              adapters/mineflayer/self_world_stage_v_attestation.py|\
              adapters/mineflayer/self_world_stage_v_wait_safety.py|\
              adapters/mineflayer/self_world_stage_w_archive.py|\
              adapters/mineflayer/self_world_stage_w_gate.py|\
              adapters/mineflayer/self_world_stage_w2_ledger_worker.py|\
              adapters/mineflayer/self_world_stage_w2_local_preflight.py|\
              adapters/mineflayer/self_world_stage_w3_capture.py|\
              adapters/mineflayer/s49_normal_session_real_ci.py|\
              adapters/mineflayer/s34_native_world_cognition_ci.py|\
              src/relay_self/self_world.py|\
              src/relay_self/world_conditioned_choice.py|\
              docs/selfworld-v0.md|\
              docs/selfworld-w2-localcodex.md|\
              docs/selfworld-w3-native-capture.md|\
              tests/test_self_world.py|\
              adapters/mineflayer/v6_*.py|\
              adapters/mineflayer/v6_*.mjs|\
              adapters/mineflayer/v6_*.test.mjs|\
              docs/self-demo.md|\
              docs/v6-world-qualification-once.md|\
              experiments/metabolism_viability.py|\
              src/relay_self/eat_hunger.py|\
              tests/test_b0_*.py|\
              tests/test_b1_*.py|\
              tests/test_feature_s51_eat_execution.py|\
              tests/test_self_dev.py|\
              tests/test_self_live_think.py|\
              tests/test_self_action_evidence.py|\
              tests/test_self_world_prospective.py|\
              tests/test_self_world_learning_gate.py|\
              tests/test_self_world_native_feedback.py|\
              tests/test_self_world_owner_handoff.py|\
              tests/test_self_world_epoch_handoff.py|\
              tests/test_self_world_epoch_control.py|\
              tests/test_self_world_stage_r_owner.py|\
              tests/test_self_world_stage_s_feedback.py|\
              tests/test_self_world_stage_t_policy.py|\
              tests/test_self_world_stage_u_gate.py|\
              tests/test_self_world_stage_v_attestation.py|\
              tests/test_self_world_stage_v_wait_safety.py|\
              tests/test_self_world_stage_w_gate.py|\
              tests/test_self_world_stage_w2_local.py|\
              tests/test_self_world_stage_w3_capture.py|\
              tests/test_m02_paper_dev.py|\
              tests/test_m02_v8_stopped_world_clone_dev.py|\
              tests/test_m02_v7_new_qualification.py|\
              tests/test_m02_v7_four_arm_qualification.py|\
              tests/test_s50_*.py|\
              tests/test_s50_p1_wait.py|\
              tests/test_s50_p1_scope.py|\
              tests/test_v6_world_qualification.py)
                ;;
              *)
                echo "::error::Non-S-owner path since $B0_PARENT: $path"
                exit 1
                ;;
            esac
          done <<< "$changed"
      - run: python tools/check_repository.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Frozen S V1/V2 producer blob tests require immutable ancestor objects.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: FAST owner-focused B0/B1 integration, no physical World
        env:
          PYTHONPATH: 'src:tests:.'
        run: |
          python -m adapters.mineflayer.self_demo
          python -m adapters.mineflayer.self_demo --smoke
          python -m pytest -q \
            tests/test_b0_energy_bridge.py \
            tests/test_b0_ground_foraging.py \
            tests/test_b0_two_epoch.py \
            tests/test_b0_rsee.py \
            tests/test_b1_local_adaptation.py \
            tests/test_b1_dev.py \
            tests/test_feature_s51_eat_execution.py \
            tests/test_self_dev.py \
            tests/test_m02_paper_dev.py \
            tests/test_m02_v7_new_qualification.py \
            tests/test_m02_v7_four_arm_qualification.py \
            tests/test_s50_physical_boundary.py \
            tests/test_s50_control_loop_order.py \
            tests/test_s50_packet_trace.py \
            tests/test_s50_p1_wait.py \
            tests/test_s50_p1_scope.py \
            tests/test_self_demo.py \
            tests/test_self_live_think.py \
            tests/test_self_action_evidence.py \
            tests/test_self_world_prospective.py \
            tests/test_self_world_learning_gate.py \
            tests/test_self_world_native_feedback.py \
            tests/test_self_world_owner_handoff.py \
            tests/test_self_world_epoch_handoff.py \
            tests/test_self_world_epoch_control.py \
            tests/test_self_world_stage_r_owner.py \
            tests/test_self_world_stage_s_feedback.py \
            tests/test_self_world_stage_t_policy.py \
            tests/test_self_world_stage_u_gate.py \
            tests/test_self_world_stage_v_attestation.py \
            tests/test_self_world_stage_v_wait_safety.py \
            tests/test_self_world_stage_w_gate.py \
            tests/test_self_world_stage_w2_local.py \
            tests/test_self_world_stage_w3_capture.py \
            tests/test_mineflayer_process_session.py \
            tests/test_feature_s49_normal_runtime.py \
            tests/test_self_body.py \
            tests/test_self_world.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.7'
      - run: ruff check src tests experiments adapters observability

  mineflayer-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - run: npm run check --prefix adapters/mineflayer

  full-regression:
    # Draft runs remain FAST; full inherited tests are a review-stage gate.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - run: python -m pytest -q

  selfworld-stage-j-dev-once:
    # One fresh disposable S49 World only, never on ordinary draft pushes.
    # A marker commit acts as an explicit DEV grant; CI must pass first.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && github.ref == 'refs/heads/self/product-self-one-command-selfbody-20261018' && contains(github.event.head_commit.message, '[selfworld-stage-j-dev-once]') }}
    needs: [repository-contracts, pytest, lint, mineflayer-adapter]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      DEV_ROOT: /tmp/selfworld-stage-j-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install S49 fixture dependency before module import
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Reaffirm source, exact commit, and fixed Mineflayer version
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$DEV_ROOT"
          java -version
          node --version
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if(require('./adapters/mineflayer/node_modules/mineflayer/package.json').version !== '4.39.0') process.exit(2)"
      - name: Start exactly one explicit DEV_ONLY S49 SelfWorld test
        shell: bash
        run: |
          set -o pipefail
          python -B -m adapters.mineflayer.self_demo \
            --mode DEV --dev-scenario native-selfworld --run-disposable \
            --confirm SELF-DEMO-I-OWN-DISPOSABLE-WORLD \
            --output-dir "$DEV_ROOT" \
            --live-think --self-world-live \
            --model-alias stage-j-backend-not-attested --model-port 16559 \
            --model-timeout 1 \
            | tee "${{ runner.temp }}/selfworld-stage-j-cli.log"
      - name: Preserve this one DEV receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfworld-stage-j-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEV_ROOT }}/dev_receipt.json
            ${{ env.DEV_ROOT }}/SHA256SUMS
            ${{ env.DEV_ROOT }}/native_report.json
            ${{ env.DEV_ROOT }}/minecraft_server.log
            ${{ env.DEV_ROOT }}/host_stdout.log
            ${{ env.DEV_ROOT }}/host_stderr.log
            ${{ env.DEV_ROOT }}/live_l2.jsonl
            ${{ runner.temp }}/selfworld-stage-j-cli.log
          if-no-files-found: warn
          retention-days: 30

  selfworld-stage-k-source-replay-once:
    # Pure read-only replay of immutable prior Stage J artifact, NO Java/World.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && github.ref == 'refs/heads/self/product-self-one-command-selfbody-20261018' && contains(github.event.head_commit.message, '[selfworld-stage-k-replay-once]') }}
    needs: [repository-contracts, pytest, lint, mineflayer-adapter]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: 'src:tests:.'
      GH_TOKEN: ${{ github.token }}
      STAGE_K_ROOT: /tmp/relay-self-stage-k-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Read original immutable Stage J native source (no game)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$STAGE_K_ROOT"
          gh api repos/rinsakamo/relay-self/actions/artifacts/12128397812/zip \
            > "$STAGE_K_ROOT/stage-j-original.zip"
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import zipfile

          from adapters.mineflayer.self_demo import review_s49_action_self_world_report

          root = pathlib.Path(os.environ["STAGE_K_ROOT"])
          raw = (root / "stage-j-original.zip").read_bytes()
          source_sha = hashlib.sha256(raw).hexdigest()
          expected = "3b127778a8a6a2483a8f30649edbb3334229fb2f2f92cba720f084f36dfc467e"
          assert source_sha == expected, "immutable original artifact digest differs"
          with zipfile.ZipFile(root / "stage-j-original.zip") as archive:
              members = archive.infolist()
              assert len(members) <= 30
              assert all(
                  not pathlib.PurePosixPath(item.filename).is_absolute()
                  and ".." not in pathlib.PurePosixPath(item.filename).parts
                  and item.file_size < 2_000_000
                  and not item.is_dir()
                  for item in members
              )
              def once(basename):
                  matches = [item for item in members
                             if pathlib.PurePosixPath(item.filename).name == basename]
                  assert len(matches) == 1, f"one {basename} required"
                  return json.loads(archive.read(matches[0]))
              dev = once("dev_receipt.json")
              native = once("native_report.json")
          assert dev["git_head"] == "2e75a56d66c9dd32046719d5d1b9f6ff7cd539cc"
          assert dev["run_id"] == "e7d91ef52b7a462bb622a844f8a942f7"
          assert dev["status"] == "COMPLETED"
          assert dev["classification"] == "DEV_ONLY"
          assert dev["session_id"] == native["session_id"]
          assert dev["dev_self_world_input"] == "SOURCE_BOUND"
          assert dev["dev_self_world_review"] == "undetermined"
          results = review_s49_action_self_world_report(native)
          assert len(results) == 2
          summary = {
              "classification": "DEV_ONLY_RETROSPECTIVE_NO_NEW_WORLD",
              "source_run": 39105927208,
              "source_artifact_id": 12128397812,
              "source_artifact_sha256": source_sha,
              "source_session": native["session_id"],
              "source_action_count": len(native["actual_native_actions"]),
              "retrospective_reviews": results,
              "new_world_starts": 0,
              "additional_actions": 0,
              "prospective_live_prediction_attested": False,
              "s17_feedback_granted": False,
              "s10_learning_committed": False,
              "r_qualified": False,
              "v_science": False,
          }
          (root / "stage-k-result.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, sort_keys=True))
          # Outcome UNKNOWN is a valid conservative evidence classification;
          # do not turn it into MATCH for a green workflow.
          assert any(r["status"] in ("match", "mismatch") for r in results), (
              "source replay valid, but no positive same-target successor"
          )
          PY
      - name: Preserve retrospective results, including incomplete and failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfworld-stage-k-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.STAGE_K_ROOT }}/stage-k-result.json
          if-no-files-found: warn
          retention-days: 30


  selfworld-stage-k-archive-once:
    # Separate, read-only after-the-fact analysis of ORIGINAL Stage J World.
    # No Java/Node/Minecraft starts. Do not treat as prospective prediction.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && github.ref == 'refs/heads/self/product-self-one-command-selfbody-20261018' && contains(github.event.head_commit.message, '[selfworld-stage-k-archive-once]') }}
    needs: [repository-contracts, pytest, lint, mineflayer-adapter]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      PYTHONPATH: 'src:tests:.'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Retrieve original immutable Stage J physical DEV artifact only
        run: |
          mkdir -p "$RUNNER_TEMP/stage-k"
          gh api repos/rinsakamo/relay-self/actions/artifacts/12128397812/zip > "$RUNNER_TEMP/stage-k/original.zip"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          source = Path(os.environ["RUNNER_TEMP"]) / "stage-k/original.zip"
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          print("ORIGINAL_ARTIFACT_SHA256", digest)
          assert digest == "3b127778a8a6a2483a8f30649edbb3334229fb2f2f92cba720f084f36dfc467e"
          PY
      - name: Read-only source-attested S15/S16 retrospective review
        run: |
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          from adapters.mineflayer.self_demo import review_s49_action_self_world_report
          root = Path(os.environ["RUNNER_TEMP"]) / "stage-k"
          with zipfile.ZipFile(root / "original.zip") as archive:
              matches = [name for name in archive.namelist()
                         if name == "native_report.json" or name.endswith("/native_report.json")]
              receipts = [name for name in archive.namelist()
                          if name == "dev_receipt.json" or name.endswith("/dev_receipt.json")]
              assert len(matches) == len(receipts) == 1
              report = json.loads(archive.read(matches[0]))
              receipt = json.loads(archive.read(receipts[0]))
          assert receipt["git_head"] == "2e75a56d66c9dd32046719d5d1b9f6ff7cd539cc"
          assert receipt["classification"] == "DEV_ONLY"
          assert receipt["run_id"] == "e7d91ef52b7a462bb622a844f8a942f7"
          assert receipt["dev_self_world_input"] == "SOURCE_BOUND"
          assert receipt["dev_self_world_review"] == "undetermined"
          assert receipt["native_actions"] == 2
          assert report["session_id"] == receipt["session_id"]
          reviews = review_s49_action_self_world_report(report)
          result = {
              "stage": "K", "classification": "DEV_ONLY_RETROSPECTIVE",
              "source_run": "39105927208", "source_artifact_id": 12128397812,
              "source_git_head": receipt["git_head"],
              "new_world_launches": 0, "new_native_probes": 0,
              "new_actions": 0, "s17_feedback_created": False,
              "s10_learning_committed": False, "habit_learned": False,
              "observations": reviews,
          }
          (root / "review.json").write_text(json.dumps(result, sort_keys=True, indent=2)+"\n")
          print("STAGE_K_REVIEWS", json.dumps(result, sort_keys=True))
          PY
      - name: Retain exact source-archive replay result, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfworld-stage-k-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stage-k/original.zip
            ${{ runner.temp }}/stage-k/review.json
          if-no-files-found: warn
          retention-days: 30

  selfworld-stage-l-dev-once:
    # Explicit NEW disposable DEV run. Not the Stage J grant nor QUALIFICATION.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && github.ref == 'refs/heads/self/product-self-one-command-selfbody-20261018' && contains(github.event.head_commit.message, '[selfworld-stage-l-dev-once]') }}
