name: Self 1.0 LIGHT / FAST / FULL offline product integration

on:
  push:
    branches:
      - 'self/product-self-one-command-*'
  pull_request:
    branches:
      - 'self/s60b1-loopback-adapter-*'
      - 'self/product-self-one-command-s49scoped-fullreg-20261021'  # CI-only review base
      - main  # FULL is mandatory on a non-Draft PR targeting main
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Explicit offline FAST or FULL; neither launches a World'
        required: true
        type: choice
        options: [fast, full]

env:
  # LIGHT on ordinary push/PR sync; FAST only when owner marks review-ready;
  # FULL for a non-Draft PR targeting main (or explicit owner invocation).
  RELAY_CI_TIER: >-
    ${{ (github.event_name == 'pull_request' && github.base_ref == 'main' && !github.event.pull_request.draft && 'full') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && 'full') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci-full-offline]') && 'full') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'fast' && 'fast') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci-fast-offline]') && 'fast') || (github.event_name == 'pull_request' && (github.event.action == 'ready_for_review' || ((github.event.action == 'opened' || github.event.action == 'reopened') && !github.event.pull_request.draft)) && 'fast') || 'light' }}

permissions:
  contents: read
  actions: read

concurrency:
  group: self-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact head + inherited S60-B1 dependency
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 66b8045fd2b47d9c35febb12c495379d1248bb4e HEAD
          # S49 original evidence and other product owners are immutable.
          # The old single-S49-file gate was historical and contradicted
          # the already existing #545 product branch's integrated changes.
          B0_PARENT=4edac0b139d2d49b0169ffaad7c5892bed7fa2d1
          git merge-base --is-ancestor "$B0_PARENT" HEAD
          # Stage R: explicit opt-in S49 DEV migration; historical
          # evidence is immutable, default route regressed by focused tests.
          test -f adapters/mineflayer/s49_normal_session_real_ci.py
          # Permit ordinary S-owned feature/test growth, not changes in other lanes.
          # Existing S50 seek_execution remains the sole Action issuer; the
          # DEV-only phase hook adds observability, not admission authority.
          changed="$(git diff --name-only --diff-filter=ACDMRTUXB "$B0_PARENT" HEAD)"
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              .github/workflows/self-demo.yml|\
              .github/workflows/self-world-dev-once.yml|\
              .github/workflows/m02-paper-dev-build.yml|\
              .github/workflows/m02-v7-five-arm-dev.yml|\
              .github/workflows/m02-v7-controlled-pose-dev.yml|\
              .github/workflows/s50-five-original-meter-screen.yml|\
              .github/workflows/s50-p1-wait-dev.yml|\
              .github/workflows/s50-flat-four-one-shot-dev.yml|\
              .github/workflows/m02-v7-new-base-on-one-shot-qualification.yml|\
              .github/workflows/m02-v7-remaining-four-one-shot-qualification.yml|\
              .github/workflows/m02-paper-physical-dev.yml|\
              adapters/mineflayer/m02_paper_dev/**|\
              adapters/mineflayer/b0_*.py|\
              adapters/mineflayer/b1_*.py|\
              adapters/mineflayer/bridge.mjs|\
              adapters/mineflayer/protocol.mjs|\
              adapters/mineflayer/protocol.test.mjs|\
              adapters/mineflayer/package.json|\
              adapters/mineflayer/python_protocol.py|\
              adapters/mineflayer/process_session.py|\
              adapters/mineflayer/startup_process_ownership.py|\
              adapters/mineflayer/normal_action.py|\
              adapters/mineflayer/seek_execution.py|\
              adapters/mineflayer/s51_eat_real_ci.py|\
              adapters/mineflayer/self_demo.py|\
              adapters/mineflayer/self_live_think.py|\
              adapters/mineflayer/self_body_projection.py|\
              src/relay_self/self_body.py|\
              docs/selfbody-v0.md|\
              tests/test_self_body.py|\
              adapters/mineflayer/self_world_projection.py|\
              adapters/mineflayer/self_world_prospective.py|\
              adapters/mineflayer/self_world_learning_gate.py|\
              adapters/mineflayer/self_world_native_feedback.py|\
              adapters/mineflayer/self_world_owner_handoff.py|\
              adapters/mineflayer/self_world_epoch_handoff.py|\
              adapters/mineflayer/self_world_epoch_control.py|\
              adapters/mineflayer/self_world_stage_r_owner.py|\
              adapters/mineflayer/self_world_stage_s_feedback.py|\
              adapters/mineflayer/self_world_stage_t_policy.py|\
              adapters/mineflayer/self_world_stage_u_gate.py|\
              adapters/mineflayer/self_world_stage_v_attestation.py|\
              adapters/mineflayer/self_world_stage_v_wait_safety.py|\
              adapters/mineflayer/self_world_stage_w_archive.py|\
              adapters/mineflayer/self_world_stage_w_gate.py|\
              adapters/mineflayer/self_world_stage_w2_ledger_worker.py|\
              adapters/mineflayer/self_world_stage_w2_local_preflight.py|\
              adapters/mineflayer/self_world_stage_w3_capture.py|\
              adapters/mineflayer/self_world_stage_w4_preflight.py|\
              adapters/mineflayer/self_world_stage_w4_window.py|\
              adapters/mineflayer/self_world_stage_w4_logtap.py|\
              adapters/mineflayer/self_world_stage_w4_handoff.py|\
              adapters/mineflayer/self_world_stage_w4_owner_contract.py|\
              adapters/mineflayer/self_world_stage_w4_preprobe.py|\
              adapters/mineflayer/self_world_stage_w4_prehost.py|\
              adapters/mineflayer/self_world_stage_w4_lease.py|\
              adapters/mineflayer/self_world_stage_w4_optin_offline.py|\
              adapters/mineflayer/s49_normal_session_real_ci.py|\
              adapters/mineflayer/s31a_real_server_ci.py|\
              adapters/mineflayer/s34_native_world_cognition_ci.py|\
              src/relay_self/self_world.py|\
              src/relay_self/world_conditioned_choice.py|\
              docs/selfworld-v0.md|\
              docs/selfworld-w2-localcodex.md|\
              docs/selfworld-w3-native-capture.md|\
              docs/selfworld-w4-independent-custody.md|\
              docs/selfworld-w4-nonhold-prereg.md|\
              docs/selfworld-w4-placement-window.md|\
              docs/selfworld-w4-s49-owner-lease-audit.md|\
              docs/selfworld-w4-s49-dev-lease.md|\
              docs/selfworld-w4-s49-optin-review.md|\
              docs/selfworld-w4-s49-optin-composition.md|\
              tests/test_self_world.py|\
              adapters/mineflayer/v6_*.py|\
              adapters/mineflayer/v6_*.mjs|\
              adapters/mineflayer/v6_*.test.mjs|\
              docs/self-demo.md|\
              docs/v6-world-qualification-once.md|\
              experiments/metabolism_viability.py|\
              src/relay_self/eat_hunger.py|\
              tests/test_b0_*.py|\
              tests/test_b1_*.py|\
              tests/test_feature_s51_eat_execution.py|\
              tests/test_s49_cleanup.py|\
              tests/test_s49_startup_ownership.py|\
              tests/test_s49_native_os_custody.py|\
              docs/s49-cancellation-review.md|\
              docs/s49-startup-ownership-review.md|\
              docs/s49-native-os-custody-dev.md|\
              docs/s49-scoped-adoption-v1.md|\
              tests/test_self_dev.py|\
              tests/test_self_live_think.py|\
              tests/test_self_action_evidence.py|\
              tests/test_self_world_prospective.py|\
              tests/test_self_world_learning_gate.py|\
              tests/test_self_world_native_feedback.py|\
              tests/test_self_world_owner_handoff.py|\
              tests/test_self_world_epoch_handoff.py|\
              tests/test_self_world_epoch_control.py|\
              tests/test_self_world_stage_r_owner.py|\
              tests/test_self_world_stage_s_feedback.py|\
              tests/test_self_world_stage_t_policy.py|\
              tests/test_self_world_stage_u_gate.py|\
              tests/test_self_world_stage_v_attestation.py|\
              tests/test_self_world_stage_v_wait_safety.py|\
              tests/test_self_world_stage_w_gate.py|\
              tests/test_self_world_stage_w2_local.py|\
              tests/test_self_world_stage_w3_capture.py|\
              tests/test_self_world_stage_w4.py|\
              tests/test_self_world_stage_w4_window.py|\
              tests/test_self_world_stage_w4_logtap.py|\
              tests/test_self_world_stage_w4_handoff.py|\
              tests/test_self_world_stage_w4_owner_contract.py|\
              tests/test_self_world_stage_w4_preprobe.py|\
              tests/test_self_world_stage_w4_prehost.py|\
              tests/test_self_world_stage_w4_lease.py|\
              tests/test_self_world_stage_w4_optin_offline.py|\
              tests/test_m02_paper_dev.py|\
              tests/test_m02_v8_stopped_world_clone_dev.py|\
              tests/test_m02_v7_new_qualification.py|\
              tests/test_m02_v7_four_arm_qualification.py|\
              tests/test_s50_*.py|\
              tests/test_s50_p1_wait.py|\
              tests/test_s50_p1_scope.py|\
              tests/test_v6_world_qualification.py)
                ;;
              *)
                echo "::error::Non-S-owner path since $B0_PARENT: $path"
                exit 1
                ;;
            esac
          done <<< "$changed"
      - name: FAST/FULL repository-wide contract checks
        if: env.RELAY_CI_TIER != 'light'
        run: python tools/check_repository.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Frozen S V1/V2 producer blob tests require immutable ancestor objects.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: env.RELAY_CI_TIER != 'light'
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: env.RELAY_CI_TIER != 'light'
        with:
          distribution: temurin
          java-version: '21'
      - name: LIGHT syntax checks (no pytest, no World)
        if: env.RELAY_CI_TIER == 'light'
        run: |
          python -m compileall -q src tests experiments adapters observability
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").each { |path| YAML.parse_file(path) }'
          git ls-files -z -- '*.sh' | while IFS= read -r -d '' file; do bash -n "$file"; done
          git ls-files -z -- '*.js' '*.cjs' '*.mjs' | while IFS= read -r -d '' file; do node --check "$file"; done
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
        if: env.RELAY_CI_TIER != 'light'
      - name: FAST owner-focused B0/B1 integration, no physical World
        if: env.RELAY_CI_TIER == 'fast'
        env:
          PYTHONPATH: 'src:tests:.'
        run: |
          python -m adapters.mineflayer.self_demo
          python -m adapters.mineflayer.self_demo --smoke
          python -m pytest -q \
            tests/test_b0_energy_bridge.py \
            tests/test_b0_ground_foraging.py \
            tests/test_b0_two_epoch.py \
            tests/test_b0_rsee.py \
            tests/test_b1_local_adaptation.py \
            tests/test_b1_dev.py \
            tests/test_feature_s51_eat_execution.py \
            tests/test_self_dev.py \
            tests/test_m02_paper_dev.py \
            tests/test_m02_v7_new_qualification.py \
            tests/test_m02_v7_four_arm_qualification.py \
            tests/test_s50_physical_boundary.py \
            tests/test_s50_control_loop_order.py \
            tests/test_s50_packet_trace.py \
            tests/test_s50_p1_wait.py \
            tests/test_s50_p1_scope.py \
            tests/test_self_demo.py \
            tests/test_self_live_think.py \
            tests/test_self_action_evidence.py \
            tests/test_self_world_prospective.py \
            tests/test_self_world_learning_gate.py \
            tests/test_self_world_native_feedback.py \
            tests/test_self_world_owner_handoff.py \
            tests/test_self_world_epoch_handoff.py \
            tests/test_self_world_epoch_control.py \
            tests/test_self_world_stage_r_owner.py \
            tests/test_self_world_stage_s_feedback.py \
            tests/test_self_world_stage_t_policy.py \
            tests/test_self_world_stage_u_gate.py \
            tests/test_self_world_stage_v_attestation.py \
            tests/test_self_world_stage_v_wait_safety.py \
            tests/test_self_world_stage_w_gate.py \
            tests/test_self_world_stage_w2_local.py \
            tests/test_self_world_stage_w3_capture.py \
            tests/test_self_world_stage_w4.py \
            tests/test_self_world_stage_w4_window.py \
            tests/test_self_world_stage_w4_logtap.py \
            tests/test_self_world_stage_w4_handoff.py \
            tests/test_self_world_stage_w4_owner_contract.py \
            tests/test_self_world_stage_w4_preprobe.py \
            tests/test_self_world_stage_w4_prehost.py \
            tests/test_self_world_stage_w4_lease.py \
            tests/test_self_world_stage_w4_optin_offline.py \
            tests/test_mineflayer_process_session.py \
            tests/test_feature_s49_normal_runtime.py \
            tests/test_self_body.py \
            tests/test_self_world.py \
            tests/test_postmain_architecture_freeze.py \
            tests/test_mineflayer_execution_qualification.py \
            tests/test_action_outcome_qualification.py \
            tests/test_s49_cleanup.py \
            tests/test_s49_startup_ownership.py \
            tests/test_s49_native_os_custody.py
      - name: FAST/FULL Mineflayer adapter checks (existing Node 22)
        if: env.RELAY_CI_TIER != 'light'
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          npm run check --prefix adapters/mineflayer
      - name: FULL prepare exact main merge candidate
        if: env.RELAY_CI_TIER == 'full' && github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: FULL exact-head full offline regression (required pytest context for main)
        if: env.RELAY_CI_TIER == 'full'
        env:
          PYTHONPATH: 'src:tests:.'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "main" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          else
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          fi
          python -m pytest -q -o junit_logging=all --junitxml=s49-scoped-full-regression.xml
      - name: Preserve FULL offline JUnit
        if: always() && env.RELAY_CI_TIER == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: s49-scoped-full-${{ github.sha }}
          path: s49-scoped-full-regression.xml
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.7'
      - name: LIGHT fatal syntax/static lint only
        if: env.RELAY_CI_TIER == 'light'
        run: ruff check --select E9,F63,F7,F82 src tests experiments adapters observability
      - name: FAST/FULL complete Ruff lint
        if: env.RELAY_CI_TIER != 'light'
        run: ruff check src tests experiments adapters observability
