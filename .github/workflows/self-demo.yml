name: Self 1.0 one-command product integration

on:
  push:
    branches:
      - 'self/product-self-one-command-*'
  pull_request:
    branches:
      - 'self/s60b1-loopback-adapter-*'
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: self-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact head + inherited S60-B1 dependency
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 66b8045fd2b47d9c35febb12c495379d1248bb4e HEAD
          # S49 original evidence and other product owners are immutable.
          # The old single-S49-file gate was historical and contradicted
          # the already existing #545 product branch's integrated changes.
          B0_PARENT=4edac0b139d2d49b0169ffaad7c5892bed7fa2d1
          git merge-base --is-ancestor "$B0_PARENT" HEAD
          git diff --quiet "$B0_PARENT" HEAD -- adapters/mineflayer/s49_normal_session_real_ci.py
          # Permit ordinary S-owned feature/test growth, not changes in other lanes.
          # Existing S50 seek_execution remains the sole Action issuer; the
          # DEV-only phase hook adds observability, not admission authority.
          changed="$(git diff --name-only --diff-filter=ACDMRTUXB "$B0_PARENT" HEAD)"
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              .github/workflows/self-demo.yml|\
              .github/workflows/m02-paper-dev-build.yml|\
              .github/workflows/m02-v7-five-arm-dev.yml|\
              .github/workflows/m02-v7-controlled-pose-dev.yml|\
              .github/workflows/s50-five-original-meter-screen.yml|\
              .github/workflows/s50-p1-wait-dev.yml|\
              .github/workflows/s50-flat-four-one-shot-dev.yml|\
              .github/workflows/m02-v7-new-base-on-one-shot-qualification.yml|\
              .github/workflows/m02-v7-remaining-four-one-shot-qualification.yml|\
              .github/workflows/m02-paper-physical-dev.yml|\
              adapters/mineflayer/m02_paper_dev/**|\
              adapters/mineflayer/b0_*.py|\
              adapters/mineflayer/b1_*.py|\
              adapters/mineflayer/bridge.mjs|\
              adapters/mineflayer/package.json|\
              adapters/mineflayer/python_protocol.py|\
              adapters/mineflayer/seek_execution.py|\
              adapters/mineflayer/s51_eat_real_ci.py|\
              adapters/mineflayer/self_demo.py|\
              adapters/mineflayer/self_live_think.py|\
              adapters/mineflayer/self_body_projection.py|\
              src/relay_self/self_body.py|\
              docs/selfbody-v0.md|\
              tests/test_self_body.py|\
              adapters/mineflayer/self_world_projection.py|\
              src/relay_self/self_world.py|\
              docs/selfworld-v0.md|\
              tests/test_self_world.py|\
              adapters/mineflayer/v6_*.py|\
              adapters/mineflayer/v6_*.mjs|\
              adapters/mineflayer/v6_*.test.mjs|\
              docs/self-demo.md|\
              docs/v6-world-qualification-once.md|\
              experiments/metabolism_viability.py|\
              src/relay_self/eat_hunger.py|\
              tests/test_b0_*.py|\
              tests/test_b1_*.py|\
              tests/test_feature_s51_eat_execution.py|\
              tests/test_self_dev.py|\
              tests/test_self_live_think.py|\
              tests/test_m02_paper_dev.py|\
              tests/test_m02_v8_stopped_world_clone_dev.py|\
              tests/test_m02_v7_new_qualification.py|\
              tests/test_m02_v7_four_arm_qualification.py|\
              tests/test_s50_*.py|\
              tests/test_s50_p1_wait.py|\
              tests/test_s50_p1_scope.py|\
              tests/test_v6_world_qualification.py)
                ;;
              *)
                echo "::error::Non-S-owner path since $B0_PARENT: $path"
                exit 1
                ;;
            esac
          done <<< "$changed"
      - run: python tools/check_repository.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Frozen S V1/V2 producer blob tests require immutable ancestor objects.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: FAST owner-focused B0/B1 integration, no physical World
        env:
          PYTHONPATH: 'src:tests:.'
        run: |
          python -m adapters.mineflayer.self_demo
          python -m adapters.mineflayer.self_demo --smoke
          python -m pytest -q \
            tests/test_b0_energy_bridge.py \
            tests/test_b0_ground_foraging.py \
            tests/test_b0_two_epoch.py \
            tests/test_b0_rsee.py \
            tests/test_b1_local_adaptation.py \
            tests/test_b1_dev.py \
            tests/test_feature_s51_eat_execution.py \
            tests/test_self_dev.py \
            tests/test_m02_paper_dev.py \
            tests/test_m02_v7_new_qualification.py \
            tests/test_m02_v7_four_arm_qualification.py \
            tests/test_s50_physical_boundary.py \
            tests/test_s50_control_loop_order.py \
            tests/test_s50_packet_trace.py \
            tests/test_s50_p1_wait.py \
            tests/test_s50_p1_scope.py \
            tests/test_self_demo.py \
            tests/test_self_live_think.py \
            tests/test_self_action_evidence.py \
            tests/test_self_body.py \
            tests/test_self_world.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.7'
      - run: ruff check src tests experiments adapters observability

  mineflayer-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - run: npm run check --prefix adapters/mineflayer

  full-regression:
    # Draft runs remain FAST; full inherited tests are a review-stage gate.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - run: python -m pytest -q

  selfworld-stage-j-dev-once:
    # One fresh disposable S49 World only, never on ordinary draft pushes.
    # A marker commit acts as an explicit DEV grant; CI must pass first.
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 && github.ref == 'refs/heads/self/product-self-one-command-selfbody-20261018' && contains(github.event.head_commit.message, '[selfworld-stage-j-dev-once]') }}
    needs: [repository-contracts, pytest, lint, mineflayer-adapter]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      DEV_ROOT: /tmp/selfworld-stage-j-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reaffirm source, exact commit, and fixed Mineflayer version
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$DEV_ROOT"
          java -version
          node --version
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if(require('./adapters/mineflayer/node_modules/mineflayer/package.json').version !== '4.39.0') process.exit(2)"
      - name: Start exactly one explicit DEV_ONLY S49 SelfWorld test
        shell: bash
        run: |
          set -o pipefail
          python -B -m adapters.mineflayer.self_demo \
            --mode DEV --dev-scenario native-selfworld --run-disposable \
            --confirm SELF-DEMO-I-OWN-DISPOSABLE-WORLD \
            --output-dir "$DEV_ROOT" \
            --live-think --self-world-live \
            --model-alias stage-j-backend-not-attested --model-port 16559 \
            --model-timeout 1 \
            | tee "${{ runner.temp }}/selfworld-stage-j-cli.log"
      - name: Preserve this one DEV receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfworld-stage-j-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEV_ROOT }}/dev_receipt.json
            ${{ env.DEV_ROOT }}/SHA256SUMS
            ${{ env.DEV_ROOT }}/native_report.json
            ${{ env.DEV_ROOT }}/minecraft_server.log
            ${{ env.DEV_ROOT }}/host_stdout.log
            ${{ env.DEV_ROOT }}/host_stderr.log
            ${{ env.DEV_ROOT }}/live_l2.jsonl
            ${{ runner.temp }}/selfworld-stage-j-cli.log
          if-no-files-found: warn
          retention-days: 30

