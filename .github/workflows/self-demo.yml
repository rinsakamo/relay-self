name: Self 1.0 one-command product integration

on:
  push:
    branches:
      - 'self/product-self-one-command-*'
  pull_request:
    branches:
      - 'self/s60b1-loopback-adapter-*'

permissions:
  contents: read

concurrency:
  group: self-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact head + inherited S60-B1 dependency
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 66b8045fd2b47d9c35febb12c495379d1248bb4e HEAD
          # S49 original evidence and other product owners are immutable.
          # The old single-S49-file gate was historical and contradicted
          # the already existing #545 product branch's integrated changes.
          B0_PARENT=4edac0b139d2d49b0169ffaad7c5892bed7fa2d1
          git merge-base --is-ancestor "$B0_PARENT" HEAD
          git diff --quiet "$B0_PARENT" HEAD -- adapters/mineflayer/s49_normal_session_real_ci.py
          changed="$(git diff --name-only --diff-filter=ACDMRTUXB "$B0_PARENT" HEAD)"
          expected="$(printf '%s\n' \
            .github/workflows/self-demo.yml \
            adapters/mineflayer/b0_energy_bridge.py \
            adapters/mineflayer/b0_ground_foraging.py \
            adapters/mineflayer/b0_ground_runner.py \
            adapters/mineflayer/s51_eat_real_ci.py \
            docs/self-demo.md \
            experiments/metabolism_viability.py \
            src/relay_self/eat_hunger.py \
            tests/test_b0_energy_bridge.py \
            tests/test_b0_ground_foraging.py \
            tests/test_feature_s51_eat_execution.py
          )"
          test "$changed" = "$expected"
      - run: python tools/check_repository.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Verify usable CLI and integration tests with NO physical World
        env:
          PYTHONPATH: 'src:tests:.'
        run: |
          python -m adapters.mineflayer.self_demo
          python -m adapters.mineflayer.self_demo --smoke
          python -m pytest -q tests/test_b0_energy_bridge.py tests/test_b0_ground_foraging.py tests/test_feature_s51_eat_execution.py
          python -m pytest -q tests/test_self_demo.py tests/test_self_action_evidence.py
          timeout 35s python -m pytest -vv -s -x -o faulthandler_timeout=5 tests/test_self_think.py
          timeout 35s python -m pytest -q -x tests/test_self_live_think.py
          timeout 35s python -m pytest -q -x tests/test_self_owned_llama.py
          python -m pytest -q tests/test_self_timeline.py
          python -m pytest -q tests/test_self_timeline_html.py
          timeout 35s python -m pytest -q -x tests/test_ac_c_c15_goal_witness.py tests/test_self_spatial_review.py
      - name: Full inherited regression
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.7'
      - run: ruff check src tests experiments adapters observability

  mineflayer-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - run: npm run check --prefix adapters/mineflayer
