name: S49 L1-to-T2 Action Boundary DEV
on:
  push:
    branches:
      - self/dev-l1-t2-action-boundary-20261028
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: l1-t2-action-boundary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Focused Python source contracts and regressions
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          python -m compileall -q adapters/mineflayer/s49_goal_t2_boundary_dev.py adapters/mineflayer/s49_goal_executor_dev.py tests/test_s49_goal_t2_boundary_dev.py
          ruff check adapters/mineflayer/s49_goal_t2_boundary_dev.py adapters/mineflayer/s49_goal_executor_dev.py tests/test_s49_goal_t2_boundary_dev.py
          python -m pytest -q tests/test_s49_goal_t2_boundary_dev.py tests/test_s49_l1_grid_refresh_dev.py tests/test_s49_l1_grid_search_dev.py
      - name: Classification
        if: always()
        run: echo 'OFFLINE DEV ONLY / NATIVE T2 CONTINUOUS GAIT NOT VERIFIED / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
