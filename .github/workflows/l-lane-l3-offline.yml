name: L Lane L3 shadow Habit (offline)

on:
  push:
    branches:
      - 'learning/l3-shadow-habit-*'
  pull_request:
    branches:
      - 'learning/l2-forecast-observation-*'

permissions:
  contents: read

concurrency:
  group: l-lane-l3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact L2 parent and L3 head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 66360911c5e8c48ca85f2cf3331566f1218803a0 HEAD
          python tools/check_repository.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: CI-ephemeral-only pytest
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Focused S11 L3/L2/L1 controls
        env:
          PYTHONPATH: 'src:tests:.'
        run: python -m pytest -q tests/test_habit_shadow.py tests/test_forecast_bridge.py tests/test_experience_bridge.py tests/test_habit_qualification.py
      - name: Full inherited regression
        env:
          PYTHONPATH: 'src:tests:.'
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'ruff==0.16.7'
      - run: ruff check src tests experiments adapters observability
