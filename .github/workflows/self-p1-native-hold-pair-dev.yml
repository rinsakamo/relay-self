name: P1 Original S49 First Action Node Hold Audit Two Worlds DEV
on:
  push:
    branches:
      - self/dev-p1-node-hold-audit-20261028
    paths:
      - .github/workflows/self-p1-matched-boost-7ticks-dev.yml
      - adapters/mineflayer/s49_paper_forward_dash_dev.py
      - adapters/mineflayer/s49_speed_attr_boundary_dev.py
      - adapters/mineflayer/s49_p1_synced_motor_pair_dev.py
      - adapters/mineflayer/s49_p1_matched_boost_review_dev.py
      - adapters/mineflayer/s49_p1_native_hold_pair_dev.py
      - adapters/mineflayer/s49_p1_dash_pair_review_dev.py
      - tests/test_s49_p1_synced_motor_pair_dev.py
      - tests/test_s49_p1_matched_boost_review_dev.py
      - tests/test_s49_p1_native_hold_pair_dev.py
      - tests/test_s49_speed_attr_boundary_dev.py
      - adapters/mineflayer/bridge.mjs
      - adapters/mineflayer/s49_speed_attribute_bridge_dev.mjs
      - 'adapters/mineflayer/s49_paper_dash_dev/**'

permissions:
  contents: read

concurrency:
  group: p1-node-hold-first-s49-worlds-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  world-pair-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      S49_REAL_SERVER_CI: '1'
      S49_FORWARD_MOTOR_DEV_ONLY: '1'
      S49_SPRINT_MOTOR_DEV_ONLY: '1'
      S49_P1_LIVE_DASH_DEV_ONLY: '1'
      S49_M0_DASH_DEBIT_DEV_ONLY: '1'
      S49_M0_ACTION_STEP_DEV_ONLY: '1'
      S49_NATIVE_EFFECT_EDGE_DEV_ONLY: '1'
      S49_P1_DASH_PAIR_DEV_ONLY: '1'
      S49_SPEED_ATTR_BOUNDARY_DEV_ONLY: '1'
      S49_SPEED_ATTR_SYNC_DEV_ONLY: '1'
      S49_P1_MATCHED_BOOST_DEV_ONLY: '1'
      DEV_OUTPUT: '/tmp/p1-seven-boost-model-motor-pair-${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Focused Python 3.12, Ruff and bridge syntax BEFORE any World
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.17.0'
          python -m compileall -q adapters/mineflayer/s49_paper_forward_dash_dev.py adapters/mineflayer/s49_speed_attr_boundary_dev.py adapters/mineflayer/s49_p1_synced_motor_pair_dev.py adapters/mineflayer/s49_p1_matched_boost_review_dev.py adapters/mineflayer/s49_p1_native_hold_pair_dev.py tests/test_s49_p1_native_hold_pair_dev.py tests/test_s49_speed_attr_boundary_dev.py tests/test_s49_p1_synced_motor_pair_dev.py tests/test_s49_p1_matched_boost_review_dev.py
          ruff check adapters/mineflayer/s49_paper_forward_dash_dev.py adapters/mineflayer/s49_speed_attr_boundary_dev.py adapters/mineflayer/s49_p1_synced_motor_pair_dev.py adapters/mineflayer/s49_p1_matched_boost_review_dev.py adapters/mineflayer/s49_p1_native_hold_pair_dev.py tests/test_s49_p1_native_hold_pair_dev.py tests/test_s49_speed_attr_boundary_dev.py tests/test_s49_p1_synced_motor_pair_dev.py tests/test_s49_p1_matched_boost_review_dev.py
          python -m pytest -q tests/test_s49_p1_native_hold_pair_dev.py tests/test_s49_p1_matched_boost_review_dev.py tests/test_s49_p1_synced_motor_pair_dev.py tests/test_s49_speed_attr_boundary_dev.py tests/test_s49_p1_dash_pair_review_dev.py tests/test_s49_p1_paper_motor_dev.py tests/test_s49_paper_forward_dash_dev.py tests/test_s49_m0_dash_extra_owner_dev.py tests/test_s49_native_ack_paper_edges_dev.py tests/test_p1_gait_dev.py tests/test_self_action_evidence.py
          node --check adapters/mineflayer/bridge.mjs
          node --check adapters/mineflayer/s49_speed_attribute_bridge_dev.mjs
          node --test adapters/mineflayer/s49_speed_attribute_bridge_dev.test.mjs
      - name: Compile one-shot Paper DASH model preload plugin
        run: |
          mvn -B -ntp -f adapters/mineflayer/s49_paper_dash_dev/pom.xml -DskipTests package
          test -f adapters/mineflayer/s49_paper_dash_dev/target/relay-s49-dash-dev-0.1.0-dev.jar
      - name: Install original Mineflayer unchanged
        run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - name: Fetch official stable Paper 1.21.8 build 60 and verify published SHA256
        id: paper
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          version = "1.21.8"
          api = f"https://fill.papermc.io/v3/projects/paper/versions/{version}/builds"
          ua = "RelaySelf-S49-P1-WORLD-FIRST-DEV/0.1 (https://github.com/rinsakamo/relay-self)"
          req = urllib.request.Request(api, headers={"User-Agent": ua})
          with urllib.request.urlopen(req, timeout=50) as rsp:
              builds = json.loads(rsp.read(3_000_000))
          stable = [b for b in builds if b.get("channel") == "STABLE" and b.get("id") == 60]
          if len(stable) != 1:
              raise RuntimeError("Pinned Paper 1.21.8 stable build 60 unavailable")
          artifact = stable[0]["downloads"]["server:default"]
          expected = "8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e"
          if (artifact["checksums"]["sha256"] != expected
                  or artifact["size"] != 52811717):
              raise RuntimeError("Pinned original Paper build metadata mismatch")
          url = artifact["url"]
          parsed = urllib.parse.urlparse(url)
          if (parsed.scheme != "https" or parsed.hostname != "fill-data.papermc.io"
                  or not parsed.path.startswith("/v1/objects/")):
              raise RuntimeError("Untrusted Paper binary URL")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "paper-1.21.8-dev.jar"
          hash_ = hashlib.sha256()
          total = 0
          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua}), timeout=120) as src, target.open("xb") as dst:
              while chunk := src.read(1048576):
                  total += len(chunk)
                  if total > 52811717: raise RuntimeError("Paper size exceeded")
                  dst.write(chunk)
                  hash_.update(chunk)
          if total != 52811717 or hash_.hexdigest() != expected:
              raise RuntimeError("Paper downloaded bytes mismatch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"jar={target}\nsha256={expected}\n")
          print("PAPER_DEV_PINNED", total, expected)
          PY
      - name: Two fresh Worlds same seven Paper-positive boost callbacks, unchanged original S49
        env:
          PAPER_JAR: ${{ steps.paper.outputs.jar }}
          PAPER_SHA: ${{ steps.paper.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$DEV_OUTPUT"
          DASH="$PWD/adapters/mineflayer/s49_paper_dash_dev/target/relay-s49-dash-dev-0.1.0-dev.jar"
          DASH_SHA="$(sha256sum "$DASH" | cut -d' ' -f1)"
          for CASE in CARRY WAIT_ASSUMED; do
            echo "Fresh original S49 World: $CASE / client speed attribute ON"
            python -m adapters.mineflayer.s49_paper_forward_dash_dev \
              --output-dir "$DEV_OUTPUT/$CASE" \
              --paper-jar "$PAPER_JAR" --paper-sha256 "$PAPER_SHA" \
              --dash-jar "$DASH" --dash-sha256 "$DASH_SHA" \
              --confirm S49-P1-DEV-DISPOSABLE-PAPER-WORLD \
              --p1-live-dev --m0-live-dev --m0-move-dev --native-edges-dev \
              --p1-model-pair-case-dev "$CASE" --speed-attr-boundary-dev --p1-matched-boost-dev
          done
      - name: Independently audit Paper seven-boost and original S49 Node-local hold for BOTH arms
        run: |
          set -euo pipefail
          python -m adapters.mineflayer.s49_p1_matched_boost_review_dev --root "$DEV_OUTPUT"
          python -m adapters.mineflayer.s49_p1_native_hold_pair_dev --root "$DEV_OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["DEV_OUTPUT"])
          r = json.loads((root / "p1_matched_boost_world_comparison_dev.json").read_text())
          assert r["classification"] == "P1_TWO_INDEPENDENT_WORLDS_MATCHED_SEVEN_BONUS_TICKS_DEV_ONLY"
          assert r["same_number_of_positive_paper_boost_ticks"] is True
          assert len(r["positive_matched_paper_speed_delta_by_ordinal_mps"]) == 7
          assert len(r["positive_matched_paper_power_delta_by_ordinal"]) == 7
          assert r["mean_matched_positive_paper_power_delta"] > .1
          for case in ("CARRY", "WAIT_ASSUMED"):
              arm = r["arms"][case]
              assert arm["exact_paper_positive_bonus_ticks"] == 7
              assert arm["positive_last_tick"] - arm["positive_first_tick"] == 6
              assert arm["paper_action_owner_issued"] is False
              assert arm["same_world_tick_clock_as_other_world"] is False
          assert r["original_s49_first_action_duration_matched_by_world_tick"] is False
          assert r["matched_ordinal_not_same_absolute_world_tick"] is True
          assert r["world_clock_phase_matched"] is False
          assert r["model_preload_not_actual_longitudinal_p1_recovery"] is True
          assert r["native_displacement_causally_attributed_only_to_p1"] is False
          assert r["physical_l0_dash_power_admission"] is None
          assert r["new_action_issuers"] == 0 and r["r_qualified_wait_ticks"] == 0
          assert r["qualification_go"] is False and r["science_go"] is False
          print("P1_SEVEN_MATCHED_PAPER_DASH_BONUS_TICKS_DEV_PASS", json.dumps(r, sort_keys=True))
          node = json.loads((root / "p1_first_native_hold_pair_dev.json").read_text())
          assert node["classification"] in (
              "P1_FIRST_ACTION_OBSERVED_NODE_HOLD_AND_TICKS_MATCH_DEV_ONLY",
              "P1_FIRST_ACTION_NODE_HOLD_MATCH_NOT_ESTABLISHED_DEV_ONLY",
          )
          assert node["original_action_duration_tick_controlled_by_node"] is False
          assert node["original_action_tick_controlled_by_paper"] is False
          assert node["paper_and_node_phase_aligned"] is False
          assert node["hypothetical_preload_not_measured_recovery"] is True
          assert node["additional_action_issuers"] == 0
          assert node["additional_native_readers"] == 0
          assert node["qualification_go"] is False and node["science_go"] is False
          print("P1_ORIGINAL_S49_NODE_HOLD_AUDIT_DEV_COMPLETE", json.dumps(node, sort_keys=True))
          PY
      - name: Preserve both World sources whether PASS or FAIL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-node-hold-audit-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEV_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Unchanged DEV-only epistemic boundary
        if: always()
        run: |
          echo 'DEV_ONLY / QUALIFICATION_NO_GO / SCIENCE_NOT_RUN'
          echo 'Two fresh model-F Worlds use original S49 and the identical Paper seven-positive-tick speed-modifier cap.'
          echo 'Seven positive Paper samples and equal Node counts cannot attest synchronized phase, tick-controlled Action holding or real WAIT recovery.'
