name: RSEE stopped World binding offline

on:
  push:
    branches:
      - 'self/rsee-world-binding-offline-*'
      - 'self/rsee-world-bootstrap-*'
      - 'self/rsee-golden-admission-*'
      - 'self/rsee-golden-host-readonly-gate-*'
      - 'self/rsee-world-bootstrap-*'
      - 'self/rsee-golden-admission-*'
      - 'self/rsee-golden-host-readonly-gate-*'
      - 'self/rsee-central-runtime-*'
      - 'self/rsee-live-binding-evidence-*'
      - 'self/rsee-props-1mib-*'
      - 'self/self1-relayui-replay-*'
      - 'self/self1-bounded-session-*'
  pull_request:
    branches:
      - 'infra/rsee-wsl2-host-preparation-*'
      - 'self/rsee-world-binding-offline-*'

permissions:
  contents: read

concurrency:
  group: world-bind-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact head / preflight base
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor bda89ca2204fff006b6682125f9fc8349407eeed HEAD
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.16.7'
      - name: Deterministic World/S49 pre-Java and inherited product gates
        env:
          PYTHONPATH: 'src:tests:.'
        run: |
          python -m pytest -q tests/test_rsee_world_binding.py tests/test_rsee_world_bootstrap.py tests/test_rsee_golden_admission.py tests/test_rsee_golden_host_gate.py tests/test_rsee_node_runtime.py tests/test_rsee_product_gate.py tests/test_self_demo.py tests/test_self_replay_ui.py tests/test_self_continuous_host.py tests/test_self_owned_llama.py tests/test_standard_env_preflight.py
      - name: Ruff
        run: ruff check src tests experiments adapters observability
      - name: Repository contracts
        run: python tools/check_repository.py

  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'
      - name: Inherited Python suite without real Java/GPU/World
        env:
          PYTHONPATH: 'src:tests:.'
        run: python -m pytest -q

  mineflayer-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
      - run: npm run check --prefix adapters/mineflayer
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Actual external npm root and product Mineflayer import (no World)
        env:
          PYTHONPATH: 'src:tests:.'
        run: |
          ROOT="$RUNNER_TEMP/rsee-npm-mineflayer-4.39.0"
          test ! -e "$ROOT"
          mkdir -- "$ROOT"
          cp adapters/mineflayer/package.json "$ROOT/package.json"
          cp adapters/mineflayer/package-lock.json "$ROOT/package-lock.json"
          npm ci --prefix "$ROOT" --ignore-scripts --omit=dev --no-audit --no-fund --fetch-retries=0
          RSEE_NODE_ROOT="$ROOT" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from adapters.mineflayer.self_owned_llama import _preflight_mineflayer_dependencies
          root = Path(os.environ["RSEE_NODE_ROOT"])
          result = _preflight_mineflayer_dependencies(root)
          assert result["node_runtime_root"] == str(root)
          assert result["mineflayer"] == "4.39.0"
          assert result["mineflayer_installed_version"] == "4.39.0"
          print(json.dumps({
              "qualification": "EXTERNAL_NODE_IMPORT_CI_ONLY",
              "node_runtime_root": str(root),
              "source_lock_sha256": result["source_lock_sha256"],
              "mineflayer_entry": result["mineflayer_entry"],
              "minecraft_protocol_entry": result["minecraft_protocol_entry"],
              "minecraft_launched": False,
              "llm_post": 0,
          }, sort_keys=True))
          PY
