name: S FLAT P1 original Paper MOVE source-only preview
on:
  push:
    branches: ['self/product-self-one-command-20261010']
    paths: ['.github/workflows/s50-flat-p1-original-motion-once.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: s-flat-p1-original-motion-preview-3900
  cancel-in-progress: false
jobs:
  original-motion-no-java:
    if: "github.run_attempt == 1 && github.event.head_commit.message == 'S FLAT P1: one offline original motion review without body admission'"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: rinsakamo/relay-self
      S_RUN: '38994504183'
      S_HEAD: '9cb7a009b392ea8127528c310171d804251c90ec'
      S_ART: '12086324331'
      S_SHA: '6bd9d446eefb0a27a7599cdc4d1b79837bff3ef14d6c12ef6361435a9ea69ca6'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: s
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: All bridge negative controls before original download
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'ruff==0.16.7'
          PYTHONPATH=s/src:s/tests:s python -m pytest -q s/tests/test_s50_flat_p1_motion.py
          ruff check s/adapters/mineflayer/m02_paper_dev/s50_flat_p1_motion.py s/tests/test_s50_flat_p1_motion.py
      - name: Pin immutable source metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ["GH_REPO"]
          def api(path):
              return json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/{path}"]))
          run=api("actions/runs/"+os.environ["S_RUN"])
          art=api("actions/artifacts/"+os.environ["S_ART"])
          assert run["head_sha"]==os.environ["S_HEAD"] and run["run_attempt"]==1
          assert run["conclusion"]=="success"
          assert art["workflow_run"]["id"]==run["id"] and not art["expired"]
          assert art["digest"]=="sha256:"+os.environ["S_SHA"]
          print("S_P1_FLAT_ORIGINAL_SOURCE_METADATA_PINNED")
          PY
      - name: Download immutable physical archive without starting Java or Node
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flat-four-original"
          gh api "repos/$GH_REPO/actions/artifacts/$S_ART/zip" > "$RUNNER_TEMP/flat-four-original.zip"
          echo "$S_SHA  $RUNNER_TEMP/flat-four-original.zip" | sha256sum -c -
          python - <<'PY'
          import os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(root/"flat-four-original.zip") as z:
              names=z.namelist()
              assert all(not pathlib.PurePosixPath(n).is_absolute()
                         and ".." not in pathlib.PurePosixPath(n).parts
                         for n in names)
              z.extractall(root/"flat-four-original")
          print("S_P1_FLAT_ORIGINAL_ARCHIVE_ZIP_SHA_MATCH")
          PY
      - name: Replay four original Paper MOVE source witnesses, no P1 state mutation
        env:
          PYTHONPATH: s/src:s/tests:s
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          from adapters.mineflayer.m02_paper_dev.s50_flat_p1_motion import read_archived_original
          top=pathlib.Path(os.environ["RUNNER_TEMP"])
          base=top/"flat-four-original/flat-four-results"
          arms=("SHAM_ON","BASAL_ZERO","WALK_ZERO","BOTH_ZERO")
          result={a:read_archived_original(base/a,arm=a) for a in arms}
          assert all(x["p1_wait_ticks_admitted"]==0
                     and x["p1_fatigue_recovered"]==0.0
                     and x["P1_state_advanced"] is False
                     and x["native_observed_horizontal_blocks"]>0
                     for x in result.values())
          receipt={"classification":"S_FLAT_FOUR_NATIVE_MOTION_TO_P1_CANDIDATE_DEV_ONLY",
                   "s_original_run":int(os.environ["S_RUN"]),
                   "s_original_head":os.environ["S_HEAD"],
                   "s_original_artifact_sha256":os.environ["S_SHA"],
                   "arms":result,"source_sha_validated":True,
                   "new_java_starts":0,"new_node_starts":0,
                   "p1_recovery_admitted":False,"p1_state_advanced":False,
                   "science_trials":0,"r_independent_attestation":"PENDING"}
          (top/"s-flat-p1-original-motion-receipt.json").write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("S_FLAT_FOUR_ORIGINAL_MOTION_CANDIDATE_DEV_ONLY",
                json.dumps({a:{"blocks":v["native_observed_horizontal_blocks"],
                               "motion_ticks":v["native_moving_tick_count"],
                               "hypothetical_fatigue":v["hypothetical_P1_motion_gain_unadmitted"]}
                            for a,v in result.items()},sort_keys=True))
          PY
      - name: Retain source-only candidate receipt even if original fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-flat-p1-original-motion-${{ github.run_id }}
          path: ${{ runner.temp }}/s-flat-p1-original-motion-receipt.json
          if-no-files-found: warn
          retention-days: 90
