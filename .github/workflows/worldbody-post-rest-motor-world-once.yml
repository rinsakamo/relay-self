name: WorldBody same S49 third motor recovery after REST one Paper DEV World
on:
  push:
    branches:
      - dev/worldbody-post-rest-motor-retest-20261105

permissions:
  contents: read

jobs:
  one-world:
    # Unique child grant only. No automatic retries.
    if: ${{ github.event.head_commit.message == 'run-worldbody-post-rest-motor-once-20261105' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S49_REAL_SERVER_CI: '1'
      S49_WORLDBODY_DEV_ONLY: '1'
      S49_WORLDBODY_RETEST_DEV_ONLY: '1'
      PYTHONPATH: 'src:tests:.'
      PYTHONDONTWRITEBYTECODE: '1'
      NODE_OPTIONS: ''
    steps:
      - name: Checkout exact original S49 owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: WorldBody fixed-law, S16 direct and pre-World negative controls
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m pytest -q tests/test_worldbody_fixed_physics_dev.py tests/test_worldbody_post_rest_motor_retest.py tests/test_self_body.py tests/test_bug0_s49_rest_dev.py
          python - <<'PY'
          import socket
          with socket.socket(socket.AF_INET,socket.SOCK_STREAM) as sock:
              assert sock.connect_ex(('127.0.0.1',25565)) != 0
          PY
      - name: Verify unique single-purpose child trigger before Paper World
        run: |
          test "$(git show --format= --name-only HEAD | sed '/^$/d')" = "docs/worldbody-third-motor-single-world-trigger-20261105.md"
          test "$(git show --format=%s -s HEAD)" = "run-worldbody-post-rest-motor-once-20261105"
          echo 'ONE_EXPLICIT_ORIGINAL_S49_POST_REST_MOTOR_WORLD_AUTHORIZED'
      - name: Download official pinned Paper 1.21.8 STABLE #60
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.parse, urllib.request
          version='1.21.8'
          url=f'https://fill.papermc.io/v3/projects/paper/versions/{version}/builds'
          request=urllib.request.Request(url,headers={'User-Agent':'RelaySelf-Bug0-DEV/1.0 (https://github.com/rinsakamo/relay-self)'})
          with urllib.request.urlopen(request,timeout=50) as res:
              data=res.read(3000000)
          assert len(data)<3000000
          builds=json.loads(data)
          builds=[x for x in builds if x.get('channel')=='STABLE' and x.get('id')==60]
          assert len(builds)==1, 'pinned Paper build unavailable'
          p=builds[0]['downloads']['server:default']
          assert p['name']=='paper-1.21.8-60.jar'
          assert p['size']==52811717
          assert p['checksums']['sha256']=='8de7c52c3b02403503d16fac58003f1efef7dd7a0256786843927fa92ee57f1e'
          uri=urllib.parse.urlparse(p['url'])
          assert uri.scheme=='https' and uri.hostname=='fill-data.papermc.io' and uri.path.startswith('/v1/objects/')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'paper-1.21.8.jar'
          digest=hashlib.sha256()
          n=0
          with urllib.request.urlopen(urllib.request.Request(p['url'],headers={'User-Agent':'RelaySelf-Bug0-DEV/1.0'}),timeout=120) as stream, target.open('xb') as out:
              while chunk:=stream.read(1024*1024):
                  n+=len(chunk)
                  assert n<=p['size']
                  digest.update(chunk)
                  out.write(chunk)
          assert n==52811717 and digest.hexdigest()==p['checksums']['sha256']
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as f:
              f.write('S49_WB_PAPER_JAR='+str(target)+'\n')
          print('PINNED_PAPER_1_21_8_DEV_OK')
          PY
      - name: Build independent server-only fixed WorldBody physical module
        run: |
          mvn -B -ntp -f adapters/mineflayer/worldbody_physics_dev/pom.xml -DskipTests package
          python - <<'PY'
          import hashlib, os, pathlib
          plugin=pathlib.Path('adapters/mineflayer/worldbody_physics_dev/target/relay-worldbody-physics-dev-0.1.0-dev.jar').resolve()
          assert plugin.is_file() and not plugin.is_symlink()
          sha=hashlib.sha256(plugin.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as f:
              f.write('S49_WB_PLUGIN_JAR='+str(plugin)+'\n')
              f.write('S49_WB_PLUGIN_SHA256='+sha+'\n')
          print('IMMUTABLE_WORLD_SERVER_RULES_SHA256='+sha)
          PY
      - name: Install pinned original Mineflayer
        run: |
          npm ci --omit=dev --no-audit --no-fund --prefix adapters/mineflayer
          node -e "if (require('./adapters/mineflayer/node_modules/mineflayer/package.json').version!=='4.39.0') process.exit(2)"
      - name: One original S49 World with third granted MOVE after native REST
        run: |
          mkdir -p worldbody-retest-evidence
          python -B -m adapters.mineflayer.s49_normal_session_real_ci \
            --worldbody-retest-dev \
            --report worldbody-retest-evidence/s49_original_worldbody.json \
            --server-log worldbody-retest-evidence/paper_original.log
      - name: Audit original third S16 and separate WorldBody server source
        run: |
          python -B tools/worldbody_post_rest_motor_retest_post.py \
            --report worldbody-retest-evidence/s49_original_worldbody.json \
            --paper-log worldbody-retest-evidence/paper_original.log \
            --out worldbody-retest-evidence/worldbody_post_rest_retest_post.json
      - name: Preserve original raw Paper World, S16 receipts and SHA256
        if: always()
        run: |
          if test -d worldbody-retest-evidence; then
            (cd worldbody-retest-evidence && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)
          fi
      - name: Archive immutable World evidence with third native S16 and private Paper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldbody-original-s49-post-rest-third-motor-one-world
          path: worldbody-retest-evidence/
          if-no-files-found: warn
          retention-days: 30
