name: RelayS49DashDev
main: io.github.rinsakamo.relays49dash.S49DashDevPlugin
version: '0.1.0-dev'
api-version: '1.21.8'
description: 'DEV-only fail-closed forward DASH modifier; no Action authorization'
load: POSTWORLD
commands:
  relays49dasharm:
    description: 'Disposable console DEV arm, not an Action permission'
    usage: '/relays49dasharm <action_id> <session_id> <player_uuid> <power>'
  relays49dashoff:
    description: 'Disposable console DEV release; clears the own transient modifier'
    usage: '/relays49dashoff <action_id> <session_id> <player_uuid>'
  relays49dashmark:
    description: 'DEV Paper timestamp AFTER already received original Mineflayer control ACK'
    usage: '/relays49dashmark <action_id> <session_id> <player_uuid> <APPLIED|CLEARED> <native_seq>'
  relays49dashtrailmark:
    description: 'Read-only Paper delivery tick after second native S49 ACK, no DASH motor mutation'
    usage: '/relays49dashtrailmark <action_id> <session_id> <player_uuid> <APPLIED|CLEARED> <native_seq>'
  relays49dashownerfence:
    description: 'Original S49 owner START/END causal marker, passive Paper fullTime only'
    usage: '/relays49dashownerfence <first_action_id> <session_id> <player_uuid> <START|END> <second_action_id|NONE>'
