name: RelayMetabolismDev
main: io.github.rinsakamo.relaymetabolism.RelayMetabolismPlugin
version: '0.2.0-dev'
api-version: '1.21.8'
description: 'Isolated DEV-only metabolic exhaustion modifier. Disabled by default.'
load: POSTWORLD

commands:
  relaydevphase:
    description: 'Console-only S DEV Paper tick marker; no Action authorization'
    usage: '/relaydevphase <marker_id> <phase>'

  relaydevwait:
    description: 'Console-only post-S50 World WAIT observation candidate; no P1 recovery'
    usage: '/relaydevwait <marker_id>'
