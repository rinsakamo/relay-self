name: RelayMetabolismDev
main: io.github.rinsakamo.relaymetabolism.RelayMetabolismPlugin
version: '0.2.0-dev'
api-version: '1.21.8'
description: 'Isolated DEV-only metabolic exhaustion modifier. Disabled by default.'
load: POSTWORLD

commands:
  relaydevphase:
    description: 'Console-only S DEV Paper tick marker; no Action authorization'
    usage: '/relaydevphase <marker_id> <phase>'

  relaydevwait:
    description: 'Console-only post-S50 World WAIT observation candidate; no P1 recovery'
    usage: '/relaydevwait <marker_id>'

  relaydevicefloor:
    description: 'Console-only MP7 physical packed-ice floor pre-S49 Action'
    usage: '/relaydevicefloor <marker_id> PACKED_ICE_5X5'

  relaydevcondition:
    description: 'Console-only MP6 experimenter-owned Slowness II before original S49 Action'
    usage: '/relaydevcondition <marker_id> SLOWNESS_II'

  relaydevlocalmodel:
    description: 'Console-only one-shot pre-S49 DEV shadow model arm, no Action'
    usage: '/relaydevlocalmodel <marker_id> <slope> <model_ticket_sha256>'

  relaydevforecast:
    description: 'Console-only opt-in DEV Paper future-tick prediction acceptance; no Action'
    usage: '/relaydevforecast <marker_id> <prior_tick> <target_tick> <predicted_m> <ticket_sha256>'

  relaydevsnapshot:
    description: 'Console-only native V8 DEV body/pose/time observation; no mutations'
    usage: '/relaydevsnapshot <marker_id>'
