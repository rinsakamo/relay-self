# Disabled unless an independently approved disposable Paper DEV World opts in.
# The 600-tick physical delay and spawn rules are server-side constants.
# This file does not expose any Self-side timer/rate/API.
dev-enabled: false
target-player: RelaySelf

# D14 opt-in only: observe a single World for exactly 10000 server ticks
# after initial managed-zombie spawn. Not a zombie-generation limit.
# Keeps vanilla loot RNG and the existing death + 600-tick respawn rule.
dev-tick-endurance-enabled: false
dev-tick-endurance-ticks: 0
dev-tick-sample-interval: 200

# D14 R3 only: use vanilla daytime burning instead of D8 arena sun immunity.
# NoAI / Health / Hunger or teleporting are NOT modified by the plugin.
dev-natural-world-mode: false
